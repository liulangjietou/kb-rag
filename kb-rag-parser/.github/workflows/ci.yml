name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # OCR_ENGINE=paddle dependencies (requirements-ocr.txt) are
      # intentionally NOT installed here, to keep CI fast and match the
      # default deployment posture (see requirements-ocr.txt's own header
      # comment and README.md). Tests exercising real PaddleOCR inference
      # are skipped via pytest.mark.skipif when the paddleocr package is
      # not importable (see tests/test_parse_pdf_ocr.py); the OCR_ENGINE
      # fast-fail-on-missing-dependency path itself is still covered.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
