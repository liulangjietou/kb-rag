# Every value is injected from an environment variable with a working local default, so the service
# starts with no .env file. Variable names follow the deployment contract.
server:
  port: ${SERVER_PORT:20000}
  # ClientIpResolver 必须看到原始 socket peer，再按 TRUSTED_PROXY_CIDRS 解析转发链。
  # 禁止容器在应用白名单之前改写 remoteAddr。
  forward-headers-strategy: none

spring:
  application:
    name: kb-rag-server
  autoconfigure:
    # The neo4j-java-driver on the classpath makes Spring Boot auto create a Driver against its default
    # bolt://localhost:7687 whenever our own conditional driver backs off (blank NEO4J_URI), and the
    # actuator then registers a neo4j health probe that reports DOWN on every graph-less deployment -
    # defeating the "blank URI leaves everything else untouched" contract (M7-CONTRACTS.md 0.1). The
    # graph stack is wired exclusively through GraphStoreConfig, so the auto configuration is excluded.
    #
    # Redis 是同一类问题，也用同一种办法处理。spring-boot-starter-data-redis 在 classpath 上（会话可以
    # 存 Redis），Boot 便会无条件建出一个 RedisConnectionFactory，actuator 随即注册 Redis 健康探针，
    # 于是每一套 cache.provider=local 的部署都会因为连不上一个它根本没有的 Redis 而报 DOWN。连接工厂
    # 改由 ConsoleSessionConfig 只在 redis 模式下声明。
    #
    # Sa-Token 的 Redis 存储实现同理，但原因更硬：它是个没有 @ConditionalOnMissingBean 的自动装配类，
    # 只要 jar 在 classpath 上就注册，而框架侧是单值注入 SaTokenDao 的——两个实现同时存在会直接启动失败。
    # 两种存储都改由 ConsoleSessionConfig 按 kb.cache.provider 二选一显式装配。
    exclude:
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - cn.dev33.satoken.dao.SaTokenDaoForRedisTemplate
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${MYSQL_DB:kb_rag}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:kbrag}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:10}
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      # Kept slightly above the application level limit so the upload validator, not the container,
      # produces the error message.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:110MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:110MB}
  jackson:
    default-property-inclusion: non_null
  data:
    # 仅在 kb.cache.provider=redis 时被读取（见 ConsoleSessionConfig）。留在这里而不是另起一套
    # kb.redis.* 配置，是为了让运维用他们已经熟悉的 Spring 标准键名。
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  server:
    # Actuator is an operations surface, not a business API. Keep it on a separate loopback-only
    # listener by default so health details and metrics are not published with the console API.
    port: ${MANAGEMENT_SERVER_PORT:20003}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Component names and failure details reveal deployment topology. The aggregate status is
      # sufficient for probes; operators should use logs to diagnose a DOWN response.
      show-details: never
  health:
    defaults:
      enabled: true

# 控制台会话框架。会话时长不在这里配：它由 kb.auth.token-ttl-hours 统一决定，
# 由 ConsoleSessionConfig 在启动时写入框架配置，避免同一件事出现两个可改的地方。
sa-token:
  # 会话令牌走自定义请求头。名字用框架默认值，正好也和开放 API 的 Authorization: Bearer 分了家——
  # 控制台会话、API Key、Memory Key 三种凭据从此在请求头上互不相干。
  token-name: satoken
  is-read-header: true
  # 不读 Cookie 是这套设计的安全前提，不是风格选择：浏览器不会替攻击者带上自定义请求头，
  # 跨站请求伪造因此在构造上就不成立。一旦打开，整个管理 API 都需要另配 CSRF 防护。
  is-read-cookie: false
  # 令牌由登录响应体返回、前端自行保管，不需要框架再写一份到响应头。
  is-write-header: false
  # 64 位随机字符，熵不低于换框架之前的 32 字节随机令牌。
  token-style: random-64
  # 允许同一账号在多处登录（换框架前就是如此：每次登录各自签发令牌，互不影响）。
  is-concurrent: true
  # 但不共享令牌：每次登录签发新的一个，与换框架前的行为一致。
  is-share: false
  # 只保留绝对过期，不启用"多久没操作就失效"。换框架前没有这个语义，
  # 悄悄加上会让长时间阅读文档的用户被动登出。
  active-timeout: -1
  # 关掉框架自带的启动横幅：本项目有自己的 banner.txt，MyBatis-Plus 的横幅同样是关的（见上面的
  # mybatis-plus.global-config.banner）。第三方 logo 逐个堆进启动日志，会把真正要看的信息挤下去。
  # 想确认 Sa-Token 是否接管了会话，看 ConsoleSessionConfig 打的那两行 initialized / timeout aligned。
  is-print: true
# 邮件开关与凭据完全由部署环境提供。enabled=true 但必需字段为空时，发送端口仍保持不可用，
# 避免审核或验证码流程反复连接一个并不存在的 SMTP 服务。
mail:
  enabled: ${ADMIN_MAIL_ENABLED:false}
  host: ${ADMIN_MAIL_HOST:smtp.163.com}
  port: ${ADMIN_MAIL_PORT:465}
  username: ${ADMIN_MAIL_USERNAME:}
  password: ${ADMIN_MAIL_PASSWORD:}
  from: ${ADMIN_MAIL_FROM:}
  login-url: ${ADMIN_MAIL_LOGIN_URL:}
  ssl-enabled: ${ADMIN_MAIL_SSL_ENABLED:true}
  connect-timeout-ms: ${ADMIN_MAIL_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${ADMIN_MAIL_READ_TIMEOUT_MS:10000}
  write-timeout-ms: ${ADMIN_MAIL_WRITE_TIMEOUT_MS:10000}

# 注册 HMAC 密钥必须由环境显式注入；源码默认空值不会形成所有部署共享的伪密钥。
registration:
  enabled: ${REGISTRATION_ENABLED:true}
  code-hmac-key: ${REGISTRATION_HMAC_KEY:}
  code-ttl-minutes: ${REGISTRATION_CODE_TTL_MINUTES:10}
  ticket-ttl-minutes: ${REGISTRATION_TICKET_TTL_MINUTES:15}
  resend-seconds: ${REGISTRATION_RESEND_SECONDS:60}
  max-attempts: ${REGISTRATION_MAX_ATTEMPTS:5}
  # 同步 SMTP 发送位于数据库事务之外，并发上限必须低于默认 Hikari 连接池容量（10）。
  mail-concurrency: ${REGISTRATION_MAIL_CONCURRENCY:4}
  # BCrypt 在轻量票据预检后、数据库事务外执行；CPU 槽位耗尽时立即拒绝。
  password-hash-concurrency: ${REGISTRATION_PASSWORD_HASH_CONCURRENCY:2}
  email-rate-limit-per-hour: ${REGISTRATION_EMAIL_RATE_LIMIT_PER_HOUR:6}
  ip-rate-limit-per-hour: ${REGISTRATION_IP_RATE_LIMIT_PER_HOUR:20}
  global-rate-limit-per-minute: ${REGISTRATION_GLOBAL_RATE_LIMIT_PER_MINUTE:100}
  verify-ip-rate-limit-per-hour: ${REGISTRATION_VERIFY_IP_RATE_LIMIT_PER_HOUR:60}
  verify-global-rate-limit-per-minute: ${REGISTRATION_VERIFY_GLOBAL_RATE_LIMIT_PER_MINUTE:300}
  submit-ip-rate-limit-per-hour: ${REGISTRATION_SUBMIT_IP_RATE_LIMIT_PER_HOUR:20}
  submit-global-rate-limit-per-minute: ${REGISTRATION_SUBMIT_GLOBAL_RATE_LIMIT_PER_MINUTE:100}
  outbox:
    batch-size: ${REGISTRATION_OUTBOX_BATCH_SIZE:50}
    max-retries: ${REGISTRATION_OUTBOX_MAX_RETRIES:5}
    retry-delay-seconds: ${REGISTRATION_OUTBOX_RETRY_DELAY_SECONDS:60}
    lease-seconds: ${REGISTRATION_OUTBOX_LEASE_SECONDS:60}
    dispatch-interval-ms: ${REGISTRATION_OUTBOX_DISPATCH_INTERVAL_MS:5000}
  cleanup:
    enabled: ${REGISTRATION_CLEANUP_ENABLED:true}
    verification-retention-hours: ${REGISTRATION_VERIFICATION_RETENTION_HOURS:24}
    terminal-verification-retention-days: ${REGISTRATION_TERMINAL_VERIFICATION_RETENTION_DAYS:7}
    pending-application-ttl-days: ${REGISTRATION_PENDING_APPLICATION_TTL_DAYS:30}
    batch-size: ${REGISTRATION_CLEANUP_BATCH_SIZE:200}
    max-batches-per-run: ${REGISTRATION_CLEANUP_MAX_BATCHES_PER_RUN:50}
    cron: ${REGISTRATION_CLEANUP_CRON:0 15 * * * *}
kb:
  # 易失性共享状态的存放位置，需求文档 §5 的"Redis 职责边界"落点。
  # local：控制台会话写进 MySQL，单实例部署无需 Redis，进程重启后会话仍然有效。
  # redis：会话交给 Sa-Token 官方适配，多实例部署下各节点共享同一份登录态。
  # 该开关同时决定会话与 RBAC 权限缓存的存放位置，两者同步切换、不可分开配置——只共享其一会造成
  # 「登录态跨节点一致、授权判据不一致」的错位。详见 README 的"多实例部署"一节。
  cache:
    provider: ${KB_CACHE_PROVIDER:redis}
  vector:
    engine: ${VECTOR_ENGINE:es}
  es:
    uri: ${ES_URI:http://127.0.0.1:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    content-analyzer: ${ES_CONTENT_ANALYZER:ik_max_word}
    fallback-analyzer: standard
    number-of-shards: ${ES_NUMBER_OF_SHARDS:1}
    number-of-replicas: ${ES_NUMBER_OF_REPLICAS:0}
  qdrant:
    uri: ${QDRANT_URI:}
    api-key: ${QDRANT_API_KEY:}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:kb-files}
    presigned-ttl-minutes: ${MINIO_PRESIGNED_TTL_MINUTES:30}
  embedding:
    provider: ${EMBEDDING_PROVIDER:dashscope}
    model: ${EMBEDDING_MODEL:text-embedding-v4}
    dimension: ${EMBEDDING_DIM:1024}
    # Blank switches the deployment to zero key mode: embedding is skipped and retrieval runs BM25 only.
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    batch-size: ${EMBEDDING_BATCH_SIZE:10}
    # Provider requests in flight while one document is embedded; batches share nothing, so this is what
    # keeps a 500 chunk document from being 50 sequential round trips. Global ceiling (shared pool), so
    # several documents indexing at once still cannot exceed it. Set to 1 for the pre-M16 sequential shape.
    concurrency: ${EMBEDDING_CONCURRENCY:4}
    timeout-ms: ${EMBEDDING_TIMEOUT_MS:30000}
  multimodal-embedding:
    provider: ${MULTIMODAL_EMBEDDING_PROVIDER:dashscope}
    model: ${MULTIMODAL_EMBEDDING_MODEL:multimodal-embedding-v1}
    dimension: ${MULTIMODAL_EMBEDDING_DIM:1024}
    # Blank switches the whole multimodal capability off; inherits the shared DashScope key by default,
    # so setting DASHSCOPE_API_KEY alone turns image indexing/search on (M14 contract section 6.1).
    api-key: ${MULTIMODAL_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
    # DashScope exposes multimodal embedding outside the OpenAI compatible surface, so this is a full URL.
    url: ${MULTIMODAL_EMBEDDING_URL:https://dashscope.aliyuncs.com/api/v1/services/embeddings/multimodal-embedding/multimodal-embedding}
    batch-size: ${MULTIMODAL_EMBEDDING_BATCH_SIZE:8}
    timeout-ms: ${MULTIMODAL_EMBEDDING_TIMEOUT_MS:30000}
  rerank:
    provider: ${RERANK_PROVIDER:dashscope}
    model: ${RERANK_MODEL:gte-rerank-v2}
    # Blank disables the rerank stage; the retrieval pipeline then keeps the fusion order.
    api-key: ${RERANK_API_KEY:${DASHSCOPE_API_KEY:}}
    # DashScope exposes rerank outside the OpenAI compatible surface, so this is a full URL.
    url: ${RERANK_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
    timeout-ms: ${RERANK_TIMEOUT_MS:1500}
    candidate-limit: ${RERANK_CANDIDATE_LIMIT:50}
  chat:
    provider: ${CHAT_PROVIDER:dashscope}
    model: ${CHAT_MODEL:qwen-plus}
    # Blank disables the query rewrite stage.
    api-key: ${CHAT_API_KEY:${DASHSCOPE_API_KEY:}}
    base-url: ${CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    timeout-ms: ${CHAT_TIMEOUT_MS:3000}
    # Read ceiling of answer generation only; routing/rewrite keep their own shorter future budgets.
    generate-timeout-ms: ${CHAT_GENERATE_TIMEOUT_MS:60000}
    temperature: ${CHAT_TEMPERATURE:0.0}
    max-tokens: ${CHAT_MAX_TOKENS:128}
    # Generation budget of the open chat endpoint; max-tokens above sizes a one line query rewrite and would
    # cut every answer off mid sentence.
    answer-max-tokens: ${CHAT_ANSWER_MAX_TOKENS:1024}
  vision:
    provider: ${VISION_PROVIDER:dashscope}
    model: ${VISION_MODEL:qwen-vl-max}
    # Blank stores images without a textual proxy; the rest of the document is still indexed.
    api-key: ${VISION_API_KEY:${DASHSCOPE_API_KEY:}}
    base-url: ${VISION_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    # Image understanding is slower than text completion, hence the wider budget.
    timeout-ms: ${VISION_TIMEOUT_MS:20000}
    temperature: ${VISION_TEMPERATURE:0.0}
    max-tokens: ${VISION_MAX_TOKENS:1024}
  image:
    standalone-extensions: ${IMAGE_STANDALONE_EXTENSIONS:png,jpg,jpeg,webp,bmp,gif}
    max-per-document: ${MAX_IMAGES_PER_DOC:100}
    max-image-size-mb: ${MAX_IMAGE_SIZE_MB:10}
    # Vision calls in flight per document. One image is one round trip of up to vision.timeout-ms, so
    # serial calls made a fully illustrated document occupy a pipeline slot for half an hour. Bounded by
    # the provider rate limit, not by the machine: a throttled call becomes a failed proxy, not a retry.
    describe-concurrency: ${IMAGE_DESCRIBE_CONCURRENCY:8}
  chat-import:
    default-mapping-profile: ${CHAT_MAPPING_PROFILE:memotrace}
    upload-token-ttl-minutes: ${CHAT_UPLOAD_TOKEN_TTL_MINUTES:30}
    # A chat log is personal data by nature, so masking is on for this path by default.
    desensitize-default: ${CHAT_DESENSITIZE_DEFAULT:true}
  alert:
    degrade-window-minutes: ${ALERT_DEGRADE_WINDOW_MINUTES:5}
    degrade-min-samples: ${ALERT_DEGRADE_MIN_SAMPLES:20}
    evaluation-interval-ms: ${ALERT_EVALUATION_INTERVAL_MS:60000}
    webhook-timeout-ms: ${ALERT_WEBHOOK_TIMEOUT_MS:3000}
  demo:
    # Local development points at the deployment repository; a container mounts the set and overrides this.
    data-dir: ${DEMO_DATA_DIR:../kb-rag-deploy/demo}
    knowledge-base-name: ${DEMO_KB_NAME:Demo 知识库}
  sync:
    compensation-enabled: ${SYNC_COMPENSATION_ENABLED:true}
    compensation-interval-ms: ${SYNC_COMPENSATION_INTERVAL_MS:30000}
    pending-timeout-minutes: ${SYNC_PENDING_TIMEOUT_MINUTES:5}
    max-retry: ${SYNC_MAX_RETRY:5}
    batch-size: ${SYNC_BATCH_SIZE:500}
  parser:
    base-url: ${PARSER_BASE_URL:http://127.0.0.1:20001}
    timeout-ms: ${PARSER_TIMEOUT_MS:300000}
  auth:
    token-ttl-hours: ${AUTH_TOKEN_TTL_HOURS:24}
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${AUTH_LOCK_MINUTES:15}
    bootstrap-username: ${AUTH_BOOTSTRAP_USERNAME:admin}
    captcha:
      global-issue-rate-limit-per-minute: ${AUTH_CAPTCHA_GLOBAL_ISSUE_RATE_LIMIT_PER_MINUTE:120}
      max-generation-concurrency: ${AUTH_CAPTCHA_MAX_GENERATION_CONCURRENCY:2}
    ldap:
      # Off by default: a deployment without a domain controller must still log in with local accounts,
      # and the console only offers the single sign on tab when this says a directory exists.
      enabled: ${AUTH_LDAP_ENABLED:false}
      url: ${AUTH_LDAP_URL:}
      # Appended to the typed login name to form the bind principal, e.g. @corp.example.com. Deployment
      # knowledge, not something to make every person retype on every login.
      domain-suffix: ${AUTH_LDAP_DOMAIN_SUFFIX:}
      connect-timeout-ms: ${AUTH_LDAP_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${AUTH_LDAP_READ_TIMEOUT_MS:5000}
      # Role a directory account is granted the first time it logs in. Read only on purpose: anything
      # wider would hand write access to everyone who holds a domain account.
      default-role-code: ${AUTH_LDAP_DEFAULT_ROLE_CODE:VIEWER}
      group-sync:
        # When on, every single sign on login re-derives roles from directory groups; synchronised
        # grants are replaced wholesale while manually granted roles stay untouched.
        enabled: ${AUTH_LDAP_GROUP_SYNC_ENABLED:false}
        # Entries groupDn=ROLE_CODE separated by semicolons; DNs compared ignoring case and whitespace.
        role-mappings: ${AUTH_LDAP_GROUP_ROLE_MAPPINGS:}
    oidc:
      # The three browser redirect protocols are independent switches; the login page renders a
      # button per provider that is both enabled and fully configured.
      enabled: ${AUTH_OIDC_ENABLED:false}
      # Every endpoint is taken from {issuer}/.well-known/openid-configuration.
      issuer: ${AUTH_OIDC_ISSUER:}
      client-id: ${AUTH_OIDC_CLIENT_ID:}
      client-secret: ${AUTH_OIDC_CLIENT_SECRET:}
      scopes: ${AUTH_OIDC_SCOPES:openid profile email}
    saml:
      enabled: ${AUTH_SAML_ENABLED:false}
      idp-entity-id: ${AUTH_SAML_IDP_ENTITY_ID:}
      idp-sso-url: ${AUTH_SAML_IDP_SSO_URL:}
      # PEM certificate of the IdP, the single trust anchor of every assertion signature.
      idp-certificate: ${AUTH_SAML_IDP_CERTIFICATE:}
      sp-entity-id: ${AUTH_SAML_SP_ENTITY_ID:kb-rag}
    cas:
      enabled: ${AUTH_CAS_ENABLED:false}
      # Base URL such as https://cas.corp.example.com/cas; validation goes to /p3/serviceValidate.
      server-url: ${AUTH_CAS_SERVER_URL:}
    sso:
      # Public console origin shared by browser landing pages and OIDC/SAML/CAS callback URLs.
      # Use the externally registered HTTPS origin; never an internal reverse-proxy address. Left
      # blank, every redirect protocol counts as unconfigured even when enabled.
      web-base-url: ${AUTH_SSO_WEB_BASE_URL:}
  audit:
    # Days an operation audit row stays queryable, aligned with the M6 API audit retention.
    operation-retention-days: ${AUDIT_OPERATION_RETENTION_DAYS:180}
    cleanup-batch-size: ${AUDIT_OPERATION_CLEANUP_BATCH_SIZE:5000}
    cleanup-cron: ${AUDIT_OPERATION_CLEANUP_CRON:0 50 3 * * *}
  upload:
    max-file-size-mb: ${UPLOAD_MAX_FILE_SIZE_MB:100}
    allowed-extensions: ${UPLOAD_ALLOWED_EXTENSIONS:pdf,docx,txt,md,sql,xlsx,csv,html,htm,png,jpg,jpeg,webp,bmp,gif}
  doc:
    version:
      # Non active READY versions kept per document; the older ones are archived and lose their chunks,
      # while their original file and parse artifact stay so they can still be rebuilt. Clamped to 1-20.
      retain-count: ${DOC_VERSION_RETAIN_COUNT:3}
  index:
    # 同时索引几个文档。索引线程一生都在等外部服务（解析等 kb-rag-parser、嵌入等模型、写入等
    # ES/Qdrant），本机 CPU 上只有切分那一小段，所以别照机器核数定——真正的天花板通常是解析服务的
    # 工作线程数（PARSER_MAX_WORKERS），调到远超它只会让请求堆在解析服务门口。
    concurrency: ${INDEX_CONCURRENCY:4}
  split:
    max-tokens: ${SPLIT_MAX_TOKENS:600}
    overlap-tokens: ${SPLIT_OVERLAP_TOKENS:100}
    # Defaults of a freshly created knowledge base; each one can override them per knowledge base.
    parent-child-enabled: ${SPLIT_PARENT_CHILD_ENABLED:false}
    parent-max-tokens: ${SPLIT_PARENT_MAX_TOKENS:1200}
    child-max-tokens: ${SPLIT_CHILD_MAX_TOKENS:400}
    child-overlap: ${SPLIT_CHILD_OVERLAP:50}
  retrieval:
    rrf-k: ${RETRIEVAL_RRF_K:60}
    default-recall-top-k: ${RETRIEVAL_RECALL_TOP_K:50}
    default-top-n: ${RETRIEVAL_TOP_N:5}
    max-recall-top-k: ${RETRIEVAL_MAX_RECALL_TOP_K:100}
    max-top-n: ${RETRIEVAL_MAX_TOP_N:20}
    fusion-mode: ${RETRIEVAL_FUSION_MODE:rrf}
    w-vec: ${RETRIEVAL_W_VEC:0.6}
    # Off by default: a rewrite costs a model call on every search.
    rewrite-enabled: ${RETRIEVAL_REWRITE_ENABLED:false}
    rewrite-timeout-ms: ${RETRIEVAL_REWRITE_TIMEOUT_MS:800}
    rewrite-cache-ttl-minutes: ${RETRIEVAL_REWRITE_CACHE_TTL_MINUTES:10}
    rewrite-cache-max-size: ${RETRIEVAL_REWRITE_CACHE_MAX_SIZE:10000}
    rewrite-max-length: ${RETRIEVAL_REWRITE_MAX_LENGTH:512}
    rewrite-max-history-turns: ${RETRIEVAL_REWRITE_MAX_HISTORY_TURNS:6}
    # On by default, but only takes effect when a rerank model is configured.
    rerank-enabled: ${RETRIEVAL_RERANK_ENABLED:true}
    # M14 contract section 5: semantic keeps the pre-M14 pure-rerank ordering; hybrid blends the
    # normalized BM25 score in at weight (1 - rerank-w-semantic). Only the ordering changes.
    rerank-mode: ${RETRIEVAL_RERANK_MODE:semantic}
    rerank-w-semantic: ${RETRIEVAL_RERANK_W_SEMANTIC:0.7}
    parent-candidate-factor: ${RETRIEVAL_PARENT_CANDIDATE_FACTOR:3}
    parent-candidate-floor: ${RETRIEVAL_PARENT_CANDIDATE_FLOOR:20}
    max-linked-kb: ${RETRIEVAL_MAX_LINKED_KB:15}
    routing-cache-ttl-minutes: ${RETRIEVAL_ROUTING_CACHE_TTL_MINUTES:10}
    routing-cache-max-size: ${RETRIEVAL_ROUTING_CACHE_MAX_SIZE:10000}
    # The version visibility set is invalidated by every activation switch, so this expiry is only a safety net
    # against a mutation path nobody wired to that invalidation.
    visible-version-cache-ttl-minutes: ${RETRIEVAL_VISIBLE_VERSION_CACHE_TTL_MINUTES:5}
    visible-version-cache-max-size: ${RETRIEVAL_VISIBLE_VERSION_CACHE_MAX_SIZE:1000}
    # Image query, requirement section 4.8. Every image costs a vision round trip before the search starts,
    # so the count is the latency budget and the two byte ceilings are the memory budget of one request.
    image-query-max-count: ${IMAGE_QUERY_MAX_COUNT:3}
    image-query-max-bytes: ${IMAGE_QUERY_MAX_BYTES:5242880}
    image-query-max-total-bytes: ${IMAGE_QUERY_MAX_TOTAL_BYTES:10485760}
  annotation:
    # Lowest Dice coefficient a cross version migration recommendation must reach. Nothing is migrated
    # automatically, so a low value only lengthens the list an operator reads.
    migration-min-score: ${ANNOTATION_MIGRATION_MIN_SCORE:0.35}
  graph:
    # Blank disables the whole graph capability: no driver is created, the health endpoint does not probe
    # Neo4j, the graph route never runs and the extraction endpoint refuses. Everything else is unaffected.
    uri: ${NEO4J_URI:}
    user: ${NEO4J_USER:neo4j}
    password: ${NEO4J_PASSWORD:}
    # Relationship hops a matched entity is expanded by; the relevance of a hit decays as 1/(1+hops).
    max-hops: ${GRAPH_MAX_HOPS:2}
    entity-match-limit: ${GRAPH_ENTITY_MATCH_LIMIT:10}
    # One model call carries exactly one chunk; the concurrency is how many of those are in flight inside
    # one extraction task, and it is what decides how long a run takes. Graph writes are serialised on a
    # single writer thread regardless, so raising this trades no correctness - only the provider's rate
    # limit bounds it, multiplied by task-concurrency below (the chat model's peak = the two values).
    extract-concurrency: ${GRAPH_EXTRACT_CONCURRENCY:8}
    # 几个知识库能同时重建图谱（抽取任务池大小，抽取已不再挤占索引池）。一次抽取按分片规模能跑上
    # 小时级，所以这是"同时几个任务"而非吞吐旋钮；单任务快慢看 extract-concurrency。两者相乘才是
    # 聊天模型看到的峰值并发，而聊天模型限流通常比嵌入更紧——一起调之前先确认额度。
    task-concurrency: ${GRAPH_TASK_CONCURRENCY:2}
    # 抽取专用模型，留空 = 沿用 kb.chat.model。抽取与查询改写对模型的要求相反：改写是一句话、要
    # 语感，抽取是照固定 JSON 形状填空、要吞吐。共用一个模型时，为改写质量选的 qwen-plus 会让抽取
    # 按 ~40 token/s 生成上千 token——单次三十多秒，全量抽取以小时计。换 turbo 档能把生成速度翻倍
    # 以上，而"填 JSON"的质量损失远小于改写。与 kb.eval.judge-model 同一模式，不需要第二份凭据。
    extract-model: ${GRAPH_EXTRACT_MODEL:}
    # 单个分片遇到 429（限流）时的重试次数。429 不是"坏答案"而是"稍后再试"，且成片到来——额度一
    # 打穿，接下来几十个调用都是 429；不重试就是静默丢掉几百个分片。等待发生在抽取线程内部、占着
    # 并发槽位，所以限流时整次抽取自然降速到额度能承受的水平。退避带抖动（否则所有线程一起重试，
    # 复现触发 429 的突发）。填 0 = 不重试。
    extract-retry-on-throttle: ${GRAPH_EXTRACT_RETRY_ON_THROTTLE:3}
    # 一次抽取答案最多包含的实体数与关系数（同一个上限给两者，模型遵循更稳）。抽取延迟几乎全是生成
    # 时间，而不设上限时模型会把长分片能想到的都抽出来：实测均值 16 实体 / 20 关系约 1500 token，
    # 长尾直接撞上预算被截断、那一片整个丢失（实测约 9%）。给宽松但明确的上限，常规分片碰不到它，
    # 长尾则被截在上限而不是半个 JSON 上——"截断丢整片"变成"限量保主要"。
    extract-max-entities: ${GRAPH_EXTRACT_MAX_ENTITIES:24}
    # Budget of one extraction answer. Deliberately not kb.chat.max-tokens: that one sizes a single line
    # query rewrite, and running out mid JSON makes the parser reject an answer that was in fact fine.
    extract-max-tokens: ${GRAPH_EXTRACT_MAX_TOKENS:3072}
  web:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:20002,http://127.0.0.1:20002}
    # 仅这些 socket peer 可以提供 X-Forwarded-For。开发态 Vite 从 loopback 连接；生产部署必须
    # 显式替换为实际网关 CIDR，且不能配置 /0。未命中时服务端完全忽略转发头。
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
  eval:
    # Blank keeps the judge on the generation/rewrite chat model; set to grade with an independent model.
    judge-model: ${EVAL_JUDGE_MODEL:}
    offline-timeout-ms: ${EVAL_OFFLINE_TIMEOUT_MS:10000}
    # Cases judged concurrently across EVERY running evaluation, not per run: the cases reach the model
    # providers through the pool the online search shares, so a per run ceiling would multiply into
    # whatever number of runs happened to be executing. A six configuration matrix therefore judges four
    # cases at a time in total, not four per configuration - raise this, not the run pool, to go faster.
    concurrency: ${EVAL_CONCURRENCY:4}
    overlap-threshold: ${EVAL_OVERLAP_THRESHOLD:0.5}
    degraded-retry: ${EVAL_DEGRADED_RETRY:2}
    # Sweeps runs left PENDING/RUNNING by a process that died mid execution. The timeout has to sit above
    # the longest run a deployment really produces: an executing run touches its row only at start and at
    # finish, so a healthy long run is indistinguishable from an abandoned one until this much has passed.
    stuck-scan-enabled: ${EVAL_STUCK_SCAN_ENABLED:true}
    stuck-scan-interval-ms: ${EVAL_STUCK_SCAN_INTERVAL_MS:300000}
    stuck-timeout-minutes: ${EVAL_STUCK_TIMEOUT_MINUTES:120}
    stuck-scan-batch-size: ${EVAL_STUCK_SCAN_BATCH_SIZE:200}
  gate:
    # Below this many effective cases the dual run comparison is recorded instead of decided on.
    min-cases: ${GATE_MIN_CASES:50}
    # Tolerance floor in percentage points; the effective tolerance is max(this / 100, 1 / effectiveCases).
    epsilon-pp: ${GATE_EPSILON_PP:2}
    # Tolerance on final-answer judge dimensions, which use a 1-5 scale.
    answer-score-epsilon: ${GATE_ANSWER_SCORE_EPSILON:0.2}
    # Pending review ratio above which the evaluation data set counts as invalid for gating.
    stale-ratio: ${GATE_STALE_RATIO:0.15}
    run-timeout-ms: ${GATE_RUN_TIMEOUT_MS:1800000}
    poll-interval-ms: ${GATE_POLL_INTERVAL_MS:2000}
  open-api:
    # Token bucket rate assigned to a freshly created API key, in requests per second.
    rate-limit-default: ${API_RATE_LIMIT_DEFAULT:10}
    retry-after-seconds: ${API_RATE_LIMIT_RETRY_AFTER_SECONDS:1}
    # Days an audit row stays queryable before it is archived to object storage and deleted.
    audit-retention-days: ${AUDIT_RETENTION_DAYS:180}
    audit-archive-batch-size: ${AUDIT_ARCHIVE_BATCH_SIZE:5000}
    audit-archive-cron: ${AUDIT_ARCHIVE_CRON:0 30 3 * * *}
    audit-archive-enabled: ${AUDIT_ARCHIVE_ENABLED:true}
    audit-archive-prefix: ${AUDIT_ARCHIVE_PREFIX:audit/}
    # Width of the query_digest column; the digest is masked first and truncated to this afterwards.
    query-digest-max-length: ${AUDIT_QUERY_DIGEST_MAX_LENGTH:200}
  insight:
    # Off switches only the recording points; the report endpoints and the cleanup keep working
    # over whatever rows already exist.
    enabled: ${INSIGHT_ENABLED:true}
    # Days an insight row stays queryable. Insight rows are statistics, not evidence, so unlike the
    # audit trail they are deleted without an object storage archive.
    retention-days: ${INSIGHT_RETENTION_DAYS:90}
    cleanup-batch-size: ${INSIGHT_CLEANUP_BATCH_SIZE:5000}
    cleanup-cron: ${INSIGHT_CLEANUP_CRON:0 45 3 * * *}
  governance:
    # Days a trashed document stays restorable. The purge is the same irreversible removal the old
    # DELETE endpoint performed, so the window is the operator's undo horizon.
    trash-retention-days: ${TRASH_RETENTION_DAYS:30}
    # Documents per purge batch; each one clears chunks and both engine copies, hence the small bound.
    trash-purge-batch-size: ${TRASH_PURGE_BATCH_SIZE:100}
    trash-purge-cron: ${TRASH_PURGE_CRON:0 10 4 * * *}
    trash-purge-enabled: ${TRASH_PURGE_ENABLED:true}
  web-import:
    # Per request budget of one page fetch, connect and read alike.
    fetch-timeout-ms: ${WEB_IMPORT_FETCH_TIMEOUT_MS:10000}
    # Body ceiling enforced while streaming, so a hostile Content-Length cannot lie its way past it.
    max-page-size-mb: ${WEB_IMPORT_MAX_PAGE_SIZE_MB:10}
    # Redirect hops followed by hand; every hop is re-validated against the SSRF guard.
    max-redirects: ${WEB_IMPORT_MAX_REDIRECTS:3}
    sync-cron: ${WEB_IMPORT_SYNC_CRON:0 30 2 * * *}
    sync-enabled: ${WEB_IMPORT_SYNC_ENABLED:true}
    # Sources per scheduled pass; fetches are slow network calls, so a pass drains a bounded slice.
    sync-batch-size: ${WEB_IMPORT_SYNC_BATCH_SIZE:50}
    # DANGER: true admits loopback/private addresses through the SSRF guard. Development and intranet
    # deployments only - keep false wherever an untrusted user can register a source.
    allow-internal-address: ${WEB_IMPORT_ALLOW_INTERNAL_ADDRESS:false}
    render:
      # Master switch for JS rendering; off on an image without Chromium so render_js sources fall back.
      enabled: ${WEB_IMPORT_RENDER_ENABLED:true}
      # Budget of one render, permit wait and navigation alike; a slow page fails rather than hangs.
      timeout-ms: ${WEB_IMPORT_RENDER_TIMEOUT_MS:30000}
      # Concurrent renders; a browser context holds hundreds of MB, so the fan-out is bounded.
      max-concurrency: ${WEB_IMPORT_RENDER_MAX_CONCURRENCY:2}
      # When a navigation is considered done: load, domcontentloaded or networkidle.
      wait-until: ${WEB_IMPORT_RENDER_WAIT_UNTIL:load}
  ext-source:
    sync-cron: ${EXT_SOURCE_SYNC_CRON:0 0 3 * * *}
    sync-enabled: ${EXT_SOURCE_SYNC_ENABLED:true}
    # Sources per scheduled pass; each source scans a whole bucket, hence the smaller slice.
    sync-batch-size: ${EXT_SOURCE_SYNC_BATCH_SIZE:10}
    # Objects ingested per scan; a longer listing marks the sync PARTIAL instead of running away.
    max-objects-per-source: ${EXT_SOURCE_MAX_OBJECTS_PER_SOURCE:500}
    # Per call budget against the object store, connect and read alike.
    fetch-timeout-ms: ${EXT_SOURCE_FETCH_TIMEOUT_MS:30000}
  model-usage:
    # A normal provider failure releases immediately. A stale reservation is conservatively settled
    # because the process may have died after provider acceptance; keep this above the longest read timeout.
    reservation-timeout-minutes: ${MODEL_USAGE_RESERVATION_TIMEOUT_MINUTES:60}
    reconcile-batch-size: ${MODEL_USAGE_RECONCILE_BATCH_SIZE:200}
    reconcile-cron: ${MODEL_USAGE_RECONCILE_CRON:0 5 * * * *}
  app:
    # Retired application versions per application whose index snapshot is kept. Every snapshot is a full copy
    # of the corpus of every linked knowledge base, so this is the rollback depth traded against disk.
    # The released version is never counted here and never cleaned up.
    snapshot-retain-count: ${APP_SNAPSHOT_RETAIN_COUNT:3}
    # Budget of one snapshot copy. The Elasticsearch clone hard links segments and finishes in milliseconds;
    # this bounds the Qdrant path, which copies points.
    snapshot-timeout-ms: ${APP_SNAPSHOT_TIMEOUT_MS:300000}
    snapshot-cleanup-cron: ${APP_SNAPSHOT_CLEANUP_CRON:0 15 4 * * *}
    snapshot-cleanup-enabled: ${APP_SNAPSHOT_CLEANUP_ENABLED:true}

logging:
  level:
    root: info
    io.kbrag: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n"
