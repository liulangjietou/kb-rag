      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/WebCredential'
    WebCredentialListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/WebCredential'
    MetadataRule:
      type: object
      description: 'M14-CONTRACTS.md §3.1：一条配置化元数据抽取规则。key 须符合 ^[a-z][a-z0-9_]{1,31}$

        且不得与保留键冲突；type=constant 固定值（value，截 256）；type=regex 取第一个捕获组/无

        捕获组取整体（pattern ≤64，编译失败 INVALID_PARAM）；type=keyword_match 取命中子集

        （keywords ≤50 词/每词 ≤32）。'
      required:
      - key
      - type
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,31}$'
        type:
          type: string
          enum:
          - constant
          - regex
          - keyword_match
        value:
          type: string
          nullable: true
          maxLength: 256
          description: constant 规则的固定值
        pattern:
          type: string
          nullable: true
          maxLength: 64
          description: regex 规则的 Java 正则源
        keywords:
          type: array
          nullable: true
          maxItems: 50
          items:
            type: string
            maxLength: 32
          description: keyword_match 规则的词表
    ExtSource:
      type: object
      description: '外部数据源登记行（M14-CONTRACTS.md §2.3）。secret_key 恒返回掩码 ******，从不

        下发真实值；登记与文档弱绑定，移除源不删文档。'
      properties:
        source_id:
          type: string
        kb_id:
          type: string
        source_type:
          type: string
          description: 连接器类型路由键，本期仅 s3
        name:
          type: string
        endpoint:
          type: string
        region:
          type: string
          nullable: true
        bucket:
          type: string
        prefix:
          type: string
          nullable: true
        access_key:
          type: string
        secret_key:
          type: string
          description: 恒为掩码 ******，从不下发真实值
        sync_enabled:
          type: boolean
        last_sync_status:
          type: string
          nullable: true
          enum:
          - SUCCESS
          - PARTIAL
          - FAILED
          description: 首次同步前为 null
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
          maxLength: 512
        created_at:
          type: string
          format: date-time
    ExtSourceItem:
      type: object
      description: 外部数据源逐对象同步结果行（M14-CONTRACTS.md §2.3）
      properties:
        object_key:
          type: string
        etag:
          type: string
          nullable: true
        doc_id:
          type: string
          nullable: true
          description: 首次成功入库前为 null
        last_status:
          type: string
          nullable: true
          enum:
          - SUCCESS
          - UNCHANGED
          - SKIPPED
          - FAILED
        last_error:
          type: string
          nullable: true
          maxLength: 512
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    ExtSourceResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/ExtSource'
    ExtSourceListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/ExtSource'
              page:
                type: integer
              total:
                type: integer
    ExtSourceItemListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/ExtSourceItem'
              page:
                type: integer
              total:
                type: integer
    ExtSourceTestResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              up:
                type: boolean
                description: 对象存储应答且 bucket 存在时 true
              detail:
                type: string
                description: 探测详情
    ExtSourceSyncAcceptedResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              accepted:
                type: boolean
                description: 异步受理恒为 true，结果看列表状态
    EmbeddingStatus:
      type: string
      enum:
      - PENDING
      - DONE
      - FAILED
      - SKIPPED
    DocumentChunk:
      type: object
      description: 分片行（ChunkResponse）。不含 kb_id/doc_id——两者均由调用方使用的路由决定，
        服务端不重复下发
      properties:
        chunk_id:
          type: string
        document_version_id:
          type: string
        content:
          type: string
        chunk_type:
          $ref: '#/components/schemas/ChunkType'
        chunk_text_hash:
          type: string
          description: 分片正文 SHA-256，跨版本标注精确继承的匹配键（M4a-CONTRACTS.md §2.3）
        parent_id:
          type: string
          nullable: true
        seq:
          type: integer
        enabled:
          type: boolean
        disabled_child_ids:
          type: array
          items:
            type: string
          description: 本父片下被禁用的子片 id，服务端按整个文档版本计算（非当前分页）；
            非父片或无禁用子片时为 []。注意与检索响应不同——RetrievalNode 上该字段位于
            metadata 内，此处为顶层字段（M4a-CONTRACTS.md §2.2）
        embedding_status:
          $ref: '#/components/schemas/EmbeddingStatus'
        metadata:
          type: object
          additionalProperties: true
          nullable: true
    ChunkListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentChunk'
              page:
                type: integer
              total:
                type: integer
    SearchRequest:
      type: object
      description: 'M2-CONTRACTS.md §1.5：管理台调试用扩展入参，全部可选、即时生效（不落库为 KB

        默认值）。固定链路次序见 M2-CONTRACTS.md §1：改写 → 双路召回 → 融合 →

        rerank → 父子归并 → 阈值过滤 → top_n。

        '
      required:
      - query
      properties:
        query:
          type: string
        images:
          type: array
          nullable: true
          maxItems: 3
          description: '以图搜图（M14-CONTRACTS.md §7）：裸 base64（无 data: 前缀），≤3 张/单张 5MB/

            总量 10MB（以服务端为权威，超限 INVALID_PARAM）；query 仍必填。多模态可用时直接嵌入多模态

            空间检索，否则回落 VLM 转写。'
          items:
            type: string
        recall_top_k:
          type: integer
          default: 50
          minimum: 1
        top_n:
          type: integer
          default: 5
          minimum: 1
        score_threshold:
          type: number
          format: float
          minimum: 0.01
          maximum: 1.0
          nullable: true
          default: null
          description: '可空=不过滤。作用于 rerank 分；rerank 关闭或降级时作用于向量标准

            cosine[0,1] 分；BM25 单路时不生效（degraded += threshold_inactive）。

            '
        fusion:
          allOf:
          - $ref: '#/components/schemas/FusionConfig'
          nullable: true
        rerank_enabled:
          type: boolean
          nullable: true
          description: 默认 true（仅当 RERANK_MODEL 已配置生效），显式传 false 可关闭。
        rerank_mode:
          type: string
          nullable: true
          enum:
          - semantic
          - hybrid
          description: 'M14-CONTRACTS.md §5：semantic（默认）=纯语义重排分排序；hybrid=语义重排分与

            归一化 BM25 分线性加权决定排序。五层优先级照旧（请求 > KB > 部署默认

            kb.retrieval.rerank-mode=semantic）。hybrid 只影响排序，不改变 score_threshold 的纯语义

            分阈值语义（min-max 归一化分跨查询不可比，不入阈值）。'
        rerank_w_semantic:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: 仅 rerank_mode=hybrid 时生效，默认 0.7；排序分 = w * rerankScore + (1-w) *
            minmax(bm25Score)。
        rewrite_enabled:
          type: boolean
          default: false
          description: 默认 false；显式开启却未配置 chat 模型时 degraded += query_rewrite_timeout
            同类降级标注。
        messages:
          type: array
          nullable: true
          description: 多轮对话上下文（OpenAI 兼容 role/content），非空时按此做指代消解改写。
          items:
            $ref: '#/components/schemas/ChatMessage'
        metadata_filter:
          allOf:
          - $ref: '#/components/schemas/MetadataFilter'
          nullable: true
    ChunkType:
      type: string
      enum:
      - text
      - image
      - chat_log
    ScoreType:
      type: string
      description: '分数口径。M1 仅 cosine/bm25_rank 两种原始召回口径；M2 新增 rerank（唯一绝对分）

        与两种融合口径 fused_rrf/fused_weighted（M2-CONTRACTS.md §1.3）。

        '
      enum:
      - rerank
      - cosine
      - bm25_rank
      - fused_rrf
      - fused_weighted
    RetrievalSource:
      type: string
      enum:
      - vector
      - bm25
    DegradedReason:
      type: string
      description: '检索降级原因枚举。M1 仅定义 vector_route_unavailable（零 Key 场景，向量路不可用，

        仅走 BM25 单路）。M2 新增（M2-CONTRACTS.md §1.1/§1.2/§1.3）：

        query_rewrite_timeout（改写超时/失败降级用原 query，或显式开启改写却无模型）、

        rerank_timeout/rerank_error（重排超时或调用失败，降级为融合结果排序）、

        threshold_inactive（score_threshold 在 BM25 单路场景不生效）。

        M5 新增 route_fallback_all（知识库路由白名单未命中/解析失败/超时/未配置模型，降级检索全部

        关联库）。M6 新增 snapshot_index_missing（RELEASED 版本的快照索引已不存在，如被误删，

        回退实时别名与当前激活集合提供结果；M6 之前发布、本就没有快照的旧 RELEASED 版本走同样的

        实时别名路径，但那是历史数据形态而非故障，不记该标记，M6-CONTRACTS.md §0.4/§0.5）。

        M14 新增（docs/M14-CONTRACTS.md §6.4）：mm_route_skipped（多模态开启但本次融合权重为 0，

        多模态召回路被跳过）、mm_route_unavailable（多模态 provider 未配置或调用失败，其余召回路

        照常应答）。rerank 混合模式（hybrid）复用既有 rerank_unavailable/rerank_timeout/rerank_error

        降级码，不新增。

        '
      enum:
      - vector_route_unavailable
      - query_rewrite_timeout
      - query_rewrite_error
      - query_rewrite_unavailable
      - rerank_timeout
      - rerank_error
      - rerank_unavailable
      - threshold_inactive
      - route_fallback_all
      - snapshot_index_missing
      - graph_route_unavailable
      - image_understanding_unavailable
      - mm_route_skipped
      - mm_route_unavailable
    GraphSummary:
      type: object
      description: M7 图谱概览（GraphSummaryResponse）
      properties:
        graph_enabled: {type: boolean}
        entity_count: {type: integer, format: int64}
        relation_count: {type: integer, format: int64}
        covered_chunk_count: {type: integer, format: int64}
        latest_task:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/GraphTask'
    GraphTask:
      type: object
      description: 最近一次图抽取任务（type 恒为 GRAPH_EXTRACT——图清理挂删除级联不产生任务行，
        M7-CONTRACTS.md §5 偏离①）
      properties:
        task_id: {type: string}
        type: {type: string, enum: [GRAPH_EXTRACT]}
        status: {type: string, enum: [PENDING, RUNNING, SUCCESS, FAILED]}
        progress: {type: integer, nullable: true}
        skipped_chunk_count:
          type: integer
          nullable: true
          description: 因输出强校验（非法 JSON/实体名超长/关系端点不在本次实体列表）被跳过的分片数，
            任务成功时同样返回——"成功但丢了语料"是必须暴露的失败模式
        error_message: {type: string, nullable: true}
        created_at: {type: string}
    GraphEntity:
      type: object
      description: 实体行（GraphEntityResponse），relations 为出边、上限 20 条
      properties:
        name: {type: string}
        type: {type: string}
        source_chunk_count: {type: integer, format: int64}
        relations:
          type: array
          items:
            type: object
            properties:
              target: {type: string}
              type: {type: string}
    GraphEntityChunk:
      type: object
      description: 实体来源分片简化行（GraphEntityChunkResponse）
      properties:
        chunk_id: {type: string}
        doc_id: {type: string}
        doc_file_name: {type: string}
        document_version_id: {type: string}
        document_version_label: {type: string}
        content: {type: string}
        enabled: {type: boolean}
    RetrievalNode:
      type: object
      description: 检索结果节点（契约 §5 定型结构）
      required:
      - doc_id
      - document_version_id
      - chunk_id
      - chunk_type
      - content
      - score
      - score_type
      - retrieval_source
      properties:
        doc_id:
          type: string
        document_version_id:
          type: string
        chunk_id:
          type: string
        chunk_type:
          $ref: '#/components/schemas/ChunkType'
        content:
          type: string
        score:
          type: number
          format: float
          description: 统一映射到标准 cosine [0,1] 后的分数（跨引擎一致，见契约 §4）
        score_type:
          $ref: '#/components/schemas/ScoreType'
        retrieval_source:
          $ref: '#/components/schemas/RetrievalSource'
        metadata:
          type: object
          description: 'M7 图路命中时含 graph_score/graph_hops/graph_entities（≤5 个实体名；未被图路命中时三键不出现）。
        M8 聊天分片含 window_seq 与 msg_span（会话内消息序号闭区间）；近重复归并存活者含 merged_window_chunk_ids（≤5，同会话窗口重叠率≥0.5 只留排名最高）。
        M9 父子模式下发生精确剔除时含 redacted_child_count（被剔除的禁用子片段数；任一禁用子片
        无偏移则整片回退且不带该键）。
        引擎侧固定字段（tag_ids/session_id/sender/msg_time 等，见 M1-CONTRACTS.md

            §6）+ M2 新增各路分数明细（M2-CONTRACTS.md §1.5，父子归并开启时另含

            child_ids，见 §1.4），字段按实际生效链路出现，其余透传引擎原始 metadata。

            '
          properties:
            norm_vector_score:
              type: number
              format: float
              nullable: true
              description: 融合前向量路 min-max 归一化分（weighted 融合时使用）
            norm_bm25_score:
              type: number
              format: float
              nullable: true
              description: 融合前 BM25 路 min-max 归一化分（weighted 融合时使用）
            fused_score:
              type: number
              format: float
              nullable: true
              description: 融合分（RRF 或加权），rerank 关闭/降级时可作为最终分参考
            rerank_score:
              type: number
              format: float
              nullable: true
              description: rerank 归一化分（0-1），rerank 开启且未降级时存在
            child_ids:
              type: array
              nullable: true
              description: 父子分片开启时，归并到该父片的命中子片 chunk_id 列表
              items:
                type: string
            kb_id:
              type: string
              nullable: true
              description: 归属知识库业务 id（M5-CONTRACTS.md §2.2）；来自事实源行，全量填充，
                与本次调用是否经过多库路由无关，单库调用亦填充
          additionalProperties: true
        image_urls:
          type: array
          items:
            type: string
          default: []
        preview_url:
          type: string
          nullable: true
          default: null
    SearchData:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalNode'
        request_id:
          type: string
        degraded:
          type: array
          items:
            $ref: '#/components/schemas/DegradedReason'
          default: []
        applied:
          allOf:
          - $ref: '#/components/schemas/AppliedSearchParams'
          description: M2 新增，供调试页展示本次请求实际生效的参数（M2-CONTRACTS.md §1.5）
    SearchResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/SearchData'
    FusionMode:
      type: string
      description: M2-CONTRACTS.md §1.3
      enum:
      - rrf
      - weighted
    FusionConfig:
      type: object
      description: 'weighted 模式：每路候选集内 min-max 归一化，融合分 = w_vec·norm(vec) +

        w_bm25·norm(bm25)，w_vec + w_bm25 = 1（入参只传 w_vec，w_bm25 由服务端换算）。

        '
      properties:
        mode:
          $ref: '#/components/schemas/FusionMode'
        w_vec:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: 仅 mode=weighted 时生效，默认 0.5
        rrf_k:
          type: integer
          minimum: 1
          default: 60
          description: 仅 mode=rrf 时生效
    ChatMessage:
      type: object
      description: OpenAI 兼容 chat message（用于多轮指代消解改写，见 M2-CONTRACTS.md §1.1）
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          - system
        content:
          type: string
    MetadataFilter:
      type: object
      description: 'M2-CONTRACTS.md §1.5：映射为 ES bool filter / Qdrant 结构化 filter，字段即

        M1-CONTRACTS.md §6 引擎固定字段集（tag_ids/session_id/sender/msg_time）。

        '
      properties:
        tag_ids:
          type: array
          nullable: true
          items:
            type: string
        session_id:
          type: string
          nullable: true
        sender:
          type: string
          nullable: true
        msg_time_from:
          type: string
          format: date-time
          nullable: true
        msg_time_to:
          type: string
          format: date-time
          nullable: true
        custom:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: 'M14-CONTRACTS.md §3.3：对管理员配置化元数据抽取键的等值过滤（AND；

            keyword_match 键按“数组包含”匹配），key 须符合 ^[a-z][a-z0-9_]{1,31}$ 否则

            INVALID_PARAM；映射到引擎 ext_ 前缀字段。'
    AppliedSearchParams:
      type: object
      description: 调试页顶部信息条：本次请求实际生效的改写/融合/阈值作用口径（M2-CONTRACTS.md §1.5）；
        routed_kb_ids 为 M5 新增（该端点仍是单库调试端点，值恒为该单库 id，与多库编排端点的
        AppliedInfo.routed_kb_ids 共用同一字段名，避免同一元数据双路径不一致，M5-CONTRACTS.md
        §6 server 申报偏离①）
      properties:
        rewrite_used_query:
          type: string
          nullable: true
          description: 实际用于检索的 query；未开启改写或降级时等于原始 query
        fusion_mode:
          $ref: '#/components/schemas/FusionMode'
        threshold_applied_on:
          allOf:
          - $ref: '#/components/schemas/ScoreType'
          nullable: true
          description: score_threshold 实际作用的分数口径；未设置阈值或 threshold_inactive 时为 null
        routed_kb_ids:
          type: array
          items:
            type: string
          description: 本次调用实际检索的知识库 id 列表，单库调试端点恒为该单库 id（M5）
    ParentChildConfig:
      type: object
      description: M2-CONTRACTS.md §1.4：父子分片，引擎只索引子片，父片正文只在 MySQL
      properties:
        enabled:
          type: boolean
          default: false
        parent_max_tokens:
          type: integer
          default: 1200
          minimum: 1
        child_max_tokens:
          type: integer
          default: 400
          minimum: 1
        child_overlap:
          type: integer
          default: 50
          minimum: 0
    SplitStrategy:
      type: string
      description: '切分策略。fixed_length=按 token 长度顺切（M1 默认）；llm_semantic=对话模型只输出

        切割点、结果落库缓存，**要求已配置对话模型**；separator=按字面量/正则分隔符切段后贪心装包

        （M14，配 split_separator/split_separator_is_regex）；heading=按 markdown 标题层级开新段

        （M14，配 split_heading_level，全文无标题回落 fixed_length）；page=按解析产物分页边界切分

        （M14，无 pages 的格式整文一页；切的是逐页清洗并插回图片代理后的正文，与其他策略同一份，

        页区间随预览产物落 page_ranges）。**parent_child_enabled=true 时仅允许 fixed_length**，

        含 llm_semantic 在内的其余取值一律 INVALID_PARAM——两级切分是定长策略与自身组合，

        并不按本字段取策略；超长段统一回落 fixed_length 二次切分。未知取值一律 INVALID_PARAM

        （校验先于写入，取值集合即本枚举）。'
      enum:
      - fixed_length
      - llm_semantic
      - separator
      - heading
      - page
      default: fixed_length
    IndexConfig:
      type: object
      description: '知识库索引配置（t_kb_knowledge_base.index_config JSON）。chunk_max_tokens/

        chunk_overlap 为 M1 既有按长度切分参数（默认 600/100，见 M1-CONTRACTS.md

        索引管线说明），M2 起可通过 `PUT /api/v1/kb/{kbId}/index-config` 编辑；

        parent_child 为 M2 新增二级切分开关；clean_rules/parse_preview_required/

        chat_aggregation 为 M3 新增（docs/M3-CONTRACTS.md §3.3/§3.4/§3.5）。

        '
      properties:
        split_strategy:
          $ref: '#/components/schemas/SplitStrategy'
        split_separator:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
          description: 'M14 separator 策略分隔符（1-64 字符，默认 \n\n）；split_separator_is_regex=true

            时作为 Java 正则，编译失败 INVALID_PARAM；其余策略忽略此字段。'
        split_separator_is_regex:
          type: boolean
          default: false
          description: split_separator 是否为正则（M14 separator 策略）。
        split_heading_level:
          type: integer
          minimum: 1
          maximum: 6
          default: 2
          description: 'M14 heading 策略的 markdown 标题层级（1-6，默认 2）；其余策略忽略此字段。'
        metadata_rules:
          type: array
          nullable: true
          maxItems: 10
          description: 'M14-CONTRACTS.md §3.1：KB 级配置化元数据抽取规则（≤3 类共 ≤10 条），切分后逐

            chunk 抽取入 metadata 并镜像引擎（ext_ 前缀）；计入 chunk 指纹，改规则 config_stale

            重建后生效。'
          items:
            $ref: '#/components/schemas/MetadataRule'
        multimodal_enabled:
          type: boolean
          default: false
          description: 'M14-CONTRACTS.md §6.2：KB 级多模态整页索引开关，默认关。开启且多模态 provider 已

            配置时，IMAGE chunk（含扫描页整页渲染）额外产多模态向量，检索新增第三召回路；计入指纹。'
        embedding_model:
          type: string
          nullable: true
          description: 当前索引所用嵌入模型，服务端赋值；PUT 请求体无此字段，不可回写
        chunk_max_tokens:
          type: integer
          default: 600
          minimum: 1
          description: 定长切分的分段长度；LLM 语义切分下作为模型输出非法/超长时的降级兜底上限
        chunk_overlap:
          type: integer
          default: 100
          minimum: 0
        parent_child:
          $ref: '#/components/schemas/ParentChildConfig'
        clean_rules:
          $ref: '#/components/schemas/CleanRules'
        parse_preview_required:
          type: boolean
          default: false
          description: 'M3-CONTRACTS.md §3.4：默认 false，保证批量上传顺畅。开启后管线在清洗完成后 暂停，文档 process_status=PENDING_CONFIRM，需调用
            confirm 端点才继续切分入库。 '
        chat_aggregation:
          $ref: '#/components/schemas/ChatAggregationConfig'
        hide_parent_with_disabled_child:
          type: boolean
          default: false
          description: when true a parent chunk holding any disabled child is not
            returned at all
        inherit_disable_annotation:
          type: boolean
          default: true
          description: carry disable annotations to a new version when the chunk text
            hash is identical
    CleanRules:
      type: object
      description: 'M3-CONTRACTS.md §3.3：知识库级清洗规则，索引管线 clean 阶段按固定顺序执行—— 去页眉页脚 → 去水印
        → 正则替换 → 脱敏，每步可独立开关；参与 parse_fingerprint 计算 （六元组之一，见需求文档 §4.1），改清洗规则会正确标记文档
        config_stale。 '
      properties:
        strip_header_footer:
          type: boolean
          default: false
          description: 跨页重复行检测（同一文本在 >=60% 页面的首/末两行出现即视为页眉页脚并删除）
        strip_watermark_patterns:
          type: array
          default: []
          items:
            type: string
          description: 水印正则列表，匹配到的文本整体删除
        regex_replacements:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/RegexReplacement'
        excel_header_join:
          type: boolean
          default: true
          description: Excel/CSV 行级切分时是否把表头拼接进每一行
        extract_metadata:
          type: boolean
          default: false
        desensitize:
          $ref: '#/components/schemas/DesensitizeConfig'
    RegexReplacement:
      type: object
      properties:
        pattern:
          type: string
        replacement:
          type: string
    DesensitizeConfig:
      type: object
      description: '正则掩码：手机号保留前 3 后 4、身份证保留前 6 后 4、银行卡保留后 4、邮箱保留域名。 聊天记录导入时默认开启（需求文档
        §4.2）。 '
      properties:
        enabled:
          type: boolean
          default: false
        phone:
          type: boolean
          default: true
        id_card:
          type: boolean
          default: true
        bank_card:
          type: boolean
          default: true
        email:
          type: boolean
          default: false
    ChatAggregationConfig:
      type: object
      description: 'M3-CONTRACTS.md §3.5：聊天记录按“会话 + 时间窗口”聚合为 chunk_type=chat_log 的分片，一期无重叠顺切（步长=窗口）；M8-CONTRACTS.md
        §0.5 增 window_overlap 重叠滑窗（默认 0 保持顺切）。 '
      properties:
        window_minutes:
          type: integer
          default: 60
          minimum: 1
        max_messages:
          type: integer
          default: 50
          minimum: 1
        window_overlap:
          type: integer
          default: 0
          minimum: 0
          description: 'M8 新增：下一窗口重复上一窗口末尾的消息数，0=既有顺切；约束
            window_overlap×2 < max_messages（每条消息至多落两个窗口），违规 INVALID_PARAM。
            开启后聊天 chunk metadata 携带 window_seq 与 msg_span（M8-CONTRACTS.md §0.5）'
    RebuildRequest:
      type: object
      description: M2-CONTRACTS.md §4：doc_ids 缺省 = 该知识库下全部 config_stale=1 文档
      properties:
        doc_ids:
          type: array
          nullable: true
          items:
            type: string
    ConfirmDocumentsRequest:
      type: object
      description: M3-CONTRACTS.md §3.4：doc_ids 缺省 = 该知识库下全部 PENDING_CONFIRM 状态文档
      properties:
        doc_ids:
          type: array
          nullable: true
          items:
            type: string
    DocumentBatchRequest:
      type: object
      description: 批量删除 / 批量重建的作用域。doc_ids 必填且非空，服务端不会把空列表当成"整库"
      required:
      - doc_ids
      properties:
        doc_ids:
          type: array
          minItems: 1
          items:
            type: string
    BatchDeleteDocuments:
      type: object
      description: 真正移入回收站的文档；已在回收站中的被跳过，因此可能少于请求的 doc_ids
      properties:
        deleted_doc_ids:
          type: array
          items:
            type: string
    BatchDeleteDocumentsResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/BatchDeleteDocuments'
    BatchReindexDocuments:
      type: object
      description: 真正提交重建的文档；在回收站中或尚无版本的被跳过，因此可能少于请求的 doc_ids
      properties:
        reindexed_doc_ids:
          type: array
          items:
            type: string
    BatchReindexDocumentsResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/BatchReindexDocuments'
    PreviewImage:
      type: object
      description: M3-CONTRACTS.md §3.4：预览产物中的图片，preview_url 为限时预签名 URL
      properties:
        image_id:
          type: string
        preview_url:
          type: string
        page_no:
          type: integer
          nullable: true
          description: 图片所在页码，无页锚定的图片不返回
        kind:
          type: string
          nullable: true
          description: 图片来源类型（内嵌图 / 扫描页渲染图）
        text_proxy:
          type: string
          nullable: true
          description: VLM 生成的图片文本代理（描述 + OCR 文本）；未配置 VLM 或调用失败时为 null
        status:
          type: string
          nullable: true
          description: 文本代理生成状态；失败/跳过的图片同样列出，text_proxy 为空
    DocumentPreview:
      type: object
      description: M3-CONTRACTS.md §3.4：解析预览产物（清洗完成后、切分之前的中间态）
      properties:
        doc_id:
          type: string
        process_status:
          $ref: '#/components/schemas/ProcessStatus'
        markdown:
          type: string
        pages:
          type: array
          items:
            $ref: '#/components/schemas/ParsePreviewPage'
        images:
          type: array
          items:
            $ref: '#/components/schemas/PreviewImage'
        page_ranges:
          type: array
          description: |
            M14 新增（M14-CONTRACTS.md §4）。每页在上面 markdown 中的区间，仅
            split_strategy=page 的知识库非空。存档而非确认时重算：确认入库切的就是
            本产物的文本，边界若在确认时重算，预览之后改过的清洗规则会挪动操作员
            从未看到的切点。为空时按页切分退化为整文一页（无分页格式的既有行为）。
          items:
            $ref: '#/components/schemas/ParsePreviewPageRange'
          default: []
        warnings:
          type: array
          items:
            type: string
          default: []
    ParsePreviewPage:
      type: object
      properties:
        page_no:
          type: integer
        text:
          type: string
        markdown:
          type: string
          nullable: true
          description: |
            M14 新增。该页对应的 markdown 切片（含页标题与图片占位符行），逐页清洗
            的输入；早于本字段的解析产物为 null，消费方回退 text。
        scanned:
          type: boolean
          default: false
    ParsePreviewPageRange:
      type: object
      description: M14-CONTRACTS.md §4：一页在清洗后 markdown 中的位置，按页切分据此下刀
      properties:
        page_no:
          type: integer
          minimum: 1
        start:
          type: integer
          description: 起始下标（含）
        end:
          type: integer
          description: 结束下标（不含）
    DocumentPreviewResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/DocumentPreview'
    ReparseRequest:
      type: object
      description: 'M3-CONTRACTS.md §3.4：可选 clean_rules 覆盖，仅本次重解析预览生效， 不写回知识库 index_config。 '
      properties:
        clean_rules:
          allOf:
          - $ref: '#/components/schemas/CleanRules'
          nullable: true
    IkDictType:
      type: string
      description: t_kb_ik_dict.dict_type（M2-CONTRACTS.md §3）
      enum:
