        run_id:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        mode:
          $ref: '#/components/schemas/EvalMode'
        finished_at:
          type: string
          format: date-time
          nullable: true
    CreateEvalDatasetRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
    EvalDataset:
      type: object
