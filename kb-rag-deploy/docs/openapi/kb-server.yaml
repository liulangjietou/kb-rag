    MemoryAddData:
      type: object
      properties:
        memory_nodes:
          type: array
          items:
            $ref: '#/components/schemas/MemoryAddedNode'
        profile:
          $ref: '#/components/schemas/MemoryProfile'
    MemoryAddResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/MemoryAddData'
    MemorySearchRequest:
      type: object
      required:
      - user_id
      - query
      properties:
        user_id:
          type: string
          description: 记忆实体 ID
        query:
          type: string
          maxLength: 2000
          description: 当前提问
        fragment_rule_id:
          type: string
          nullable: true
          description: 限定在指定片段规则下检索，缺省全部
        max_results:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: 最大召回数量
        intent_recognition:
          type: boolean
          default: false
          description: 意图判别召回：LLM 判断当前提问是否需要召回记忆，不需要时直接返回空
        rewrite:
          type: boolean
          default: false
          description: 查询改写：LLM 优化口语化提问后再检索
        rerank:
          type: boolean
          default: false
          description: 重排：候选结果经 rerank 模型重排序
        similarity_threshold:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          nullable: true
          description: 相似度阈值，建议 0.5~0.7；仅 rerank 开启时生效，低于阈值的结果被丢弃
