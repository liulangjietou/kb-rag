      description: 'M3-CONTRACTS.md §3.4：仅当文档 `process_status=PENDING_CONFIRM` （知识库开启
        `index_config.parse_preview_required` 时，清洗完成后管线暂停于此状态） 时有实际预览产物；预览内容（markdown、按页信息、图片预签名
        URL 与 VLM 文本代理、页区间 page_ranges、warnings）读自 MinIO 预览产物。 '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPreviewResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{docId}/confirm:
    parameters:
    - $ref: '#/components/parameters/DocId'
    post:
      tags:
      - parse-preview
      summary: 确认解析预览，继续切分入库
      description: 仅对 PENDING_CONFIRM 状态文档有效；确认后管线从清洗完成处继续切分/嵌入/双写。
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{docId}/reparse:
    parameters:
    - $ref: '#/components/parameters/DocId'
    post:
      tags:
      - parse-preview
      summary: 按清洗规则重解析（预览用）
      description: 'M3-CONTRACTS.md §3.4：body 可选 `clean_rules` 覆盖，仅本次预览生效， 不修改知识库级配置；重解析完成后返回最新预览，文档保持/回到
        PENDING_CONFIRM。 '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReparseRequest'
      responses:
        '200':
          description: 重解析完成，返回最新预览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPreviewResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{docId}:
    parameters:
    - $ref: '#/components/parameters/DocId'
    delete:
      tags:
      - governance
      summary: 删除文档（M11 起：移入回收站，可还原）
      description: 'M11-CONTRACTS.md §2.2：URL 早于 M11，语义由不可逆删除升级为移入回收站——
        文档立即从检索中下线但数据保留，保留期内可通过 restore 还原；不可逆删除迁移至
        purge 端点。已在回收站的文档重复删除返回 INVALID_PARAM。'
      responses:
        '200':
          description: 已移入回收站
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{docId}/submit-review:
    parameters:
    - $ref: '#/components/parameters/DocId'
    post:
      tags:
      - governance
      summary: 提交审核（DRAFT|REJECTED → PENDING_REVIEW）
      description: 'M11-CONTRACTS.md §2.2：仅 DRAFT/REJECTED 可提交；其余状态返回
        INVALID_PARAM；回收站内文档需先还原。'
      responses:
        '200':
          description: 更新后的文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{docId}/approve:
    parameters:
    - $ref: '#/components/parameters/DocId'
    post:
      tags:
      - governance
      summary: 审核通过（PENDING_REVIEW → PUBLISHED，清空 review_note）
      description: 'M11-CONTRACTS.md §2.2：PUBLISHED 为终态，下架靠有效期或回收站；
        非 PENDING_REVIEW 状态返回 INVALID_PARAM。'
      responses:
        '200':
          description: 更新后的文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{docId}/reject:
    parameters:
    - $ref: '#/components/parameters/DocId'
    post:
      tags:
      - governance
      summary: 审核驳回（PENDING_REVIEW → REJECTED，note 必填）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  maxLength: 512
                  description: 驳回理由，落入 Document.review_note
      responses:
        '200':
          description: 更新后的文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{docId}/validity:
    parameters:
    - $ref: '#/components/parameters/DocId'
    put:
      tags:
      - governance
      summary: 设置/清除文档有效期窗口
      description: 'M11-CONTRACTS.md §2.2：两端均可为 null 表示不设界；expires_at 允许
        为过去时刻（立即下架）；两端都非空时要求 expires_at > effective_at；时间为
        无时区 ISO 字面量（如 2026-07-26T00:00:00）。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                effective_at:
                  type: string
                  format: date-time
                  nullable: true
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: 更新后的文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{docId}/restore:
    parameters:
    - $ref: '#/components/parameters/DocId'
    post:
      tags:
      - governance
      summary: 从回收站还原文档
      description: 'M11-CONTRACTS.md §2.2：纯 DB 标记翻转，无需重建索引，还原后立即恢复
        可检索（受其发布状态/有效期约束）；不在回收站的文档返回 INVALID_PARAM。'
      responses:
        '200':
          description: 更新后的文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{docId}/purge:
    parameters:
    - $ref: '#/components/parameters/DocId'
    delete:
      tags:
      - governance
      summary: 彻底删除（仅限回收站内文档，不可逆）
      description: 'M11-CONTRACTS.md §2.2：M11 前 DELETE 的不可逆删除迁移到这里：连同
        全部版本/分片/两个检索引擎副本一并删除。仅对回收站内文档有效（两段式防误删），
        否则返回 INVALID_PARAM。超过保留期的回收站文档由定时任务自动执行同一逻辑。
        其他租户的 docId 读作不存在 → 404，删除不会发生（见 M16-CONTRACTS.md §1.3.2）。'
      responses:
        '200':
          description: 已彻底删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kb/{kbId}/trash:
    parameters:
    - $ref: '#/components/parameters/KbId'
    get:
      tags:
      - governance
      summary: 回收站列表（按移入时间倒序分页）
      parameters:
