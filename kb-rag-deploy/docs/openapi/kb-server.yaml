              $ref: '#/components/schemas/StaleCaseEntry'
    EvalCaseResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/EvalCase'
    EvalCaseListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
