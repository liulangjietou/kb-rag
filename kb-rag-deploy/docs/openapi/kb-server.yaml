  /api/v1/memory/mcp:
    post:
      tags:
      - mcp
      summary: 记忆库 MCP 端点（Memory Key 鉴权，M20）
      description: 'MCP Streamable HTTP transport，协议语义同 /api/v1/knowledge/mcp。工具
        memory_add / memory_search / memory_list / memory_update / memory_delete /
        memory_get_profile 与 M19 六个 REST 端点一一对应，参数与返回结构一致；操作的记忆库由 Key
        绑定关系决定，参数无需也不可指定库。鉴权/限流与 /api/v1/memory/* REST 端点同一条
        MemoryKeyAuthFilter 链。'
      security:
      - MemoryKeyBearer: []
      requestBody:
        required: true
        content:
          application/json:
