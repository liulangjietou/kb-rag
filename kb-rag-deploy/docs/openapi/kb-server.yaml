          description: 同名评测集已存在则为 true，直接返回其 id 不重复导入（幂等）
        imported_case_count:
          type: integer
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedEvalCase'
    ImportDemoEvalDatasetResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/ImportDemoEvalDatasetData'
    CasesFromRetrievalRequest:
      type: object
      description: 检索调试页一键收进评测集（M4b-CONTRACTS.md §2）；chunk_type=image 或显式传 anchor_type=DOCUMENT
        时建成文档级锚定 case
      required:
