      summary: 更新凭据（M18，需 system:config）
      description: 'M18：全部字段可选，只写传入的；secret 缺省或空白保持原值，因此停启用不需要重新
        输入密码。host 与 auth_type 不可改——换站点或换方式是另一份凭据，删了重建。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                secret:
                  type: string
                  description: 缺省或空白保持原值
                header_name:
                  type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: 更新后的凭据（不含 secret）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebCredentialResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
