            format: float
        recalled_chunk_ids:
          type: array
          items:
            type: string
        degraded:
          type: array
          items:
            $ref: '#/components/schemas/DegradedReason'
        retry_count:
          type: integer
        judge_score:
          allOf:
          - $ref: '#/components/schemas/JudgeScore'
          nullable: true
        judge_reason:
          type: string
          nullable: true
    EvalResultListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/EvalResult'
              page:
                type: integer
              total:
                type: integer
    CompareRunEntry:
      type: object
      properties:
        run_id:
          type: string
        label:
          type: string
        mode:
          $ref: '#/components/schemas/EvalMode'
        metrics:
          $ref: '#/components/schemas/EvalMetrics'
    EvalRunCompareData:
      type: object
      description: 同 dataset_revision 才允许对比；不同则 comparable=false 并给出原因（M4b-CONTRACTS.md
        §3.1）
      properties:
        comparable:
          type: boolean
        reason:
          type: string
          nullable: true
          description: comparable=false 时的原因说明（如语料/评测集已变化）
        dataset_revision:
          type: integer
          nullable: true
        runs:
          type: array
          items:
            $ref: '#/components/schemas/CompareRunEntry'
    EvalRunCompareResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/EvalRunCompareData'
    CreateAppRequest:
      type: object
      description: 应用创建请求（M4c-CONTRACTS.md §2）
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          nullable: true
          maxLength: 1024
    UpdateAppRequest:
      type: object
      description: 应用重命名/改描述请求，字段为 null 保留原值
      properties:
        name:
          type: string
          nullable: true
          maxLength: 128
        description:
          type: string
          nullable: true
          maxLength: 1024
    App:
      type: object
      description: 应用（t_kb_app），列表页附带当前 RELEASED 版本，避免逐行再请求（M4c-CONTRACTS.md
        §1/§2）
      properties:
        app_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        released_version:
          type: string
          nullable: true
          description: 当前对外服务的版本号，尚无 RELEASED 版本时为 null
        released_version_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AppResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/App'
    AppListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/App'
    AppRetrievalConfig:
      type: object
      description: 版本快照的检索参数块；建版请求中每个字段均可选，null 继承最新版本值，草稿态外经
        submit-test 补全并冻结（M4c-CONTRACTS.md §1）
      properties:
        recall_top_k:
          type: integer
          nullable: true
          minimum: 1
        top_n:
          type: integer
          nullable: true
          minimum: 1
        fusion_mode:
          allOf:
          - $ref: '#/components/schemas/FusionMode'
          nullable: true
        w_vec:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
        rrf_k:
          type: integer
          nullable: true
          minimum: 1
        score_threshold:
          type: number
          format: float
          nullable: true
          minimum: 0.01
          maximum: 1.0
        rerank_enabled:
          type: boolean
          nullable: true
        rewrite_enabled:
          type: boolean
          nullable: true
    AppPromptConfig:
      type: object
      description: 版本快照的问答 prompt 块，三开关默认开启（对外暴露的应用默认防泄漏/防注入/引用标注）
      properties:
        system_prompt:
          type: string
          nullable: true
          maxLength: 4000
        refusal_enabled:
          type: boolean
          default: true
        refusal_prompt:
          type: string
          nullable: true
          maxLength: 2000
        leak_guard_enabled:
          type: boolean
          default: true
        leak_guard_prompt:
          type: string
          nullable: true
          maxLength: 2000
        citation_enabled:
          type: boolean
          default: true
    AppGateThresholds:
      type: object
      description: 首发无对照时使用的绝对阈值，未配置则记录本次结果作为后续基线并放行
      properties:
        min_hit_rate:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
        min_recall:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
    AppVersionConfigRequest:
      type: object
      description: 建版请求即控制台配置表单；未传字段继承最新版本配置（M4c-CONTRACTS.md §1/§2，
        M5 增量见 M5-CONTRACTS.md §1）。携带任一配置字段的建版请求必须给出 kb_refs 或旧版 kb_id
        之一（fast-fail 提前到建版而非 submit-test）。
      properties:
        kb_id:
          type: string
          nullable: true
          deprecated: true
          description: 【已废弃，兼容用】M4c 前客户端的单库字段；仅当 kb_refs 缺省时才会被折叠为
            一条 [{kb_id, weight:1}]，两者同传 kb_refs 优先。新客户端请使用 kb_refs（M5）。
        kb_refs:
          type: array
          nullable: true
          minItems: 1
          maxItems: 15
          items:
            $ref: '#/components/schemas/AppKbRef'
          description: 应用版本关联的知识库列表，1..15 个（上限见部署配置
            kb.retrieval.max-linked-kb，默认 15），M5 起替代 kb_id；不可重复关联同一知识库、
            权重须为正整数、知识库须存在，否则 400 INVALID_PARAM。声明顺序有意义：配额分配的
            向下取整余量与库级单值默认参数（retrieval 未设字段/rewrite/rerank 开关）均取声明的
            第一个库（M5-CONTRACTS.md §6）。
        routing:
          $ref: '#/components/schemas/AppRoutingConfig'
        retrieval:
          $ref: '#/components/schemas/AppRetrievalConfig'
        prompt:
          $ref: '#/components/schemas/AppPromptConfig'
        gate:
          $ref: '#/components/schemas/AppGateThresholds'
        chat_model:
          type: string
          nullable: true
          description: 生成模型，落快照并经 ChatProviderFactory 真实生效，留空取部署默认对话模型
        gate_dataset_id:
          type: string
          nullable: true
        changelog:
          type: string
          nullable: true
          maxLength: 1024
    AppConfigSnapshot:
      type: object
      description: 发布时固化的完整检索+问答配置快照（t_kb_app_version.config），只读、不回落任何
        实时默认值。M5 起序列化恒出 kb_refs，不再回写 kb_id（单一事实源）；M4c 前冻结的旧快照仅存
        单个 kb_id，读侧统一在此收敛翻译为等价的单条 kb_refs（M5-CONTRACTS.md §6）。
      properties:
        kb_id:
          type: string
          nullable: true
          deprecated: true
          writeOnly: true
          description: 【已废弃，只入不出】M4c 前快照的遗留单库字段；仅入参可能出现，出参恒读
            kb_refs（本 schema 的 kb_id 属性只用于兼容历史请求体校验，实际响应体不会出现该字段）。
        kb_refs:
          type: array
          items:
            $ref: '#/components/schemas/AppKbRef'
          description: 应用关联的知识库列表，声明顺序有意义（配额余量与库级单值默认参数取第一个）；
            旧快照的单 kb_id 在此翻译为等价的单元素列表，永不为空
        routing:
          $ref: '#/components/schemas/AppRoutingConfig'
        retrieval:
          $ref: '#/components/schemas/AppRetrievalConfig'
        prompt:
          $ref: '#/components/schemas/AppPromptConfig'
        chat_model:
          type: string
          nullable: true
        gate:
          $ref: '#/components/schemas/AppGateThresholds'
    AppKbRef:
      type: object
      description: 应用版本关联的一个知识库及其配额权重（M5-CONTRACTS.md §1/§2.2）
      required:
      - kb_id
      properties:
        kb_id:
          type: string
        weight:
          type: integer
          nullable: true
          minimum: 1
          default: 1
          description: rerank 候选配额权重，仅参与配额分配、不参与打分（跨库分数不可比）；缺省或
            非正数按默认权重 1 生效
    AppRoutingConfig:
      type: object
      description: 知识库路由开关与自定义 Prompt（M5-CONTRACTS.md §1/§2.1）；默认关闭——关闭或应用
        仅关联 1 个库时不调用路由模型，未配置对话模型时显式开启也会跳过并记 degraded=
        route_fallback_all
      properties:
        enabled:
          type: boolean
          default: false
        prompt:
          type: string
          nullable: true
          maxLength: 4000
          description: 路由指令自定义文案，留空使用内置默认路由 Prompt；候选知识库白名单与用户问题
            始终由服务端拼装，自定义文案无法移除白名单校验（需求文档 §4.4 注入防护③）
    GateDatasetRequest:
      type: object
      properties:
        dataset_id:
          type: string
          nullable: true
          description: 待绑定评测集；为空或 null 则清空绑定并跳过门禁
    AppVersionStatus:
      type: string
      description: '发布状态机（M4c-CONTRACTS.md §1）：DRAFT -> TESTING -> GATING -> GATE_PASSED
        -> RELEASED -> SUPERSEDED；GATING 亦可落至 GATE_LOG_ONLY / GATE_BLOCKED，两者均需
        force=true 显式放行至 RELEASED；SUPERSEDED 可 rollback 回 RELEASED。'
      enum:
      - DRAFT
      - TESTING
      - GATING
      - GATE_PASSED
      - GATE_LOG_ONLY
      - GATE_BLOCKED
      - RELEASED
      - SUPERSEDED
    GateVerdict:
      type: string
      description: 门禁三态结论；LOG_ONLY 表示"不可判定"，不等同于 BLOCKED，两者都不自动放行
      enum:
      - PASSED
      - BLOCKED
      - LOG_ONLY
    GateReason:
      type: string
      description: GateVerdict 的分类原因，供控制台直接展示解释文案，无需二次推导
      enum:
      - NO_DATASET
      - INSUFFICIENT_CASES
      - DEGRADED_CASES
      - STALE_RATIO_EXCEEDED
      - RUN_FAILED
      - NOT_COMPARABLE
      - METRICS_REGRESSED
      - WITHIN_TOLERANCE
      - ABSOLUTE_THRESHOLD_MET
      - ABSOLUTE_THRESHOLD_NOT_MET
      - BASELINE_RECORDED
    GateCoreMetrics:
      type: object
      description: 门禁仅允许判定的两个核心指标；Precision/MRR/NDCG 与 LLM-as-judge 答案分只展示不参与门禁
      properties:
        hit_rate:
          type: number
          format: float
        recall:
          type: number
          format: float
    GateReport:
      type: object
      description: 一次门禁双跑的持久化结果，供控制台双跑对比面板渲染（M4c-CONTRACTS.md §1/§6）
      properties:
        verdict:
          $ref: '#/components/schemas/GateVerdict'
        reason:
          $ref: '#/components/schemas/GateReason'
        message:
          type: string
        candidate:
          $ref: '#/components/schemas/GateCoreMetrics'
        baseline:
          allOf:
          - $ref: '#/components/schemas/GateCoreMetrics'
          nullable: true
          description: 首发无对照时为 null
        effective_cases:
          type: integer
        total_cases:
          type: integer
        stale_cases:
          type: integer
        stale_ratio:
          type: number
          format: float
        degraded_cases:
          type: integer
        epsilon:
          type: number
          format: float
          description: 本次比较采用的容差，ε=max(0.02, 1/N)，另加 1e-9 浮点余量
        hit_rate_delta:
          type: number
          format: float
          nullable: true
          description: 候选减对照，首发无对照时为 null
        recall_delta:
          type: number
          format: float
          nullable: true
        candidate_run_id:
          type: string
        baseline_run_id:
          type: string
          nullable: true
        evaluated_at:
          type: string
          format: date-time
        case_ids:
          type: array
          items:
            type: string
    AppVersion:
      type: object
      description: 应用版本（t_kb_app_version），含发布状态机位置与门禁结论（M4c-CONTRACTS.md §1/§2）
      properties:
        app_version_id:
          type: string
        app_id:
          type: string
        version:
          type: string
          description: 展示版本号，如 V1.0，仅主版本号递增
        status:
          $ref: '#/components/schemas/AppVersionStatus'
        config:
          $ref: '#/components/schemas/AppConfigSnapshot'
        gate_dataset_id:
          type: string
          nullable: true
        gate_run_ids:
          type: array
          items:
            type: string
          description: 双跑评测运行 id，定序为 [候选, 对照]；首发无对照时仅含候选一项
        gate_verdict:
          allOf:
          - $ref: '#/components/schemas/GateVerdict'
          nullable: true
          description: 门禁尚未运行过时为 null
        gate_reason:
          allOf:
          - $ref: '#/components/schemas/GateReason'
          nullable: true
        gate_reason_message:
          type: string
          nullable: true
        gate_report:
          allOf:
          - $ref: '#/components/schemas/GateReport'
          nullable: true
        force_released:
          type: boolean
          description: true 表示运营在非通过门禁结论下强制放行
        force_operator:
          type: string
          nullable: true
        changelog:
          type: string
          nullable: true
        released_at:
          type: string
          format: date-time
          nullable: true
        index_snapshots:
          type: array
          items:
            $ref: '#/components/schemas/AppIndexSnapshot'
          description: 该版本发布时对关联知识库物理索引冻结的快照，一库一引擎一条（完整模式下同一库
            的 BM25 与向量各一条）；从未发布过、在索引快照能力上线前发布、或快照已被清理保留策略
            回收的版本一律为空数组，此时调用回退实时别名与当前激活集合（M6-CONTRACTS.md §0）
        visible_version_kb_count:
          type: array
          items:
            $ref: '#/components/schemas/VisibleVersionCount'
          description: 该版本固化的版本可见集，按知识库汇总为文档版本数量（只给数量不给 id 列表，
            避免列表响应随语料规模膨胀），空数组语义与 index_snapshots 相同
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AppIndexSnapshot:
      type: object
      description: 一次发布对某知识库某引擎冻结的物理索引（t_kb_app_version.index_snapshots 一个元素，
        M6-CONTRACTS.md §0.2/§0.10）；物理名直接存储、从不重新计算，避免嵌入模型切换后历史版本被
        指向一个从未包含过的索引
      properties:
        kb_id:
          type: string
        engine:
          $ref: '#/components/schemas/VectorEngine'
        physical_index_name:
          type: string
          description: 快照物理索引/集合名，不挂别名，按物理名直查
    VisibleVersionCount:
      type: object
      description: 一个知识库在某次发布固化的可见集里贡献了多少个文档版本（仅计数，M6-CONTRACTS.md §0.10）
      properties:
        kb_id:
          type: string
        version_count:
          type: integer
    AppVersionResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/AppVersion'
    AppVersionListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/AppVersion'
    TargetStage:
      type: string
      description: 本次调用由 release 版本还是 beta（显式指定的测试版）服务，审计维度之一
      enum:
      - release
      - beta
    ChatMessageTurn:
      type: object
      description: 会话历史轮次；role 非 assistant 一律归一化为 user（防止伪造 system 角色注入）
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
    KnowledgeCallRequest:
      type: object
      description: '对外 search/chat 与控制台 chat-preview 的共享入参（M4c-CONTRACTS.md §3）。
        除下列四个白名单覆盖字段与 query/messages/stream 外，任何未声明字段一律视为越界覆盖，校验拒绝为
        400 INVALID_PARAM（需求文档 §5），而非被静默丢弃。'
      required:
      - query
      properties:
        query:
          type: string
        app_id:
          type: string
          nullable: true
          description: search/chat 必填（路径外传参）；chat-preview 由路径 appId 提供，此处忽略
        app_version:
          type: string
          nullable: true
          description: 版本展示号，缺省路由当前 RELEASED 版本；显式指定测试版即视为 beta 灰度调用
        messages:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ChatMessageTurn'
        top_n:
          type: integer
          nullable: true
          minimum: 1
          description: 请求级覆盖白名单之一
        score_threshold:
          type: number
          format: float
          nullable: true
          minimum: 0.01
          maximum: 1.0
          description: 请求级覆盖白名单之一
        metadata_filter:
          allOf:
          - $ref: '#/components/schemas/MetadataFilter'
          nullable: true
          description: 请求级覆盖白名单之一
        images:
          type: array
          maxItems: 3
          items: {type: string}
          description: 'M9：可选图片（纯 base64，不收 URL——SSRF 面；单张解码 ≤5MB、总量 ≤10MB，越界
            INVALID_PARAM）。VLM 转文本以「[图片内容] 」前缀拼接到 query 尾部（发生在改写之前）；零
            Key/理解失败忽略全部图片并记 degraded=image_understanding_unavailable；纯图无文本且理解
            失败返回 INVALID_PARAM。'
        max_content_length:
          type: integer
          nullable: true
          minimum: 1
          description: 请求级覆盖白名单之一，返回内容的字符预算
        stream:
          type: boolean
          default: false
          description: chat 接口生效，search 接口忽略
    ChatPreviewRequest:
      allOf:
      - $ref: '#/components/schemas/KnowledgeCallRequest'
      - type: object
        properties:
          app_version_id:
            type: string
            nullable: true
            description: 按业务 id 预览指定版本（可为草稿），缺省取该应用最新一个版本
    AppliedInfo:
      type: object
      description: 本次调用实际生效的口径，区别于"请求想要什么"（M4c-CONTRACTS.md §3，routed_kb_ids
        为 M5 新增见 M5-CONTRACTS.md §2.2）
      properties:
        rewrite_used_query:
          type: string
          nullable: true
          description: 实际用于检索的 query
        fusion_mode:
          type: string
          nullable: true
          description: 生效融合策略字面量；多库时最终排序由跨库 RRF 产生，如实返回 rrf（与
            score_type 同源，不回落为配置里的融合策略值）
        threshold_applied_on:
          type: string
          nullable: true
          description: 阈值实际作用的分数口径，未过滤时为 none
        routed_kb_ids:
          type: array
          items:
            type: string
          description: 本次调用实际检索的知识库 id 列表；路由关闭或降级回退时为版本关联的全部知识库，
            路由生效时为模型选中的子集（M5）
    KnowledgeSearchResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalNode'
        request_id:
          type: string
        degraded:
          type: array
          items:
            $ref: '#/components/schemas/DegradedReason'
        applied:
          $ref: '#/components/schemas/AppliedInfo'
        app_version:
          type: string
          description: 实际服务本次调用的版本号
        target_stage:
          $ref: '#/components/schemas/TargetStage'
    KnowledgeSearchResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/KnowledgeSearchResponse'
    KnowledgeChatResponse:
      type: object
      description: routed_kb_ids 位于顶层而非嵌套进 applied：chat 响应此前没有 applied 包装，仅为
        承载单个新字段引入包装会改变既有客户端的解析形状，得不偿失（M5-CONTRACTS.md §6）
      properties:
        answer:
          type: string
        references:
          type: array
          items:
