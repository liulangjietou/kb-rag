      summary: 聊天记录导入-匹配预览（不落库）
      description: 'M3-CONTRACTS.md §3.5：multipart 上传聊天记录导出文件，服务端调用 kb-rag-parser
        `/api/v1/parse/chat` 端点解析后，与库内既有聊天文档做会话匹配， 仅返回匹配预览，不执行导入。逻辑文档标识 = 来源渠道 + session_id：已存在的会话
        `action=NEW_VERSION`，新会话 `action=CREATE`。上传文件与解析结果暂存 MinIO， 返回的 `upload_token`
        有效期 30 分钟，供 confirm 端点使用。 M8 起格式范围扩 TXT/HTML（M8-CONTRACTS.md §0.1/§0.2），映射档案改从
        t_kb_source_mapping 解析、profile_yaml 全文随请求传给 parser；文件扩展名与所选档案 source_type
        不匹配时在预览即拦截（INVALID_PARAM）。 '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                mapping_profile:
                  type: string
                  description: 'M8 起为映射档案业务 id（t_kb_source_mapping.mapping_id）或内置名
                    （memotrace/liuhen_txt/liuhen_html，兼容 M3 旧值）；缺省按文件扩展名选默认档案
                    （M8-CONTRACTS.md §0.7/§5）'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatImportPreviewResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kb/{kbId}/chat-imports/confirm:
    parameters:
    - $ref: '#/components/parameters/KbId'
    post:
      tags:
      - chat-import
      summary: 执行聊天记录导入
      description: 'M3-CONTRACTS.md §3.5：`upload_token` 取自匹配预览接口返回值（30 分钟内 有效），可选
        `session_ids` 只导入子集会话（缺省=预览返回的全部会话）。按会话聚合 （chat_aggregation:{window_minutes,max_messages,window_overlap}，overlap
        默认 0=顺切，M8 起支持重叠滑窗）生成 chunk_type=chat_log 的分片，metadata 写
        session_id/session_name/sender/msg_time，M8 增 window_seq/msg_span；聊天文本默认开启脱敏。 '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatImportConfirmRequest'
      responses:
        '200':
          description: 已受理，异步执行导入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
