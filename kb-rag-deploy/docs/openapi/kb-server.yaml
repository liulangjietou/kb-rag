        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '自定义 Header：Authorization: Bearer <token>。服务端 token 表/内存缓存维护，

        有效期 24h；除 /api/v1/auth/login、/api/v1/auth/sso-available、/api/v1/auth/sso/**（含

        oidc/saml/cas 的 login 与回调）与 /actuator/** 外全部拦截。

        M15 起认证之后还有一道功能权限拦截：命中 @RequiresPermission 且主体不持有其中任一权限码时返回 403 FORBIDDEN。

        '
    ApiKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: kb-sk-*
      description: '对外开放 API（/api/v1/knowledge/*）专用鉴权，Header：Authorization: Bearer

        kb-sk-*；按 key_hash（SHA-256）查验，与管理台 bearerAuth 会话令牌相互独立、走独立过滤器链，

        独立限流（按 Key 令牌桶）（M4c-CONTRACTS.md §3）。

        '
    MemoryKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: kb-mk-*
      description: '记忆库开放 API（/api/v1/memory/*）专用鉴权，Header：Authorization: Bearer

        kb-mk-*；每把 Key 绑定唯一记忆库（应用级隔离），按 key_hash（SHA-256）查验，独立过滤器链，

        独立限流（按 Key 令牌桶）（M19）。

        '
  parameters:
    KbId:
      name: kbId
      in: path
      required: true
      schema:
        type: string
      description: 知识库业务主键（kb_id）
    DocId:
      name: docId
      in: path
      required: true
      schema:
        type: string
      description: 文档业务主键（doc_id）
    DictId:
      name: dictId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: ik 词典条目主键（t_kb_ik_dict.id，无独立业务字符串 ID，仅此表通用列 id 即主键）
    EvalDatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
      description: 评测集业务主键（dataset_id，M4b）
    EvalCaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
      description: 评测 case 业务主键（case_id，M4b）
    EvalRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
      description: 评测运行业务主键（run_id，M4b）
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
      description: 应用业务主键（app_id，M4c）
    AppVersionId:
      name: appVersionId
      in: path
      required: true
      schema:
        type: string
      description: 应用版本业务主键（app_version_id，M4c）
    ApiKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
      description: API Key 业务主键（key_id，M4c）
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema:
        type: string
      description: 检索反馈业务主键（feedback_id，M10）
    MemoryLibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
      description: 记忆库业务主键（library_id，M19）
    MemoryRuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
      description: 记忆规则业务主键（片段规则 mfr_* 或画像规则 mpr_*，M19）
    MemoryNodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
      description: 记忆节点业务主键（node_id，M19）
    MemoryAppKeyId:
      name: memoryKeyId
      in: path
      required: true
      schema:
        type: string
      description: Memory Key 业务主键（key_id，M19）
  responses:
    InvalidParam:
      description: 参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录或 token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamModelError:
      description: 上游模型 Provider 调用失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidApiKey:
      description: API Key 缺失/格式不正确/未匹配到任何存量哈希（INVALID_API_KEY），或存在但已被
        禁用（API_KEY_DISABLED），M4c
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: API Key 有效但其授权范围不包含所请求的应用（APP_ACCESS_DENIED），M4c
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VersionNotPublished:
      description: 应用版本存在但未处于可调用状态（VERSION_NOT_PUBLISHED），M4c
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 超出该 API Key 的 QPS 配额（RATE_LIMITED），响应头带 Retry-After 建议重试秒数，M4c
      headers:
        Retry-After:
          schema:
            type: integer
          description: 建议重试等待秒数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PermissionDenied:
      description: '已登录但无权（FORBIDDEN），M15。两种情形用同一响应：缺少该端点所需的功能权限码，

        或目标知识库不在调用方的库范围内。后者不降级为 404：库存在与否不是对方能靠接口探知的事，

        但把越权伪装成不存在会让正当调用方在自己搞错 kb_id 时无从分辨。'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorCode:
      type: string
      description: M1 错误码子集 + M4c 对外开放 API 新增错误码 + M15 FORBIDDEN，HTTP 状态码见括注
      enum:
      - INVALID_PARAM
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - INVALID_API_KEY
      - API_KEY_DISABLED
      - APP_ACCESS_DENIED
      - APP_NOT_FOUND
      - VERSION_NOT_FOUND
      - VERSION_NOT_PUBLISHED
      - RATE_LIMITED
      - PARSE_FAILED
      - UPSTREAM_MODEL_ERROR
      - INTERNAL_ERROR
    ErrorResponse:
      type: object
      description: 统一错误响应
      required:
      - code
      - message
      - request_id
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          example: 'invalid parameter: name is required'
        request_id:
          type: string
          description: 全链路透传的请求 ID，经 X-Request-Id Header 贯穿 kb-server/kb-parser/模型
            Provider 日志
          example: req-3f6a2e1c
    ResultEnvelope:
      type: object
      description: 统一成功响应外壳，具体业务负载见各接口 data 字段的组合 schema
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
          example: success
        request_id:
          type: string
    EmptyResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            nullable: true
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        mode:
          type: string
          nullable: true
          enum:
          - LOCAL
          - SSO
          description: 进来的入口；M15 新增，缺省读作 LOCAL，既有客户端不需改动。两个入口互不串用：
            本地账号走 SSO、目录账号走本地口令均拒绝
    LoginData:
      type: object
      properties:
        token:
          type: string
        must_change_password:
          type: boolean
    LoginResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/LoginData'
    ChangePasswordRequest:
      type: object
      required:
      - old_password
      - new_password
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    UserInfo:
      type: object
      description: 当前登录账号视图（MeResponse）。M15 起携带权限码与库范围，供控制台隐藏用不了的菜单与按钮；
        那只是展示，每个码到服务端会再校一次
      properties:
        username:
          type: string
        display_name:
          type: string
