  /api/v1/kb/{kbId}/index-config:
    parameters:
    - $ref: '#/components/parameters/KbId'
    put:
      tags:
      - knowledge-base
      summary: 更新知识库索引配置（分片参数/父子分片）
      description: 'M2-CONTRACTS.md §4：更新后重算 current_config_fingerprint，并对该知识库下

        活跃版本 chunk_fingerprint 不等于新指纹的文档置 config_stale=1（web 侧据此

        展示“N 篇文档使用旧配置”提示 + 重建入口）。仅更新配置元数据，**不会**立即

        触发重建，重建需显式调用 `POST /api/v1/kb/{kbId}/rebuild`。

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexConfig'
      responses:
        '200':
          description: 更新成功，返回最新知识库信息（含新指纹与索引配置）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kb/{kbId}/rebuild:
    parameters:
    - $ref: '#/components/parameters/KbId'
    post:
      tags:
      - knowledge-base
      summary: 按当前索引配置重建文档索引
      description: 'M2-CONTRACTS.md §4：body 可选 `doc_ids`，缺省时重建该知识库下全部

        config_stale=1 的文档。每篇文档一个 REBUILD 任务：从 MinIO 解析产物

        重切/重嵌入，同一物理索引内原子替换该版本 chunk（先写新 chunk 再删旧，

        引擎双写走既有同步机制），完成后置 config_stale=0。异步受理，幂等。

        '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildRequest'
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kb/{kbId}/documents:
    parameters:
    - $ref: '#/components/parameters/KbId'
    post:
      tags:
      - document
      summary: 上传文档（异步进入索引管线）
      description: 'multipart 上传；服务端校验扩展名 + magic number + 文件大小（≤100MB）。

        校验通过后立即返回，文档以 UPLOADED 状态异步进入解析/切分/索引管线。

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 已接收，进入异步处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
      - document
      summary: 文档列表
      parameters:
      - name: process_status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ProcessStatus'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResult'
  /api/v1/kb/{kbId}/documents/confirm:
    parameters:
    - $ref: '#/components/parameters/KbId'
    post:
      tags:
      - parse-preview
      summary: 批量确认解析预览
      description: 'M3-CONTRACTS.md §3.4：body 可选 `doc_ids`，缺省时确认该知识库下全部 PENDING_CONFIRM
        状态的文档。仅在知识库开启 `index_config.parse_preview_required` 时有意义；确认后各文档继续切分入库。 '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDocumentsRequest'
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kb/{kbId}/documents/batch-delete:
    parameters:
    - $ref: '#/components/parameters/KbId'
    post:
      tags:
      - document
      summary: 批量将文档移入回收站
      description: '控制台文档列表勾选后的批量删除。`doc_ids` 必填——重建与确认缺省成全量是安全的，

        批量删除缺省成"整库"则是会造成损失的默认值。列表中混入不属于该知识库的文档时整批

        拒绝（404），越权不被部分执行；已在回收站中的文档被跳过而非让整批失败（勾选与列表

        轮询之间被并发删除是常态），响应回真正移入回收站的 doc_id。语义与单篇

        `DELETE /api/v1/documents/{docId}` 一致：可逆，保留期内可在回收站还原。

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentBatchRequest'
      responses:
        '200':
          description: 已处理，返回真正移入回收站的文档 id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeleteDocumentsResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kb/{kbId}/documents/batch-reindex:
    parameters:
    - $ref: '#/components/parameters/KbId'
    post:
      tags:
      - document
      summary: 批量重建文档（完整重跑解析与索引）
      description: '控制台文档列表勾选后的批量重建，等同每行「重建」按钮的批量版，语义与单篇

        `POST /api/v1/documents/{docId}/reindex` 一致：完整重跑 pipeline（重新解析 → 切分 → 索引）。

        **与 `POST /api/v1/kb/{kbId}/rebuild` 是两件事**：那个按当前索引配置重建、复用 MinIO 里

        已有的解析产物，用于配置变更后的追平。`doc_ids` 必填；混入不属于该知识库的文档整批拒绝；

        在回收站中的、以及尚无任何版本可重建的文档被跳过，响应回真正提交重建的 doc_id。异步受理。

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentBatchRequest'
      responses:
        '200':
          description: 已受理，返回真正提交重建的文档 id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchReindexDocumentsResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kb/{kbId}/documents/{docId}/visibility:
