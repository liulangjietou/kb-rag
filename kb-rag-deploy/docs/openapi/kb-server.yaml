      - evidences
      properties:
        query:
          type: string
        messages:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ChatMessage'
        expected_answer:
          type: string
          nullable: true
        anchor_type:
          $ref: '#/components/schemas/AnchorType'
        evidences:
          type: array
