        status:
          $ref: '#/components/schemas/MemoryAppKeyStatus'
    MemoryAppKeyListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/MemoryAppKey'
    MemoryAppKeyIssued:
      allOf:
      - $ref: '#/components/schemas/MemoryAppKey'
      - type: object
        properties:
          api_key:
            type: string
            description: 完整明文 Key，仅签发/轮换响应返回一次，服务端不存明文
    MemoryAppKeyIssuedResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/MemoryAppKeyIssued'
    McpJsonRpcRequest:
      type: object
      description: 'MCP 端点的 JSON-RPC 2.0 请求（M20）。method 取 initialize / ping /
        tools/list / tools/call / notifications/*；通知不带 id，其余请求必带 id；不支持批量数组。
        tools/call 的 params 为 {name, arguments}，arguments 结构见 tools/list 返回的各工具
        inputSchema（与 REST 孪生端点的请求体一致）。'
      required:
      - jsonrpc
      - method
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          description: 请求标识，数字或字符串；通知（notifications/*）不带
          oneOf:
          - type: integer
          - type: string
        method:
          type: string
          description: initialize / ping / tools/list / tools/call / notifications/*
        params:
          type: object
          description: 方法参数；initialize 为 {protocolVersion, capabilities, clientInfo}，
            tools/call 为 {name, arguments}
          additionalProperties: true
    McpJsonRpcResponse:
      type: object
      description: 'MCP 端点的 JSON-RPC 2.0 响应（M20），result 与 error 互斥。协议违规走 error
        （-32700 解析错 / -32600 非法请求 / -32601 方法不存在 / -32602 参数错）；业务失败走
        tools/call 的 result，isError=true，content[0].text 形如「错误码: 消息」；成功时 result 含
        content（type=text 的 JSON 文本）与 structuredContent（同 REST data 结构）。'
      required:
      - jsonrpc
      - id
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          description: 回显请求 id；解析失败时为 null
          oneOf:
          - type: integer
          - type: string
          nullable: true
        result:
          type: object
          description: 成功平面；initialize 返 {protocolVersion, capabilities, serverInfo}，
            tools/list 返 {tools}，tools/call 返 {content, structuredContent, isError}
          additionalProperties: true
        error:
          type: object
          description: 协议错误平面
          properties:
            code:
              type: integer
            message:
              type: string
