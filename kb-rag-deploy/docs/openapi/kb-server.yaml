          type: string
        kb_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        dataset_revision:
          type: integer
          description: case 增删改即 +1，门禁可比性依据（M4b-CONTRACTS.md §1）
        case_count:
          type: integer
        last_run:
          $ref: '#/components/schemas/LastRunSummary'
        created_at:
          type: string
          format: date-time
    EvalDatasetResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/EvalDataset'
    EvalDatasetListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/EvalDataset'
    SkippedEvalCase:
      type: object
