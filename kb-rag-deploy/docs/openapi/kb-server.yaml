  /api/v1/apps/{appId}/chat-preview:
    parameters:
    - $ref: '#/components/parameters/AppId'
    post:
      tags:
      - app-center
      summary: 控制台内 chat 预览
      description: '经管理台登录鉴权，复用对外 chat 编排；可预览未发布版本（app_version_id 缺省取最新
        版本，不区分是否已发布）。stream 决定响应走 JSON 还是 SSE，事件契约与对外 /api/v1/knowledge/chat
        完全一致（M4c-CONTRACTS.md §2/§6 主会话定版）。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatPreviewRequest'
      responses:
        '200':
          description: 非流式返回完整应答；stream=true 时改为 text/event-stream，事件序列固定为
            message_delta*（零或多次）→ references → done，失败以 error 终结（不会同时出现 done 与
            error）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeChatResult'
            text/event-stream:
              schema:
                description: 'SSE 帧，event 取值与 data 负载见 M4c-CONTRACTS.md §6：message_delta
                  -> ChatStreamMessageDeltaEvent；references -> ChatStreamReferencesEvent；
                  done -> ChatStreamDoneEvent；error -> ChatStreamErrorEvent。'
                oneOf:
                - $ref: '#/components/schemas/ChatStreamMessageDeltaEvent'
                - $ref: '#/components/schemas/ChatStreamReferencesEvent'
                - $ref: '#/components/schemas/ChatStreamDoneEvent'
                - $ref: '#/components/schemas/ChatStreamErrorEvent'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamModelError'
