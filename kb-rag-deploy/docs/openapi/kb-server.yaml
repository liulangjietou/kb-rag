      properties:
        upload_token:
          type: string
        session_ids:
          type: array
          nullable: true
          description: 可选子集，缺省 = 匹配预览返回的全部会话
          items:
            type: string
    AlertConfig:
      type: object
      description: 'M3-CONTRACTS.md §3.6：t_kb_system_config 存储的告警配置。触发源： ①同类任务连续失败
        >= task_fail_threshold；②最近 5 分钟检索降级率 > degrade_rate_threshold；③双写积压 > sync_backlog_threshold（复用
        M2 补偿扫描统计）。 同一告警类型 silence_minutes 内不重复发送；未配置 webhook_url 时触发降级为 error 日志。 '
      properties:
        webhook_url:
          type: string
          nullable: true
        enabled:
