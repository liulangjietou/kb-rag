        properties:
          score:
            type: number
            format: double
            nullable: true
            description: 相关度得分（rerank 开启时为 rerank 得分，否则为检索引擎得分）
    MemorySearchData:
      type: object
      properties:
        memory_nodes:
          type: array
          items:
            $ref: '#/components/schemas/MemorySearchedNode'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/MemoryProfile'
          description: 该实体的用户画像，随检索结果一并返回
        rewritten_query:
          type: string
          nullable: true
          description: rewrite 开启时的改写后查询
        intent_recalled:
          type: boolean
          description: 意图判别结论；false 表示判定无需召回，memory_nodes 为空
    MemorySearchResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/MemorySearchData'
