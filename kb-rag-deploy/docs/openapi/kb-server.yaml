openapi: 3.0.3
info:
  title: kb-rag-server API
  description: 'kb-rag 管理台内部 API（M1 基线 + M2–M8 增量）。


    本文件按 docs/M1-CONTRACTS.md §5、docs/M2-CONTRACTS.md §1.5/§3/§4/§6 与

    docs/M3-CONTRACTS.md §3 定型的端点与 DTO 编写，用于 kb-rag-server / kb-rag-web

    之间的接口契约测试与前端 mock。

    M2 增量：search 新入参（改写/融合/重排/阈值/metadata_filter）与出参（applied、

    各路归一化分）、ik 词典 CRUD、知识库索引配置更新与按新配置重建。ik 词典热更新

    通道 `GET /internal/dict/ik/{ext|stop}.txt`（见 M2-CONTRACTS.md §3）面向 ES ik

    插件而非管理台前端，免鉴权、纯文本响应，不纳入本文件的管理台 API 契约。

    M3 增量：model-status 新增 vision_* 三字段；解析预览与确认（PENDING_CONFIRM 状态、

    单个/批量确认、改规则重解析）；聊天记录导入（匹配预览 + 确认执行）；告警 Webhook

    配置与测试；Demo 一键导入与状态查询；IndexConfig 新增 clean_rules/parse_preview_required/

    chat_aggregation。kb-parser 侧 VLM 调用与图片/清洗均在 kb-rag-server 完成，parser 不

    调用任何大模型（docs/M3-CONTRACTS.md §0/§1）。

    M4a 增量：文档版本列表与激活影响预检（`GET .../versions`、`GET .../activate-impact`、
    `POST .../activate`）、跨版本待复核标注清单、分片标注四操作（编辑/启禁用/合并/拆分）。

    M4b 增量（docs/M4b-CONTRACTS.md）：评测体系全链路——评测集与 case 的增删改查、
    证据复核工作台（`stale-cases`/`recheck`）、Demo 示例评测集导入（`import-demo`）、
    检索调试页一键收进评测集（`cases/from-retrieval`）与检索结果反馈标注
    （`retrieval-feedback`）、评测运行配置矩阵与费用预估（`runs`/`runs/estimate`）、
    run 详情/命中明细下钻/多 run 对比（`eval-runs/{runId}`、`.../results`、
    `eval-runs/compare`）；`ActivateImpact.affected_eval_case_count` 由恒 0 占位改为
    真实统计。对外 API Key 网关（应用发布渠道）属于 M4c 范畴，不在本文件中。
    M4c 增量（docs/M4c-CONTRACTS.md）：应用中心全链路——应用 CRUD（`/api/v1/apps`）、版本创建/
    列表/详情、门禁评测集绑定（`gate-dataset`）、提交测试（`submit-test`）、发布门禁与强制发布
    （`release?force`）、回滚（`rollback`）；控制台内 chat 预览（`chat-preview`，复用对外 chat
    编排，支持 SSE，事件契约与对外 `/api/v1/knowledge/chat` 一致）；对外开放 API（`/api/v1/
    knowledge/search`、`/api/v1/knowledge/chat`，API Key 鉴权，独立鉴权/限流过滤器链，
    securityScheme 见 `ApiKeyBearer`，与管理鉴权 `bearerAuth` 相互独立）；API Key 管理（创建/
    列表/启禁用/授权范围/轮换/删除，`/api/v1/api-keys`）；调用审计查询与统计（`/api/v1/
    api-audit-logs`、`.../stats`）。八状态发布状态机 `AppVersionStatus`、三态门禁结论
    `GateVerdict` 与其分类原因 `GateReason` 详见对应 schema。
    M5 增量（docs/M5-CONTRACTS.md）：多知识库路由——应用版本配置的 `kb_id` 单库字段废弃为兼容
    可选项，新增 `kb_refs`（1..15 个知识库+配额权重）与 `routing`（LLM 选库开关+自定义 Prompt，
    输出与候选白名单求交集，空交集/解析失败/超时/未配置模型一律降级检索全部关联库并记
    `route_fallback_all`）；跨库检索按库内排名做 Reciprocal Rank Fusion 合并，rerank 候选总
    预算按 `kb_refs` 权重比例分配（向下取整，余量归权重最高库）；`AppliedInfo`/
    `AppliedSearchParams` 新增 `routed_kb_ids`（本次实际检索的库），`KnowledgeChatResponse`
    顶层新增 `routed_kb_ids`，SSE `done` 事件同增；`RetrievalNode.metadata` 新增 `kb_id`
    （全量填充，来自事实源行）；门禁评测集绑定放宽为「所属知识库属于版本 kb_refs 并集」。
    旧版仅存单 `kb_id` 的快照读侧兼容翻译为等价单元素 `kb_refs`，永不需要迁移。
    M6 增量（docs/M6-CONTRACTS.md）：索引快照发布——门禁通过/force 之后、状态切 RELEASED 之前，
    对关联知识库物理索引建不可变快照并固化当时的版本可见集，写入 `AppVersion.index_snapshots`
    （每库每引擎一条，物理索引名直存不重算）与 `visible_version_kb_count`（按库汇总的文档版本数，
    只给数量不给 id 列表）；经 RELEASED 版本（含 rollback 重新发布的历史版本）发起的对外
    search/chat 固定检索这份快照与固化可见集，TESTING 灰度/chat-preview/管理台调试/评测仍走实时
    别名与当前激活集合；快照索引被误删时降级为实时别名并记 `degraded=snapshot_index_missing`
    （M6 之前发布、本就没有快照的旧 RELEASED 版本走同样路径但不记该标记，是历史数据形态而非故障）；
    `DocumentVersionResponse` 新增 `pinned`/`pinned_by`，被任意未清理应用版本（含 SUPERSEDED）
    的固化可见集引用即 pin，归档保留清理跳过之。同 PR 补 M5 遗漏的 `route_fallback_all` 枚举值。

    M7 增量（docs/M7-CONTRACTS.md）：GraphRAG 图检索路——知识库图配置
    （`GET/PUT /api/v1/kb/{kbId}/graph/config`，graph_enabled 开关）、全量实体关系抽取
    （`POST .../graph/extract`，先清空再对激活版本启用分片逐片 LLM 抽取）、图谱概览/实体列表/
    实体关联分片下钻（`.../graph/summary`、`.../graph/entities`、
    `.../graph/entities/{entityName}/chunks`）；检索三路混排接入图路，query 侧实体匹配为
    「query 轻量切分 + Neo4j 实体名 fulltext（cjk 分析器）」，不做 query 级 LLM 抽取；
    `degraded` 枚举补 `graph_route_unavailable`；正式版（索引快照上下文）调用图路直接关闭且
    不记降级（图数据无快照副本，属能力边界）；Neo4j 以 compose profile=graph 可选启用，
    `NEO4J_URI` 留空即整体禁用图能力且其余功能零影响。

    M8 增量（docs/M8-CONTRACTS.md）：导入与解析增强——导入映射档案维护
    （`GET/POST /api/v1/source-mappings`、`PUT/DELETE /api/v1/source-mappings/{mappingId}`、
    `POST .../{mappingId}/copy`，t_kb_source_mapping 落库，内置模板启动种子化、不可改删可复制）；
    聊天导入 `mapping_profile` 入参改为传映射档案业务 id 或内置名（兼容旧值），格式范围扩
    TXT/HTML（parser 侧新增行模板/DOM 选择器适配器，profile_yaml 全文随请求传给 parser）；
    聊天聚合新增 `window_overlap` 重叠滑窗参数（默认 0=既有顺切，约束 overlap×2 < max_messages），
    聊天 chunk metadata 增 `window_seq`/`msg_span`；检索侧近重复归并——同会话 `msg_span`
    重叠率 ≥ 0.5 的命中只保留排名最高者，被并者记入存活者 metadata
    `merged_window_chunk_ids`（≤5）。PaddleOCR 本地 OCR 兜底属 kb-parser 侧（见 kb-parser.yaml），
    server 对带 `ocr_source` 标记的页不再调 VLM。


    0.10.1 修订（全量前后端契约对齐扫描）：按端点逐个比对 controller 映射与 DTO 的

    @JsonProperty，修正本文件与 server 实现不符之处，均已对运行实例只读实测取证——

    ①`DocumentChunk` 删除服务端并不下发的 kb_id/doc_id，补 chunk_type/chunk_text_hash/

    disabled_child_ids（后者在分片列表是顶层字段，在检索响应 RetrievalNode 上则位于

    metadata 内，两处位置不同）；②`Document` 补 created_at 与仅上传响应返回的

    version_id/version/duplicated/duplicate_of_doc_id；③`KnowledgeBase`/`EvalCase`/

    `EvalDataset` 删除并不返回的 updated_at（服务端全局 non_null 序列化，只有

    SourceMapping/IkDictEntry/App/AppVersion 真的暴露该列）；④`IkDictEntry` 删除并不存在的

    自增 id、补 remark；⑤`ChatImportPreviewData` 补 skipped；⑥`DocumentPreview` 补

    doc_id/process_status，`PreviewImage` 补 page_no/kind/status；⑦`IndexConfig` 补

    split_strategy（新增 `SplitStrategy` 枚举，两个成员）与只读的 embedding_model。


    0.11.0-m10（检索质量闭环，docs/M10-CONTRACTS.md）：①`retrieval-feedback` 提交由

    log-only 升级为持久化行并返回该行；②新增反馈管理端点（列表/转评测集/忽略）；

    ③新增检索洞察端点（明细分页 + 内容缺口统计报表）；④`CaseSource` 枚举新增 FEEDBACK。


    0.12.0-m11（内容治理，docs/M11-CONTRACTS.md）：①`Document` 新增治理字段

    publish_status/review_note/effective_at/expires_at/trashed_at（新增 `PublishStatus`

    枚举），`KnowledgeBase` 新增 review_required；②新增审核发布端点（submit-review/

    approve/reject）、有效期端点（validity）、回收站端点（trash 列表/restore/purge）与

    KB 级治理开关（governance）；③**DELETE /api/v1/documents/{docId} 语义变更**：

    由不可逆删除改为移入回收站（可还原），不可逆删除迁移至 purge 端点。


    0.13.0-m12（数据接入：URL 导入与增量同步，docs/M12-CONTRACTS.md）：①新增网页登记端点

    （登记即抓 / 列表 / 手动同步 / 定时同步开关 / 移除登记，新增 `WebSource` schema 与

    `WebSourceFetchStatus` 枚举）；②抓取产物统一走文档上传管线（同名加版本、content_hash

    去重），登记与文档为弱绑定——移除登记不删文档；③上传白名单扩展 html 后缀

    （UPLOAD_ALLOWED_EXTENSIONS 新增 html）。


    0.14.0-m14（六特性：外部数据源连接器/配置化元数据抽取/切分策略扩展/Rerank 混合模式/视觉理解

    整页索引/以图搜图，docs/M14-CONTRACTS.md）：①新增外部数据源端点（登记/列表/手动同步/对象明细/

    编辑/连通性测试/移除，新增 `ext-source` tag 与 `ExtSource`/`ExtSourceItem` schema，secret 恒

    脱敏返回 `******`、更新传空=保留旧值）；②`IndexConfig` 增 `metadata_rules`（常量/正则/词表

    三类抽取规则，新增 `MetadataRule` schema）、`split_separator`/`split_separator_is_regex`/

    `split_heading_level`（配合 `SplitStrategy` 扩展的 separator/heading/page 三策略）、

    `multimodal_enabled`（KB 级多模态整页索引开关）；③`SearchRequest` 增 `images`（以图搜图，裸

    base64、≤3 张）、`rerank_mode`（semantic 默认/hybrid）、`rerank_w_semantic`（hybrid 语义权重，

    默认 0.7）、`MetadataFilter.custom`（抽取键等值过滤）；④`DegradedReason` 补

    `mm_route_skipped`/`mm_route_unavailable`；⑤`ModelStatus` 补 multimodal_configured/provider/

    model。全部纯新增、缺省即现状（详见 M14-CONTRACTS.md §0 兼容红线）。


    M15（权限体系）新增：①`/api/v1/auth/sso-available` 供登录页决定是否展示单点登录入口，

    `LoginRequest` 增 `mode`（LOCAL/SSO，缺省读作 LOCAL，既有客户端不受影响）；②`/api/v1/users`

    与 `/api/v1/roles` 两组用户与角色管理端点；③`/api/v1/auth/me` 返回体扩为 `MeResponse`

    （补 display_name/source/roles/permissions/kb_scope_all/kb_ids）；④`ErrorCode` 增 `FORBIDDEN`，

    功能权限不足统一 403 `PermissionDenied`，知识库越权同样 403（不降级为 404）。

    详见 M15-CONTRACTS.md §3。


    M16（企业化）新增：①多租户——`/api/v1/tenants` 租户管理（无 DELETE，停用即退役）与

    `PUT /api/v1/users/{userId}/tenant` 移户，`ConsoleUser`/`CreateUserRequest` 增 `tenant_id`；

    ②文档级数据权限——`/api/v1/kb/{kbId}/documents/{docId}/visibility` GET/PUT（INHERIT/RESTRICTED），

    `Document` 增 `restricted` 只读标记；③SSO 三协议——`/api/v1/auth/sso/providers` 与

    OIDC/SAML/CAS 各自的 login/回调端点（全部免认证，回调以 302 + URL fragment 交付会话令牌），

    `source` 枚举扩展 OIDC/SAML/CAS；④开放 API 反馈——`POST /api/v1/knowledge/feedback`（API Key

    鉴权），`RetrievalFeedback` 增 `channel`/`end_user_id`，反馈列表增 channel 筛选；⑤操作审计——

    `/api/v1/operation-audits` 查询端点。全部纯新增（详见 M16-CONTRACTS.md）。


    0.19.0-m19 增量：M17 网页源 render_js（JS 渲染抓取）、M18 站点凭据 /api/v1/web-credentials、

    M19 记忆库——管理端 /api/v1/memory-libraries（memory-library tag）与开放端 /api/v1/memory/*

    （memory-open-api tag，Authorization: Bearer kb-mk-* 独立鉴权与限流）。全部纯新增

    （详见 M17/M18/M19-CONTRACTS.md）。


    0.20.0-m20 增量：MCP 协议层——知识库应用与记忆库各暴露一个 MCP Streamable HTTP 端点

    （POST /api/v1/knowledge/mcp、POST /api/v1/memory/mcp，mcp tag），JSON-RPC 2.0 单请求单

    JSON 响应，协议版本 2025-03-26（兼容 2024-11-05）；鉴权/限流/审计完全复用各自 REST 过滤器链

    （kb-sk-* / kb-mk-*）；工具集 knowledge_search/knowledge_chat（非流式）与 memory 六工具，

    参数与返回结构同 REST 孪生端点。协议违规回 JSON-RPC error，业务失败回 isError=true 工具结果，

    HTTP 恒 200（通知为 202 无 body）。全部纯新增（详见 M20-CONTRACTS.md）。


    0.21.0-m14-fix 增量：M14 切分策略装配缺陷修复（详见 M14-CONTRACTS.md §4 v1.1 修订条）。

    ①`SplitStrategy` 补齐 separator/heading/page——此前枚举只有两个成员而配置写入以它为唯一

    白名单，三个已交付策略保存即 INVALID_PARAM（上文 0.9.0-m4b 段"两个成员"是当时事实，现为五个）；

    ②`DocumentPreview` 增 `page_ranges`、`ParsePreviewPage` 增 `markdown`——按页切分改为消费

    逐页清洗并插回图片代理后的正文（此前读解析原文，绕过脱敏且分片图片恒空）；

    ③`parent_child_enabled=true` 时可选策略由 fixed_length/llm_semantic 收窄为仅 fixed_length。

    ③为口径收窄（此前接受的 llm_semantic 组合实际跑的就是 fixed_length，行为不变、不再撒谎），

    其余为纯新增字段。

    '
  version: 0.21.0-m14-fix
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://127.0.0.1:20000
  description: 本地开发（kb-rag-server 默认端口，见契约 §0）
tags:
- name: auth
  description: 登录（本地口令/单点登录）、改密、当前用户
- name: rbac
  description: 权限体系：用户与角色管理、权限目录（M15，docs/M15-CONTRACTS.md §3）
- name: tenant
  description: 多租户管理：租户 CRUD 与移户，仅默认租户超管可达（M16，docs/M16-CONTRACTS.md §3.1）
- name: operation-audit
  description: 操作审计「谁」维度：管理台写操作留痕查询（M16，docs/M16-CONTRACTS.md §3.7）
- name: knowledge-base
  description: 知识库管理
- name: document
  description: '文档上传、状态查询、分片查看、重建索引。本组按 docId / chunkId / annotationId
    直接寻址的端点一律先解析归属知识库：其他租户的 id 读作不存在 → 404（不是 403，见 M16-CONTRACTS.md
    §1.3.2）。'
- name: search
  description: 检索调试
- name: dict
  description: ik 中文分词自定义词典管理（M2）
- name: parse-preview
  description: 解析预览与确认（M3，docs/M3-CONTRACTS.md §3.4）
- name: chat-import
  description: 聊天记录导入（M3，docs/M3-CONTRACTS.md §3.5）
- name: alert
  description: 告警 Webhook 配置（M3，docs/M3-CONTRACTS.md §3.6）
- name: demo
  description: Demo 一键导入（M3，docs/M3-CONTRACTS.md §3.7）
- name: eval
  description: '评测体系：评测集/case/证据复核/评测运行与报告（M4b，docs/M4b-CONTRACTS.md）。
    本组按 datasetId / caseId / runId / feedbackId 直接寻址的端点一律先解析到评测集（该表自身在
    行级围栏内，case 与 run 经它两跳）：其他租户的 id 读作不存在 → 404（见 M16-CONTRACTS.md §1.3.2）。'
- name: insight
  description: 检索洞察：零命中/降级记录明细与内容缺口报表（M10，docs/M10-CONTRACTS.md §2.2）
- name: governance
  description: '内容治理：审核发布/有效期/回收站（M11，docs/M11-CONTRACTS.md §2.2）。本组端点
    全部按 docId 直接寻址，一律先解析归属知识库：其他租户的 docId 读作不存在 → 404，审核、改密级、
    回收站与彻底删除均不会发生（见 M16-CONTRACTS.md §1.3.2）。'
- name: web-source
  description: 数据接入：URL 登记导入与增量同步（M12，docs/M12-CONTRACTS.md §3.4）
- name: ext-source
  description: '外部数据源连接器：S3/OSS 兼容对象存储登记、扫描与增量同步（M14，docs/M14-CONTRACTS.md
    §2）。按 sourceId 寻址的端点一律先解析归属知识库，按 kbId 的列表端点先解析该库：其他租户的 id
    读作不存在 → 404，更新、硬删与连接测试的外发请求一条都不发出（见 M16-CONTRACTS.md §1.3.2）。'
- name: app-center
  description: 应用中心：应用/版本/发布门禁与控制台 chat 预览（M4c，docs/M4c-CONTRACTS.md §2）
- name: api-key
  description: API Key 管理（M4c，docs/M4c-CONTRACTS.md §3）
- name: api-audit
  description: '对外调用审计查询与统计（M4c，docs/M4c-CONTRACTS.md §3）。审计行经 key_id 归属租户，
    查询先经行级围栏读出调用者租户下的 API Key 集合再据此过滤：`key_id` 缺省时只覆盖本租户的 Key，
    传入其他租户的 key_id 与传入一个不存在的 key 同解（空结果，不是 403），见 M16-CONTRACTS.md
    §1.3.2。'
- name: open-api
  description: 对外开放 API：search/chat，独立 API Key 鉴权/限流过滤器链（M4c，docs/M4c-CONTRACTS.md
    §3）
- name: system
  description: 系统状态与健康检查
- name: memory-library
  description: 记忆库管理：库/记忆片段规则/用户画像规则/记忆详情/检索调试/Memory Key（M19，对标百炼记忆库控制台）
- name: memory-open-api
  description: 记忆库开放 API：add/search/memory_nodes/profiles，独立 Memory Key（kb-mk-*）鉴权与限流（M19）
- name: mcp
  description: MCP 协议层：知识库应用与记忆库的 MCP Streamable HTTP 端点，JSON-RPC 2.0，凭证与限流复用各自
    REST 过滤器链（M20，docs/M20-CONTRACTS.md）
security:
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: 管理员登录（本地口令 / 单点登录）
      description: 'mode=LOCAL 校验本地口令；mode=SSO 走目录 bind，目录账号首登自动建号并授予配置的默认角色。

        登录失败记入 t_kb_login_audit；连续失败 5 次锁定 15 分钟，但目录不可达（DIRECTORY_UNAVAILABLE）不计入失败次数。'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidParam'
  /api/v1/auth/change-password:
    post:
      tags:
      - auth
      summary: 修改密码（含首登强制改密场景）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: 获取当前登录用户信息
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/sso-available:
    get:
      tags:
      - auth
      summary: 单点登录入口是否可用
      description: 免认证；登录页据此决定是否渲染单点登录 Tab。开关来自 kb.auth.ldap.enabled 与 url 是否配置。
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoAvailabilityResult'
  /api/v1/auth/sso/providers:
    get:
      tags:
      - auth
      summary: 可用的浏览器重定向 SSO 协议（M16）
      description: 免认证；登录页据此渲染协议按钮。某协议为 true 需同时满足 enabled、必填项非空
        与 kb.auth.sso.web-base-url 已配置（回调不知道把令牌送去哪里就不算就绪）。
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoProvidersResult'
  /api/v1/auth/oidc/login:
    get:
      tags:
      - auth
      summary: 发起 OIDC 登录（302 到 IdP 授权端点，M16）
      description: 免认证；签发一次性 state（10 分钟过期）后 302 到发现文档中的授权端点。协议未启用时 400。
      security: []
      responses:
        '302':
          description: 重定向到身份提供方
        '400':
          $ref: '#/components/responses/InvalidParam'
  /api/v1/auth/oidc/callback:
    get:
      tags:
      - auth
      summary: OIDC 回调（M16）
      description: '免认证；验 state → code 换 token → 验 id_token（JWKS 验签 + iss/aud/exp）→ JIT
        建号（落默认租户）→ 302 到 {web-base-url}/login#sso_token={token}；失败同样 302，以
        #sso_error={中文原因} 交付——令牌与错误都走 fragment，不进服务器日志与 Referer。'
      security: []
      parameters:
      - name: code
        in: query
        required: false
        schema: {type: string}
      - name: state
        in: query
        required: false
        schema: {type: string}
      responses:
        '302':
          description: 重定向回控制台登录页，结果在 URL fragment
  /api/v1/auth/saml/login:
    get:
      tags:
      - auth
      summary: 发起 SAML 登录（SP-initiated，302 到 IdP SSO URL，M16）
      description: 免认证；携 deflate+base64 的 AuthnRequest 与一次性 RelayState。协议未启用时 400。
      security: []
      responses:
        '302':
          description: 重定向到身份提供方
        '400':
          $ref: '#/components/responses/InvalidParam'
  /api/v1/auth/saml/acs:
    post:
      tags:
      - auth
      summary: SAML 断言消费端点（IdP POST 回来的 Response，M16）
      description: 免认证；验 RelayState → 验 Response 签名（配置的 IdP 证书）→ 验
        NotOnOrAfter/Audience/InResponseTo → 取 NameID 统一落地；结果同样以 302 + fragment 交付。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse:
                  type: string
                  description: base64 编码的 SAML Response（字段名由 SAML POST binding 固定）
                RelayState:
                  type: string
      responses:
        '302':
          description: 重定向回控制台登录页，结果在 URL fragment
  /api/v1/auth/cas/login:
    get:
      tags:
      - auth
      summary: 发起 CAS 登录（302 到 {server-url}/login，M16）
      description: 免认证；无自建 state——CAS ticket 本身一次性且绑定 service URL。协议未启用时 400。
      security: []
      responses:
        '302':
          description: 重定向到 CAS 服务器
        '400':
          $ref: '#/components/responses/InvalidParam'
  /api/v1/auth/cas/callback:
    get:
      tags:
      - auth
      summary: CAS 回调（M16）
      description: 免认证；持 ticket 服务端 GET {server-url}/p3/serviceValidate → 解析 cas:user 统一落地；
        结果以 302 + fragment 交付。
      security: []
      parameters:
      - name: ticket
        in: query
        required: false
        schema: {type: string}
      responses:
        '302':
          description: 重定向回控制台登录页，结果在 URL fragment
  /api/v1/users:
    get:
      tags:
      - rbac
      summary: 用户分页列表（USER_MANAGE）
      description: 行内填 role_names 供列表展示；role_ids 只在详情返回。
      parameters:
      - name: keyword
        in: query
        description: 按登录名/显示名/邮箱模糊匹配
        schema: {type: string}
      - name: status
        in: query
        schema: {type: string, enum: [ENABLED, DISABLED]}
      - name: source
        in: query
        schema: {type: string, enum: [LOCAL, LDAP, OIDC, SAML, CAS]}
      - name: page
        in: query
        schema: {type: integer, default: 1}
      - name: size
        in: query
        schema: {type: integer, default: 20}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleUserPageResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags:
      - rbac
      summary: 创建本地账号（USER_MANAGE）
      description: 无自助注册，账号只由管理员创建；初始口令由创建者设定，被建账号首登强制改密。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: 新建账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleUserResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema: {type: string}
    get:
      tags:
      - rbac
      summary: 用户详情（USER_MANAGE）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleUserResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - rbac
      summary: 修改显示名与邮箱（USER_MANAGE）
      description: 登录名不可改——会话令牌与全部审计行都以它为键。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleUserResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    delete:
      tags:
      - rbac
      summary: 删除账号（USER_MANAGE）
      description: 不允许删除自己；删除同时清理角色关联并吊销该账号的会话。
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/users/{userId}/status:
    parameters:
    - name: userId
      in: path
      required: true
      schema: {type: string}
    put:
      tags:
      - rbac
      summary: 启用/停用账号（USER_MANAGE）
      description: 不允许停用自己；停用即刻吊销该账号已签发的会话。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleUserResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/users/{userId}/roles:
    parameters:
    - name: userId
      in: path
      required: true
      schema: {type: string}
    put:
      tags:
      - rbac
      summary: 全量替换用户角色（USER_MANAGE）
      description: 提交完整集合而非增删差异；改完立即失效该账号的权限缓存。不允许改自己的角色。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRolesRequest'
      responses:
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleUserResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/users/{userId}/tenant:
    put:
      tags:
      - tenant
      summary: 移户（TENANT_MANAGE，M16）
      description: 把账号划入另一租户：清空其全部角色绑定并吊销会话——角色是租户内资源，跨户携带必然悬空。
        仅默认租户超管可达（tenant:manage）。
      parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveUserTenantRequest'
      responses:
        '200':
          description: 已移户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{userId}/reset-password:
    parameters:
    - name: userId
      in: path
      required: true
      schema: {type: string}
    post:
      tags:
      - rbac
      summary: 重置口令（USER_MANAGE）
      description: 不校验旧口令（前提就是已无人知道它）；重置后置 must_change_password 并吊销会话。目录账号无本地口令，返回 INVALID_PARAM。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetUserPasswordRequest'
      responses:
        '200':
          description: 已重置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/roles:
    get:
      tags:
      - rbac
      summary: 角色列表（ROLE_MANAGE）
      description: 裸数组，角色总量小不分页。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags:
      - rbac
      summary: 新建角色（ROLE_MANAGE）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRoleRequest'
      responses:
        '200':
          description: 新建角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/roles/permissions:
    get:
      tags:
      - rbac
      summary: 权限目录（ROLE_MANAGE）
      description: 角色编辑页勾选网格的数据源，按 module 分组。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/roles/{roleId}:
    parameters:
    - name: roleId
      in: path
      required: true
      schema: {type: string}
    get:
      tags:
      - rbac
      summary: 角色详情（ROLE_MANAGE）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - rbac
      summary: 修改角色（ROLE_MANAGE）
      description: 权限集合与库范围都是全量替换；code 只在创建时读取，更新时忽略（配置与建号默认角色都引用它）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRoleRequest'
      responses:
        '200':
          description: 更新后的角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    delete:
      tags:
      - rbac
      summary: 删除角色（ROLE_MANAGE）
      description: 内置角色与仍被账号持有的角色不可删，返回 INVALID_PARAM。
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/tenants:
    get:
      tags:
      - tenant
      summary: 租户列表（TENANT_MANAGE，M16）
      description: 内置默认租户排首。类级 tenant:manage 守卫，种子只授默认租户超管——这是控制台唯一的跨租户视角。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags:
      - tenant
      summary: 新建租户（TENANT_MANAGE，M16）
      description: 自动为新租户复制五个内置角色（否则首个账号无角色可授）；首账号由默认租户超管在用户管理页创建。
        code 建后不可改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTenantRequest'
      responses:
        '200':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/v1/tenants/{tenantId}:
    parameters:
    - name: tenantId
      in: path
      required: true
      schema: {type: string}
    get:
      tags:
      - tenant
      summary: 租户详情（TENANT_MANAGE，M16）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - tenant
      summary: 租户改名（TENANT_MANAGE，M16）
      description: 仅 name 可改；request 中的 code 被忽略。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTenantRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tenants/{tenantId}/status:
    put:
      tags:
      - tenant
      summary: 启用/停用租户（TENANT_MANAGE，M16）
      description: 无 DELETE 端点——租户下挂着索引、文件与审计，退役语义是先停用后人工清算。停用后该租户
        全部账号登录被拒，存量会话下一次请求 401。DEFAULT 租户不可停用。
      parameters:
      - name: tenantId
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantStatusRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/source-mappings:
    get:
      tags: [source-mapping]
      summary: 导入映射列表（内置在前，组内按名称升序）
      parameters:
      - name: source_type
        in: query
        schema: {type: string, enum: [csv, xlsx, txt, html]}
      responses:
        '200':
          description: 裸数组（内置+自定义总量小，不分页）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceMapping'
    post:
      tags: [source-mapping]
      summary: 新建自定义映射
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceMappingRequest'
      responses:
        '200':
          description: 新建行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceMapping'
  /api/v1/source-mappings/{mappingId}:
    parameters:
    - name: mappingId
      in: path
      required: true
      schema: {type: string}
    put:
      tags: [source-mapping]
      summary: 全量替换自定义映射（内置行返回 INVALID_PARAM）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceMappingRequest'
      responses:
        '200':
          description: 更新后的行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceMapping'
    delete:
      tags: [source-mapping]
      summary: 删除自定义映射（内置行返回 INVALID_PARAM）
      responses:
        '200':
          description: 已删除
  /api/v1/source-mappings/{mappingId}/copy:
