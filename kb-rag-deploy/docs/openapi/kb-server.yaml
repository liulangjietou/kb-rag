        type: string
    put:
      tags:
      - web-source
      summary: 更新登记开关（定时同步 / JS 渲染，均可选）
      description: 'M17-CONTRACTS.md §3.3：登记的可变开关——定时同步与 JS 渲染。两字段均可选，只更新传入的那个，翻开关不触发抓取。
        其他租户的 sourceId 读作不存在 → 404（见 M16-CONTRACTS.md §1.3.2）。'
      requestBody:
