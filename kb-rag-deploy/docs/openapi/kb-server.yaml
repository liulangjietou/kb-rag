      schema: {type: string}
    post:
      tags: [source-mapping]
      summary: 复制为自定义映射
      description: body 可省略；name 缺省生成「副本-原名」，已占用则追加序号。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
      responses:
        '200':
          description: 复制出的自定义行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceMapping'
  /api/v1/annotations/{annotationId}/migrate:
    parameters:
    - name: annotationId
      in: path
      required: true
      schema: {type: string}
    post:
      tags: [annotation]
      summary: 把待复核标注迁移到目标分片（M9，幂等）
      description: 'M9-CONTRACTS.md §0.5：仅支持 TOGGLE/EDIT（MERGE/SPLIT 返回 INVALID_PARAM）；目标须与
        标注同文档；重复迁移返回 already_migrated=true。无自动迁移、无批量端点。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_chunk_id]
              properties:
                target_chunk_id: {type: string}
      responses:
        '200':
          description: 迁移结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  annotation_id: {type: string}
                  target_chunk_id: {type: string}
                  annotation_type: {type: string}
                  inherit_status: {type: string}
                  changed_chunk_ids: {type: array, items: {type: string}}
                  already_migrated: {type: boolean}
  /api/v1/kb:
