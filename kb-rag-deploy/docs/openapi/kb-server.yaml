    parameters:
    - $ref: '#/components/parameters/AppVersionId'
    get:
      tags:
      - app-center
      summary: 版本详情
      description: '含门禁结论。其他租户的 appVersionId 读作不存在 → 404，配置快照（关联知识库、
        模型配置）不会返回；与"版本不存在"共用同一错误码与同一文案（见 M16-CONTRACTS.md §1.3.2）。'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersionResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/app-versions/{appVersionId}/gate-dataset:
    parameters:
    - $ref: '#/components/parameters/AppVersionId'
    put:
      tags:
      - app-center
      summary: 绑定或清空门禁评测集
      description: 仅 DRAFT/TESTING 态可修改；评测集所属知识库须属于该版本 kb_refs 集合（并集判断，
        M5 起不再要求与单一知识库一致），否则 400。判定顺序为版本租户（404）→ 评测集数据范围（403）
        → 版本状态（400）：先判评测集会让跨租户的版本答 403，用状态码差异泄露"这个 id 在别的租户里
        存在"（见 M16-CONTRACTS.md §1.3.2）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateDatasetRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersionResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/app-versions/{appVersionId}/submit-test:
    parameters:
    - $ref: '#/components/parameters/AppVersionId'
    post:
      tags:
      - app-center
      summary: 草稿提交测试（DRAFT -> TESTING）
      description: 补全并冻结配置快照（先知识库、再部署默认），冻结后不再回落任何实时默认值。
        其他租户的 appVersionId 读作不存在 → 404，快照不会被写入（见 M16-CONTRACTS.md §1.3.2）
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersionResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/app-versions/{appVersionId}/release:
    parameters:
    - $ref: '#/components/parameters/AppVersionId'
    post:
      tags:
      - app-center
      summary: 发布（自动执行门禁）
      description: '绑定 gate_dataset 时进入 GATING 同语料双跑（候选与当前 RELEASED 配置各一轮），
        仅在双方有效 case 交集上比较 Hit Rate/Recall@K，容差 ε=max(0.02, 1/N)；三态结论 GATE_PASSED
        自动放行，GATE_LOG_ONLY/GATE_BLOCKED 需 force=true 显式放行并留痕（force_operator）。
        响应即调用返回时刻的版本状态：门禁场景下为 GATING，双跑异步执行，控制台轮询详情接口获取结果
        （M4c-CONTRACTS.md §2）。门禁通过/force 之后、状态切 RELEASED 之前，对关联的每个知识库
        物理索引建不可变快照并固化当时的版本可见集（写入 index_snapshots/visible_version_kb_count，
        M6-CONTRACTS.md §0.3）；任一库快照失败则发布中止、版本停留在门禁结论状态可重试，已建的本次
        快照索引会被回滚删除。此后经该 RELEASED 版本（含 rollback 重新发布的历史版本）发起的对外
        search/chat 调用固定检索这份快照索引与固化可见集，不受快照建立之后的新文档/新版本影响；
        管理台调试与 TESTING 灰度调用仍走实时别名与当前激活集合。
        其他租户的 appVersionId 读作不存在 → 404，且判定发生在门禁之前：双跑不会被提交、索引快照
        不会被冻结、状态不会被切（见 M16-CONTRACTS.md §1.3.2）。'
      parameters:
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: true 时无视非通过门禁结论强制放行，记录 force_operator 为当前登录用户
      responses:
        '200':
          description: 调用返回时刻的版本状态（GATING/GATE_PASSED/GATE_LOG_ONLY/GATE_BLOCKED/RELEASED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersionResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/app-versions/{appVersionId}/rollback:
    parameters:
    - $ref: '#/components/parameters/AppVersionId'
    post:
      tags:
      - app-center
      summary: 回滚为正式版
      description: 仅 SUPERSEDED 态版本可回滚；门禁不重跑（历史结论视为既成事实），原 RELEASED 版本转
        SUPERSEDED，发布/回滚均为原子状态切换。回滚后的检索恢复该版本自己发布时冻结的索引快照与
        版本可见集（历史知识状态），不会重新对当前语料建快照；被 SUPERSEDED 的版本只要其快照仍存在
        即持续视为"被引用"，归档清理会跳过其固化可见集覆盖的文档版本，直到快照按保留策略被清理
        （M6-CONTRACTS.md §0.8/§0.9）。其他租户的 appVersionId 读作不存在 → 404，状态切换不会
        发生（见 M16-CONTRACTS.md §1.3.2）
      responses:
        '200':
          description: 回滚成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersionResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
