    post:
      tags:
      - web-source
      summary: 登记网页地址并立即抓取入库
      description: 'M12-CONTRACTS.md §3.4：同步执行首次抓取，响应行携带抓取结果（last_fetch_status）；
        抓取失败不回滚登记（FAILED + last_error 落在行上）。同库同 URL（规范化后）重复登记返回
        INVALID_PARAM；非 http/https、内网/回环地址被 SSRF 防线拒绝（重定向逐跳复验）。抓取产物走
        文档上传管线：同名加版本、content_hash 去重。其他租户的 kbId 读作不存在 → 404（不是 403，
        见 M16-CONTRACTS.md §1.3.2）。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  maxLength: 2048
                sync_enabled:
                  type: boolean
                  default: true
                  description: 缺省开启定时同步
                render_js:
                  type: boolean
                  default: false
                  description: 'M17-CONTRACTS.md §3.3：置 true 时该源抓取走无头浏览器渲染 JS 后取 DOM 入库，缺省 false 静态抓取。开启需镜像内置 Chromium 且渲染总闸开。'
      responses:
        '200':
          description: 登记行（含首次抓取结果）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSourceResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
      - web-source
      summary: 网页登记列表（按登记时间倒序分页）
      description: '只返回调用者所属租户的登记：登记表本身不带租户列，先解析 kbId 归属的知识库，
        其他租户的 kbId 读作不存在 → 404（见 M16-CONTRACTS.md §1.3.2）。'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSourceListResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/web-sources/{sourceId}/sync:
    parameters:
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - web-source
      summary: 手动触发一次同步
      description: 'M12-CONTRACTS.md §3.4：抓取结果不以请求错误形式暴露——响应永远 200，四态结果
        （SUCCESS/UNCHANGED/SKIPPED/FAILED）落在行的 last_fetch_status/last_error 上，与定时
        同步记录方式一致。绑定文档被彻底删除后，下次同步用存储的文件名重新建档并重新绑定。
        其他租户的 sourceId 读作不存在 → 404，抓取不会被触发（见 M16-CONTRACTS.md §1.3.2）。'
      responses:
        '200':
          description: 同步后的登记行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSourceResult'
        '404':
          $ref: '#/components/responses/NotFound'
