      description: '仅更新展示字段 name 与 description：不触碰索引配置与指纹，不会使任何文档
        变为 config_stale。新名称与其他知识库重名时拒绝（INVALID_PARAM），仅改描述不改名不受此限。 '
      requestBody:
        required: true
        content:
