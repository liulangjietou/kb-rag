        messages:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MemoryChatMessage'
          description: 待抽取的对话消息列表
        custom_content:
          type: string
          maxLength: 4000
          nullable: true
          description: 直接写入的自定义记忆内容，不走 LLM 抽取
        fragment_rule_id:
          type: string
          nullable: true
          description: 指定片段规则，缺省使用库内预置的默认规则
        profile_rule_id:
          type: string
          nullable: true
          description: 同时抽取用户画像时传入画像规则 ID
        meta_data:
          type: object
          nullable: true
          additionalProperties: true
          description: 附到本次产生的每条记忆上的自定义元数据
