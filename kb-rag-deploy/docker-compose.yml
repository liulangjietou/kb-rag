# kb-rag 完整模式（full）中间件编排
#
# 在 lite（mysql + elasticsearch + minio）基础上叠加：
#   - milvus-standalone v2.4.x（自带 etcd + 专属 milvus-minio，与应用 MinIO 完全隔离，不复用）
#   - redis:7（可选，标注 optional：仅用于多实例部署下的 Query 改写缓存 / 限流计数 / 任务互斥锁；
#     单实例部署默认 cache.provider=local，Redis 缺失不影响功能正确性，见需求文档 §5 Redis 职责边界）
#
# 通过 Compose `include` 复用 docker-compose.lite.yml，避免 mysql/es/minio 两处维护、配置漂移。
#
# 用法：
#   cp .env.example .env
#   docker compose -f docker-compose.yml up -d                       # 不含 redis
#   docker compose -f docker-compose.yml --profile redis up -d       # 含 redis
#
# 资源要求：建议 24GB 内存（需求文档 §5 资源要求矩阵：中间件约 12GB + kb-parser 8GB）。

name: kb-rag-full

include:
  - docker-compose.lite.yml

services:
  # ------------------------------------------------------------------
  # Milvus 依赖：独立 etcd（元数据）
  # ------------------------------------------------------------------
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: kb-rag-milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - kb_rag_milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - kb-rag-net

  # ------------------------------------------------------------------
  # Milvus 依赖：专属 MinIO（对象存储向量分段数据），与应用侧 kb-rag-minio 相互独立，
  # 严禁复用同一个 MinIO 实例/bucket（见 M1-CONTRACTS.md §8 提醒）
  # ------------------------------------------------------------------
  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: kb-rag-milvus-minio
    restart: unless-stopped
    environment:
      # 默认值仅为占位口令，供 `docker compose config` 免 .env 校验语法；preflight.sh 统一拦截默认口令
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY:-milvusadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_KEY:-CHANGE_ME_milvus_minio_secret_key}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - kb_rag_milvus_minio_data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - kb-rag-net

  # ------------------------------------------------------------------
  # Milvus 单机版
  # ------------------------------------------------------------------
  milvus-standalone:
    image: milvusdb/milvus:v2.4.15
    container_name: kb-rag-milvus-standalone
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:-milvusadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY:-CHANGE_ME_milvus_minio_secret_key}
      COMMON_STORAGETYPE: minio
    volumes:
      - kb_rag_milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    networks:
      - kb-rag-net

  # ------------------------------------------------------------------
  # Redis（可选）：默认不随 `docker compose up` 启动，需显式加 --profile redis。
  # 单实例部署无需 Redis（cache.provider=local，Caffeine+Guava+JVM 锁降级实现）。
  # 固定 7.2.x：该系列仍为 BSD-3-Clause 许可，避免 Redis 7.4+/8.x 切换到 RSALv2/SSPLv2
  # 双许可后对 Apache-2.0 开源分发引入的许可证复杂度。
  # ------------------------------------------------------------------
  redis:
    image: redis:7.2.5-alpine
    container_name: kb-rag-redis
    restart: unless-stopped
    profiles:
      - redis
      - optional
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - kb_rag_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - kb-rag-net

volumes:
  kb_rag_milvus_etcd_data:
    name: kb_rag_milvus_etcd_data
  kb_rag_milvus_minio_data:
    name: kb_rag_milvus_minio_data
  kb_rag_milvus_data:
    name: kb_rag_milvus_data
  kb_rag_redis_data:
    name: kb_rag_redis_data

networks:
  kb-rag-net:
    name: kb-rag-net
    driver: bridge
