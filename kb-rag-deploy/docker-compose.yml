# kb-rag 完整模式（full）中间件编排
#
# 在 lite（mysql + elasticsearch + minio）基础上叠加：
#   - qdrant v1.18.x（单容器自带存储，无需额外的元数据服务或对象存储）
#   - redis:7（可选，标注 optional：多实例部署下承载控制台会话，以及规划中的 Query 改写缓存 /
#     限流计数 / 任务互斥锁；单实例部署默认 KB_CACHE_PROVIDER=local，会话改写进 MySQL，
#     Redis 缺失不影响功能正确性，见需求文档 §5 Redis 职责边界）
#
# 通过 Compose `include` 复用 docker-compose.lite.yml，避免 mysql/es/minio 两处维护、配置漂移。
#
# 用法：
#   cp .env.example .env
#   docker compose -f docker-compose.yml up -d                       # 不含 redis
#   docker compose -f docker-compose.yml --profile redis up -d       # 含 redis
#
# 资源要求：建议 16GB 内存（需求文档 §5 资源要求矩阵：中间件约 4GB + kb-parser 8GB）。

name: kb-rag-full

include:
  - docker-compose.lite.yml

services:
  # ------------------------------------------------------------------
  # Qdrant 单机版：向量检索引擎（full 模式）
  #
  # 单进程自带存储，不需要额外的元数据服务或对象存储，full 模式因此只比 lite 多这一个容器。
  #
  # 数据落在 kb_rag_qdrant_data 卷的 /qdrant/storage 下，容器重建不丢数据。
  # QDRANT_API_KEY 必填：Qdrant 只要收到 QDRANT__SERVICE__API_KEY 这个变量就开启鉴权，
  # 留空传下去等于"鉴权已开但密钥为空"，任何请求都会 401（/healthz 例外，所以容器仍显示 healthy）。
  # 设好后应用侧与 curl 都需带 api-key 头。
  # ------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: kb-rag-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-CHANGE_ME_qdrant_api_key}
    volumes:
      - kb_rag_qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      # 镜像内没有 curl/wget，用 bash 的 /dev/tcp 直接发一个 HTTP 请求探活
      test: ["CMD", "bash", "-c",
             "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      start_period: 20s
      timeout: 10s
      retries: 3
    networks:
      - kb-rag-net

  # ------------------------------------------------------------------
  # Redis（可选）：默认不随 `docker compose up` 启动，需显式加 --profile redis。
  # 单实例部署无需 Redis（KB_CACHE_PROVIDER=local：控制台会话落 MySQL，其余降级为
  # Caffeine+Guava+JVM 锁的进程内实现）。启用后记得同时把 KB_CACHE_PROVIDER 设为 redis，
  # 否则容器起来了也没有消费者。
  # 固定 7.2.x：该系列仍为 BSD-3-Clause 许可，避免 Redis 7.4+/8.x 切换到 RSALv2/SSPLv2
  # 双许可后对 Apache-2.0 开源分发引入的许可证复杂度。
  # ------------------------------------------------------------------
  redis:
    image: redis:7.2.5-alpine
    container_name: kb-rag-redis
    restart: unless-stopped
    profiles:
      - redis
      - optional
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - kb_rag_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - kb-rag-net

volumes:
  kb_rag_qdrant_data:
    name: kb_rag_qdrant_data
  kb_rag_redis_data:
    name: kb_rag_redis_data

networks:
  kb-rag-net:
    name: kb-rag-net
    driver: bridge
