                status:
                  $ref: '#/components/schemas/ComponentHealth'
            elasticsearch:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/ComponentHealth'
            minio:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/ComponentHealth'
            milvus:
              type: object
