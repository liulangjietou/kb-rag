      description: 'M7-CONTRACTS.md §0.3/§0.6：开启后可触发实体关系抽取；graph_enabled 与
        fusion_mode=weighted 互斥（开启图路的库库内融合强制 RRF），违规返回 INVALID_PARAM。
        关闭开关不删除图数据。'
