openapi: 3.0.3
info:
  title: kb-rag-server API
  description: 'kb-rag 管理台内部 API（M1 基线 + M2–M8 增量）。


    本文件按 docs/M1-CONTRACTS.md §5、docs/M2-CONTRACTS.md §1.5/§3/§4/§6 与

    docs/M3-CONTRACTS.md §3 定型的端点与 DTO 编写，用于 kb-rag-server / kb-rag-web

    之间的接口契约测试与前端 mock。

    M2 增量：search 新入参（改写/融合/重排/阈值/metadata_filter）与出参（applied、

    各路归一化分）、ik 词典 CRUD、知识库索引配置更新与按新配置重建。ik 词典热更新

    通道 `GET /internal/dict/ik/{ext|stop}.txt`（见 M2-CONTRACTS.md §3）面向 ES ik

    插件而非管理台前端，免鉴权、纯文本响应，不纳入本文件的管理台 API 契约。

    M3 增量：model-status 新增 vision_* 三字段；解析预览与确认（PENDING_CONFIRM 状态、

    单个/批量确认、改规则重解析）；聊天记录导入（匹配预览 + 确认执行）；告警 Webhook

    配置与测试；Demo 一键导入与状态查询；IndexConfig 新增 clean_rules/parse_preview_required/

    chat_aggregation。kb-parser 侧 VLM 调用与图片/清洗均在 kb-rag-server 完成，parser 不

    调用任何大模型（docs/M3-CONTRACTS.md §0/§1）。

    M4a 增量：文档版本列表与激活影响预检（`GET .../versions`、`GET .../activate-impact`、
    `POST .../activate`）、跨版本待复核标注清单、分片标注四操作（编辑/启禁用/合并/拆分）。

    M4b 增量（docs/M4b-CONTRACTS.md）：评测体系全链路——评测集与 case 的增删改查、
    证据复核工作台（`stale-cases`/`recheck`）、Demo 示例评测集导入（`import-demo`）、
    检索调试页一键收进评测集（`cases/from-retrieval`）与检索结果反馈标注
    （`retrieval-feedback`）、评测运行配置矩阵与费用预估（`runs`/`runs/estimate`）、
    run 详情/命中明细下钻/多 run 对比（`eval-runs/{runId}`、`.../results`、
    `eval-runs/compare`）；`ActivateImpact.affected_eval_case_count` 由恒 0 占位改为
    真实统计。对外 API Key 网关（应用发布渠道）属于 M4c 范畴，不在本文件中。
    M4c 增量（docs/M4c-CONTRACTS.md）：应用中心全链路——应用 CRUD（`/api/v1/apps`）、版本创建/
    列表/详情、门禁评测集绑定（`gate-dataset`）、提交测试（`submit-test`）、发布门禁与强制发布
    （`release?force`）、回滚（`rollback`）；控制台内 chat 预览（`chat-preview`，复用对外 chat
    编排，支持 SSE，事件契约与对外 `/api/v1/knowledge/chat` 一致）；对外开放 API（`/api/v1/
    knowledge/search`、`/api/v1/knowledge/chat`，API Key 鉴权，独立鉴权/限流过滤器链，
    securityScheme 见 `ApiKeyBearer`，与管理鉴权 `bearerAuth` 相互独立）；API Key 管理（创建/
    列表/启禁用/授权范围/轮换/删除，`/api/v1/api-keys`）；调用审计查询与统计（`/api/v1/
    api-audit-logs`、`.../stats`）。八状态发布状态机 `AppVersionStatus`、三态门禁结论
    `GateVerdict` 与其分类原因 `GateReason` 详见对应 schema。
    M5 增量（docs/M5-CONTRACTS.md）：多知识库路由——应用版本配置的 `kb_id` 单库字段废弃为兼容
    可选项，新增 `kb_refs`（1..15 个知识库+配额权重）与 `routing`（LLM 选库开关+自定义 Prompt，
    输出与候选白名单求交集，空交集/解析失败/超时/未配置模型一律降级检索全部关联库并记
    `route_fallback_all`）；跨库检索按库内排名做 Reciprocal Rank Fusion 合并，rerank 候选总
    预算按 `kb_refs` 权重比例分配（向下取整，余量归权重最高库）；`AppliedInfo`/
    `AppliedSearchParams` 新增 `routed_kb_ids`（本次实际检索的库），`KnowledgeChatResponse`
    顶层新增 `routed_kb_ids`，SSE `done` 事件同增；`RetrievalNode.metadata` 新增 `kb_id`
    （全量填充，来自事实源行）；门禁评测集绑定放宽为「所属知识库属于版本 kb_refs 并集」。
    旧版仅存单 `kb_id` 的快照读侧兼容翻译为等价单元素 `kb_refs`，永不需要迁移。
    M6 增量（docs/M6-CONTRACTS.md）：索引快照发布——门禁通过/force 之后、状态切 RELEASED 之前，
    对关联知识库物理索引建不可变快照并固化当时的版本可见集，写入 `AppVersion.index_snapshots`
    （每库每引擎一条，物理索引名直存不重算）与 `visible_version_kb_count`（按库汇总的文档版本数，
    只给数量不给 id 列表）；经 RELEASED 版本（含 rollback 重新发布的历史版本）发起的对外
    search/chat 固定检索这份快照与固化可见集，TESTING 灰度/chat-preview/管理台调试/评测仍走实时
    别名与当前激活集合；快照索引被误删时降级为实时别名并记 `degraded=snapshot_index_missing`
    （M6 之前发布、本就没有快照的旧 RELEASED 版本走同样路径但不记该标记，是历史数据形态而非故障）；
    `DocumentVersionResponse` 新增 `pinned`/`pinned_by`，被任意未清理应用版本（含 SUPERSEDED）
    的固化可见集引用即 pin，归档保留清理跳过之。同 PR 补 M5 遗漏的 `route_fallback_all` 枚举值。

    M7 增量（docs/M7-CONTRACTS.md）：GraphRAG 图检索路——知识库图配置
    （`GET/PUT /api/v1/kb/{kbId}/graph/config`，graph_enabled 开关）、全量实体关系抽取
    （`POST .../graph/extract`，先清空再对激活版本启用分片逐片 LLM 抽取）、图谱概览/实体列表/
    实体关联分片下钻（`.../graph/summary`、`.../graph/entities`、
    `.../graph/entities/{entityName}/chunks`）；检索三路混排接入图路，query 侧实体匹配为
    「query 轻量切分 + Neo4j 实体名 fulltext（cjk 分析器）」，不做 query 级 LLM 抽取；
    `degraded` 枚举补 `graph_route_unavailable`；正式版（索引快照上下文）调用图路直接关闭且
    不记降级（图数据无快照副本，属能力边界）；Neo4j 以 compose profile=graph 可选启用，
    `NEO4J_URI` 留空即整体禁用图能力且其余功能零影响。

    M8 增量（docs/M8-CONTRACTS.md）：导入与解析增强——导入映射档案维护
    （`GET/POST /api/v1/source-mappings`、`PUT/DELETE /api/v1/source-mappings/{mappingId}`、
    `POST .../{mappingId}/copy`，t_kb_source_mapping 落库，内置模板启动种子化、不可改删可复制）；
    聊天导入 `mapping_profile` 入参改为传映射档案业务 id 或内置名（兼容旧值），格式范围扩
    TXT/HTML（parser 侧新增行模板/DOM 选择器适配器，profile_yaml 全文随请求传给 parser）；
    聊天聚合新增 `window_overlap` 重叠滑窗参数（默认 0=既有顺切，约束 overlap×2 < max_messages），
    聊天 chunk metadata 增 `window_seq`/`msg_span`；检索侧近重复归并——同会话 `msg_span`
    重叠率 ≥ 0.5 的命中只保留排名最高者，被并者记入存活者 metadata
    `merged_window_chunk_ids`（≤5）。PaddleOCR 本地 OCR 兜底属 kb-parser 侧（见 kb-parser.yaml），
    server 对带 `ocr_source` 标记的页不再调 VLM。

    '
  version: 0.9.0-m8
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://127.0.0.1:20000
  description: 本地开发（kb-rag-server 默认端口，见契约 §0）
tags:
- name: auth
  description: 登录、改密、当前用户
- name: knowledge-base
  description: 知识库管理
- name: document
  description: 文档上传、状态查询、分片查看、重建索引
- name: search
  description: 检索调试
- name: dict
  description: ik 中文分词自定义词典管理（M2）
- name: parse-preview
  description: 解析预览与确认（M3，docs/M3-CONTRACTS.md §3.4）
- name: chat-import
  description: 聊天记录导入（M3，docs/M3-CONTRACTS.md §3.5）
- name: alert
  description: 告警 Webhook 配置（M3，docs/M3-CONTRACTS.md §3.6）
- name: demo
  description: Demo 一键导入（M3，docs/M3-CONTRACTS.md §3.7）
- name: eval
  description: 评测体系：评测集/case/证据复核/评测运行与报告（M4b，docs/M4b-CONTRACTS.md）
- name: app-center
  description: 应用中心：应用/版本/发布门禁与控制台 chat 预览（M4c，docs/M4c-CONTRACTS.md §2）
- name: api-key
  description: API Key 管理（M4c，docs/M4c-CONTRACTS.md §3）
- name: api-audit
  description: 对外调用审计查询与统计（M4c，docs/M4c-CONTRACTS.md §3）
- name: open-api
  description: 对外开放 API：search/chat，独立 API Key 鉴权/限流过滤器链（M4c，docs/M4c-CONTRACTS.md
    §3）
- name: system
  description: 系统状态与健康检查
security:
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: 管理员登录
      description: 登录失败记入 t_kb_login_audit；连续失败 5 次锁定 15 分钟。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidParam'
  /api/v1/auth/change-password:
    post:
      tags:
      - auth
      summary: 修改密码（含首登强制改密场景）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: 获取当前登录用户信息
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/source-mappings:
    get:
      tags: [source-mapping]
      summary: 导入映射列表（内置在前，组内按名称升序）
      parameters:
      - name: source_type
        in: query
        schema: {type: string, enum: [csv, xlsx, txt, html]}
      responses:
        '200':
          description: 裸数组（内置+自定义总量小，不分页）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceMapping'
    post:
      tags: [source-mapping]
      summary: 新建自定义映射
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceMappingRequest'
      responses:
        '200':
          description: 新建行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceMapping'
  /api/v1/source-mappings/{mappingId}:
    parameters:
    - name: mappingId
      in: path
      required: true
      schema: {type: string}
    put:
      tags: [source-mapping]
      summary: 全量替换自定义映射（内置行返回 INVALID_PARAM）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceMappingRequest'
      responses:
        '200':
          description: 更新后的行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceMapping'
    delete:
      tags: [source-mapping]
      summary: 删除自定义映射（内置行返回 INVALID_PARAM）
      responses:
        '200':
          description: 已删除
  /api/v1/source-mappings/{mappingId}/copy:
    parameters:
    - name: mappingId
      in: path
      required: true
      schema: {type: string}
    post:
      tags: [source-mapping]
      summary: 复制为自定义映射
      description: body 可省略；name 缺省生成「副本-原名」，已占用则追加序号。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
      responses:
        '200':
          description: 复制出的自定义行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceMapping'
  /api/v1/kb:
    post:
      tags:
      - knowledge-base
      summary: 创建知识库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKbRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
    get:
      tags:
      - knowledge-base
      summary: 知识库列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseListResult'
  /api/v1/kb/{kbId}:
    parameters:
    - $ref: '#/components/parameters/KbId'
    get:
      tags:
      - knowledge-base
      summary: 知识库详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseResult'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - knowledge-base
      summary: 删除知识库
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kb/{kbId}/index-config:
    parameters:
    - $ref: '#/components/parameters/KbId'
    put:
      tags:
      - knowledge-base
      summary: 更新知识库索引配置（分片参数/父子分片）
      description: 'M2-CONTRACTS.md §4：更新后重算 current_config_fingerprint，并对该知识库下

        活跃版本 chunk_fingerprint 不等于新指纹的文档置 config_stale=1（web 侧据此

        展示“N 篇文档使用旧配置”提示 + 重建入口）。仅更新配置元数据，**不会**立即

        触发重建，重建需显式调用 `POST /api/v1/kb/{kbId}/rebuild`。

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexConfig'
      responses:
        '200':
          description: 更新成功，返回最新知识库信息（含新指纹与索引配置）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kb/{kbId}/rebuild:
    parameters:
    - $ref: '#/components/parameters/KbId'
    post:
      tags:
      - knowledge-base
      summary: 按当前索引配置重建文档索引
      description: 'M2-CONTRACTS.md §4：body 可选 `doc_ids`，缺省时重建该知识库下全部

        config_stale=1 的文档。每篇文档一个 REBUILD 任务：从 MinIO 解析产物

        重切/重嵌入，同一物理索引内原子替换该版本 chunk（先写新 chunk 再删旧，

        引擎双写走既有同步机制），完成后置 config_stale=0。异步受理，幂等。

        '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildRequest'
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kb/{kbId}/documents:
    parameters:
    - $ref: '#/components/parameters/KbId'
    post:
      tags:
      - document
      summary: 上传文档（异步进入索引管线）
      description: 'multipart 上传；服务端校验扩展名 + magic number + 文件大小（≤100MB）。

        校验通过后立即返回，文档以 UPLOADED 状态异步进入解析/切分/索引管线。

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 已接收，进入异步处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
      - document
      summary: 文档列表
      parameters:
      - name: process_status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ProcessStatus'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResult'
  /api/v1/kb/{kbId}/documents/confirm:
    parameters:
    - $ref: '#/components/parameters/KbId'
    post:
      tags:
      - parse-preview
      summary: 批量确认解析预览
      description: 'M3-CONTRACTS.md §3.4：body 可选 `doc_ids`，缺省时确认该知识库下全部 PENDING_CONFIRM
        状态的文档。仅在知识库开启 `index_config.parse_preview_required` 时有意义；确认后各文档继续切分入库。 '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDocumentsRequest'
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{docId}/reindex:
    parameters:
    - $ref: '#/components/parameters/DocId'
    post:
      tags:
      - document
      summary: 重建索引
      description: 幂等：按当前激活版本重建先删旧 chunk 再重建，失败可重试。
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{docId}/chunks:
    parameters:
    - $ref: '#/components/parameters/DocId'
    get:
      tags:
      - document
      summary: 分片列表
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkListResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{docId}/preview:
    parameters:
    - $ref: '#/components/parameters/DocId'
    get:
      tags:
      - parse-preview
      summary: 查看解析预览
      description: 'M3-CONTRACTS.md §3.4：仅当文档 `process_status=PENDING_CONFIRM` （知识库开启
        `index_config.parse_preview_required` 时，清洗完成后管线暂停于此状态） 时有实际预览产物；预览内容（markdown、按页信息、图片预签名
        URL 与 VLM 文本代理、 warnings）读自 MinIO 预览产物。 '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPreviewResult'
        '404':
          $ref: '#/components/responses/NotFound'
