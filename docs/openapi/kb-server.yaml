          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kb/{kbId}/graph/config:
    parameters:
    - $ref: '#/components/parameters/KbId'
    put:
      tags: [graph]
