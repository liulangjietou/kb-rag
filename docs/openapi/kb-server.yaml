        chat_provider:
          type: string
          nullable: true
        chat_model:
          type: string
          nullable: true
        vision_configured:
          type: boolean
          description: M3-CONTRACTS.md §3.1：VisionProvider（DashScope qwen-vl-max）是否已配置
        vision_provider:
          type: string
          nullable: true
        vision_model:
          type: string
          nullable: true
    ModelStatusResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/ModelStatus'
    ChatImportAction:
      type: string
      description: 'M3-CONTRACTS.md §3.5：逻辑文档标识 = 来源渠道 + session_id。CREATE=库内无匹配，
        建新文档；NEW_VERSION=已存在同一 session_id 的聊天文档，生成新版本（全量替换，走 M1 版本机制）。 '
      enum:
      - CREATE
      - NEW_VERSION
    TimeRange:
      type: object
      description: epoch 毫秒时间范围（该会话内消息 send_time 的最小/最大值）
      properties:
        from:
          type: integer
          format: int64
          nullable: true
        to:
          type: integer
          format: int64
          nullable: true
    ChatImportSession:
      type: object
      description: M3-CONTRACTS.md §3.5：聊天记录导入匹配预览的单个会话条目
      properties:
        session_id:
          type: string
        session_name:
          type: string
        message_count:
          type: integer
        time_range:
          $ref: '#/components/schemas/TimeRange'
        matched_doc_id:
          type: string
          nullable: true
          description: 库内已存在同一 session_id 的聊天文档 doc_id；无匹配为 null
        action:
          $ref: '#/components/schemas/ChatImportAction'
    ChatImportPreviewData:
      type: object
      properties:
