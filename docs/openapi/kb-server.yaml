              properties:
                status:
                  $ref: '#/components/schemas/ComponentHealth'
    DocumentVersion:
      type: object
      properties:
        version_id:
          type: string
        version:
          type: string
          example: '2.0'
        status:
          type: string
          enum:
          - BUILDING
          - BUILD_FAILED
          - READY
          - ACTIVE
          - ARCHIVED
        content_hash:
          type: string
        chunk_count:
          type: integer
        active:
          type: boolean
        rollback_mode:
          type: string
          enum:
          - INSTANT
          - REBUILD
          description: INSTANT when the target version still owns its chunks, REBUILD
