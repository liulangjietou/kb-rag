          minimum: 1
        degrade_rate_threshold:
          type: number
          format: float
          default: 0.3
          minimum: 0
          maximum: 1
        sync_backlog_threshold:
          type: integer
          default: 1000
          minimum: 1
        silence_minutes:
          type: integer
          default: 30
          minimum: 0
    AlertConfigResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
