        stale_annotation_count:
          type: integer
        affected_eval_case_count:
          type: integer
          description: always 0 until M4b introduces evaluation sets
    ActivateVersionResult:
      type: object
      properties:
        task_id:
          type: string
          nullable: true
          description: null for an INSTANT switch, rebuild task id otherwise
        rollback_mode:
          type: string
          enum:
          - INSTANT
          - REBUILD
    Annotation:
