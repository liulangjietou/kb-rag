      - api-key
      summary: 启用/禁用 Key
      description: 同时清空该 Key 的限流令牌桶，避免误操作后重新启用仍带着被节流的桶
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyStatusRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/api-keys/{keyId}/scope:
    parameters:
    - $ref: '#/components/parameters/ApiKeyId'
    put:
      tags:
      - api-key
      summary: 替换授权范围
      description: app_scope 为空列表授权全部应用；条目须为存在的 app_id，否则 400
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyScopeRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/api-keys/{keyId}/rotate:
    parameters:
    - $ref: '#/components/parameters/ApiKeyId'
    post:
      tags:
      - api-key
      summary: 轮换密钥
      description: 旧密钥立即失效（摘要被覆盖，无宽限期），同时清空该 Key 的限流令牌桶；新明文仅本次响应返回
      responses:
        '200':
          description: 轮换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/api-keys/{keyId}:
    parameters:
    - $ref: '#/components/parameters/ApiKeyId'
    delete:
      tags:
      - api-key
      summary: 删除 Key
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/api-audit-logs:
    get:
      tags:
      - api-audit
      summary: 审计日志分页查询
      description: 按调用时间倒序；未传过滤字段时返回全部
      parameters:
      - name: key_id
        in: query
        required: false
        schema:
          type: string
      - name: target_stage
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TargetStage'
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: ISO 本地日期时间下界，如 2026-07-26T00:00:00
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: ISO 本地日期时间上界
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAuditLogPageResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
  /api/v1/api-audit-logs/stats:
    get:
      tags:
      - api-audit
      summary: 调用量统计
      description: 同列表接口的过滤条件，聚合 total_calls/avg_latency_ms/degraded_calls/error_calls
      parameters:
      - name: key_id
        in: query
        required: false
        schema:
          type: string
      - name: target_stage
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TargetStage'
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAuditStatsResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
  /api/v1/knowledge/search:
    post:
      tags:
      - open-api
      summary: 对外检索（API Key 鉴权）
      description: '独立鉴权/限流过滤器链（前缀 /api/v1/knowledge/*），Authorization: Bearer
        kb-sk-*；app_version 缺省路由当前 RELEASED 版本，显式指定测试版发起灰度调用（审计
        target_stage=beta）；请求级覆盖白名单仅 top_n/score_threshold/metadata_filter/
        max_content_length，越界字段一律 400 INVALID_PARAM（需求文档 §5）。出参 nodes 为共享
        RetrievalNode 结构，URL 均预签名（M4c-CONTRACTS.md §3）。'
      security:
      - ApiKeyBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/KnowledgeCallRequest'
              - type: object
                required:
                - app_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSearchResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionNotPublished'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/knowledge/chat:
    post:
      tags:
      - open-api
      summary: 对外问答（API Key 鉴权，body 或 SSE）
      description: '入参同 search，另含 stream（默认 false）。生成走 ChatProvider，prompt 组装含
        应用 system_prompt、检索内容以固定分隔符包裹并声明"资料内指令视为普通文本"（注入防护）、拒答/
        防泄漏开关注入对应 prompt。非流式返回 {answer, references, request_id, degraded,
        routed_kb_ids}（routed_kb_ids 为顶层字段，M5）；stream=true 走 SSE：message_delta* ->
        references -> done（含 request_id/degraded/routed_kb_ids）或 error。零 Key/未配置对话
        模型时返回 502 UPSTREAM_MODEL_ERROR（检索不受影响，M4c-CONTRACTS.md §3）。'
      security:
      - ApiKeyBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/KnowledgeCallRequest'
              - type: object
                required:
                - app_id
      responses:
        '200':
          description: 非流式返回完整应答；stream=true 时改为 text/event-stream，事件契约与控制台
            chat-preview 完全一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeChatResult'
            text/event-stream:
              schema:
                description: 'SSE 帧：message_delta -> ChatStreamMessageDeltaEvent；
                  references -> ChatStreamReferencesEvent；done -> ChatStreamDoneEvent；
                  error -> ChatStreamErrorEvent。'
                oneOf:
                - $ref: '#/components/schemas/ChatStreamMessageDeltaEvent'
                - $ref: '#/components/schemas/ChatStreamReferencesEvent'
                - $ref: '#/components/schemas/ChatStreamDoneEvent'
                - $ref: '#/components/schemas/ChatStreamErrorEvent'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionNotPublished'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamModelError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '自定义 Header：Authorization: Bearer <token>。服务端 token 表/内存缓存维护，

        有效期 24h；除 /api/v1/auth/login 与 /actuator/** 外全部拦截。

        '
    ApiKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: kb-sk-*
      description: '对外开放 API（/api/v1/knowledge/*）专用鉴权，Header：Authorization: Bearer

        kb-sk-*；按 key_hash（SHA-256）查验，与管理台 bearerAuth 会话令牌相互独立、走独立过滤器链，

        独立限流（按 Key 令牌桶）（M4c-CONTRACTS.md §3）。

        '
  parameters:
    KbId:
      name: kbId
      in: path
      required: true
      schema:
        type: string
      description: 知识库业务主键（kb_id）
    DocId:
      name: docId
      in: path
      required: true
      schema:
        type: string
      description: 文档业务主键（doc_id）
    DictId:
      name: dictId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: ik 词典条目主键（t_kb_ik_dict.id，无独立业务字符串 ID，仅此表通用列 id 即主键）
    EvalDatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
      description: 评测集业务主键（dataset_id，M4b）
    EvalCaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
      description: 评测 case 业务主键（case_id，M4b）
    EvalRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
      description: 评测运行业务主键（run_id，M4b）
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
      description: 应用业务主键（app_id，M4c）
    AppVersionId:
      name: appVersionId
      in: path
      required: true
      schema:
        type: string
      description: 应用版本业务主键（app_version_id，M4c）
    ApiKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
      description: API Key 业务主键（key_id，M4c）
  responses:
    InvalidParam:
      description: 参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录或 token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamModelError:
      description: 上游模型 Provider 调用失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidApiKey:
      description: API Key 缺失/格式不正确/未匹配到任何存量哈希（INVALID_API_KEY），或存在但已被
        禁用（API_KEY_DISABLED），M4c
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: API Key 有效但其授权范围不包含所请求的应用（APP_ACCESS_DENIED），M4c
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VersionNotPublished:
      description: 应用版本存在但未处于可调用状态（VERSION_NOT_PUBLISHED），M4c
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 超出该 API Key 的 QPS 配额（RATE_LIMITED），响应头带 Retry-After 建议重试秒数，M4c
      headers:
        Retry-After:
          schema:
            type: integer
          description: 建议重试等待秒数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorCode:
      type: string
      description: M1 错误码子集 + M4c 对外开放 API 新增错误码，HTTP 状态码见括注
      enum:
      - INVALID_PARAM
      - UNAUTHORIZED
      - NOT_FOUND
      - INVALID_API_KEY
      - API_KEY_DISABLED
      - APP_ACCESS_DENIED
      - APP_NOT_FOUND
      - VERSION_NOT_FOUND
      - VERSION_NOT_PUBLISHED
      - RATE_LIMITED
      - PARSE_FAILED
      - UPSTREAM_MODEL_ERROR
      - INTERNAL_ERROR
    ErrorResponse:
      type: object
      description: 统一错误响应
      required:
      - code
      - message
      - request_id
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          example: 'invalid parameter: name is required'
        request_id:
          type: string
          description: 全链路透传的请求 ID，经 X-Request-Id Header 贯穿 kb-server/kb-parser/模型
            Provider 日志
          example: req-3f6a2e1c
    ResultEnvelope:
      type: object
      description: 统一成功响应外壳，具体业务负载见各接口 data 字段的组合 schema
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
          example: success
        request_id:
          type: string
    EmptyResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            nullable: true
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginData:
      type: object
      properties:
        token:
          type: string
        must_change_password:
          type: boolean
    LoginResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/LoginData'
    ChangePasswordRequest:
      type: object
      required:
      - old_password
      - new_password
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    UserInfo:
      type: object
      properties:
        username:
          type: string
        must_change_password:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
    UserInfoResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/UserInfo'
    CreateKbRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
    SourceMapping:
      type: object
      description: 'M8 导入映射行（t_kb_source_mapping）：聊天导入解析档案，profile_yaml 为完整 YAML（csv/xlsx
        列名映射；txt.patterns 行模板正则含命名组 send_time/sender；html 选择器 message/sender/time/content）。
        内置行不可改删、可复制；schema 属主为 kb-rag-parser，server 不复刻结构校验（M8-CONTRACTS.md §5）。'
      properties:
        mapping_id: {type: string}
        name: {type: string}
        source_type: {type: string, enum: [csv, xlsx, txt, html]}
        profile_yaml: {type: string}
        is_builtin: {type: boolean}
        created_at: {type: string}
        updated_at: {type: string}
    SourceMappingRequest:
      type: object
      required: [name, source_type, profile_yaml]
      properties:
        name: {type: string}
        source_type: {type: string, enum: [csv, xlsx, txt, html]}
        profile_yaml: {type: string}
    KnowledgeBase:
      type: object
      properties:
        kb_id:
          type: string
        name:
          type: string
        graph_enabled:
          type: boolean
          description: M7 GraphRAG：本库是否开启实体关系抽取与图检索路（M7-CONTRACTS.md §0.3）
        description:
          type: string
          nullable: true
        current_config_fingerprint:
          type: string
          nullable: true
        index_config:
          allOf:
          - $ref: '#/components/schemas/IndexConfig'
          nullable: true
          description: '索引配置（分片参数 + 父子分片，M2 新增可编辑项）；为空表示沿用 M1 固定

            默认值（chunk_max_tokens=600 / chunk_overlap=100，父子分片关闭）。

            '
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KnowledgeBaseResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/KnowledgeBase'
    KnowledgeBaseListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/KnowledgeBase'
    ProcessStatus:
      type: string
      description: 文档处理状态（t_kb_document.process_status）。M3 新增 PENDING_CONFIRM （docs/M3-CONTRACTS.md
        §3.4）：仅当知识库开启 index_config.parse_preview_required 时，清洗完成后管线在此暂停等待人工确认，之后才继续切分入库。
      enum:
      - UPLOADED
      - PARSING
      - PARSE_FAILED
      - PARSED
      - PENDING_CONFIRM
      - INDEXING
      - INDEXED
      - INDEX_FAILED
    Document:
      type: object
      properties:
        doc_id:
          type: string
        kb_id:
          type: string
        file_name:
          type: string
        file_ext:
          type: string
        file_size:
          type: integer
          format: int64
        current_version_id:
          type: string
          nullable: true
        process_status:
          $ref: '#/components/schemas/ProcessStatus'
        config_stale:
          type: boolean
          description: 配置一致性标记，与处理状态正交
        fail_reason:
          type: string
          nullable: true
          maxLength: 1024
    DocumentResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/Document'
    DocumentListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              page:
                type: integer
              total:
                type: integer
    EmbeddingStatus:
      type: string
      enum:
      - PENDING
      - DONE
      - FAILED
      - SKIPPED
    DocumentChunk:
      type: object
      properties:
        chunk_id:
          type: string
        kb_id:
          type: string
        doc_id:
          type: string
        document_version_id:
          type: string
        content:
          type: string
        parent_id:
          type: string
          nullable: true
        seq:
          type: integer
        enabled:
          type: boolean
        embedding_status:
          $ref: '#/components/schemas/EmbeddingStatus'
        metadata:
          type: object
          additionalProperties: true
    ChunkListResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentChunk'
              page:
                type: integer
              total:
                type: integer
    SearchRequest:
      type: object
      description: 'M2-CONTRACTS.md §1.5：管理台调试用扩展入参，全部可选、即时生效（不落库为 KB

        默认值）。固定链路次序见 M2-CONTRACTS.md §1：改写 → 双路召回 → 融合 →

        rerank → 父子归并 → 阈值过滤 → top_n。

        '
      required:
      - query
      properties:
        query:
          type: string
        recall_top_k:
          type: integer
          default: 50
          minimum: 1
        top_n:
          type: integer
          default: 5
          minimum: 1
        score_threshold:
          type: number
          format: float
          minimum: 0.01
          maximum: 1.0
          nullable: true
          default: null
          description: '可空=不过滤。作用于 rerank 分；rerank 关闭或降级时作用于向量标准

            cosine[0,1] 分；BM25 单路时不生效（degraded += threshold_inactive）。

            '
        fusion:
          allOf:
          - $ref: '#/components/schemas/FusionConfig'
          nullable: true
        rerank_enabled:
          type: boolean
          nullable: true
          description: 默认 true（仅当 RERANK_MODEL 已配置生效），显式传 false 可关闭。
        rewrite_enabled:
          type: boolean
          default: false
          description: 默认 false；显式开启却未配置 chat 模型时 degraded += query_rewrite_timeout
            同类降级标注。
        messages:
          type: array
          nullable: true
          description: 多轮对话上下文（OpenAI 兼容 role/content），非空时按此做指代消解改写。
          items:
            $ref: '#/components/schemas/ChatMessage'
        metadata_filter:
          allOf:
          - $ref: '#/components/schemas/MetadataFilter'
          nullable: true
    ChunkType:
      type: string
      enum:
      - text
      - image
      - chat_log
    ScoreType:
      type: string
      description: '分数口径。M1 仅 cosine/bm25_rank 两种原始召回口径；M2 新增 rerank（唯一绝对分）

        与两种融合口径 fused_rrf/fused_weighted（M2-CONTRACTS.md §1.3）。

        '
      enum:
      - rerank
      - cosine
      - bm25_rank
      - fused_rrf
      - fused_weighted
    RetrievalSource:
      type: string
      enum:
      - vector
      - bm25
    DegradedReason:
      type: string
      description: '检索降级原因枚举。M1 仅定义 vector_route_unavailable（零 Key 场景，向量路不可用，

        仅走 BM25 单路）。M2 新增（M2-CONTRACTS.md §1.1/§1.2/§1.3）：

        query_rewrite_timeout（改写超时/失败降级用原 query，或显式开启改写却无模型）、

        rerank_timeout/rerank_error（重排超时或调用失败，降级为融合结果排序）、

        threshold_inactive（score_threshold 在 BM25 单路场景不生效）。

        M5 新增 route_fallback_all（知识库路由白名单未命中/解析失败/超时/未配置模型，降级检索全部

        关联库）。M6 新增 snapshot_index_missing（RELEASED 版本的快照索引已不存在，如被误删，

        回退实时别名与当前激活集合提供结果；M6 之前发布、本就没有快照的旧 RELEASED 版本走同样的

        实时别名路径，但那是历史数据形态而非故障，不记该标记，M6-CONTRACTS.md §0.4/§0.5）。

        '
      enum:
      - vector_route_unavailable
      - query_rewrite_timeout
      - query_rewrite_error
      - query_rewrite_unavailable
      - rerank_timeout
      - rerank_error
      - rerank_unavailable
      - threshold_inactive
      - route_fallback_all
      - snapshot_index_missing
      - graph_route_unavailable
    GraphSummary:
      type: object
      description: M7 图谱概览（GraphSummaryResponse）
      properties:
        graph_enabled: {type: boolean}
        entity_count: {type: integer, format: int64}
        relation_count: {type: integer, format: int64}
        covered_chunk_count: {type: integer, format: int64}
        latest_task:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/GraphTask'
    GraphTask:
      type: object
      description: 最近一次图抽取任务（type 恒为 GRAPH_EXTRACT——图清理挂删除级联不产生任务行，
        M7-CONTRACTS.md §5 偏离①）
      properties:
        task_id: {type: string}
        type: {type: string, enum: [GRAPH_EXTRACT]}
        status: {type: string, enum: [PENDING, RUNNING, SUCCESS, FAILED]}
        progress: {type: integer, nullable: true}
        skipped_chunk_count:
          type: integer
          nullable: true
          description: 因输出强校验（非法 JSON/实体名超长/关系端点不在本次实体列表）被跳过的分片数，
            任务成功时同样返回——"成功但丢了语料"是必须暴露的失败模式
        error_message: {type: string, nullable: true}
        created_at: {type: string}
    GraphEntity:
      type: object
      description: 实体行（GraphEntityResponse），relations 为出边、上限 20 条
      properties:
        name: {type: string}
        type: {type: string}
        source_chunk_count: {type: integer, format: int64}
        relations:
          type: array
          items:
            type: object
            properties:
              target: {type: string}
              type: {type: string}
    GraphEntityChunk:
      type: object
      description: 实体来源分片简化行（GraphEntityChunkResponse）
      properties:
        chunk_id: {type: string}
        doc_id: {type: string}
        doc_file_name: {type: string}
        document_version_id: {type: string}
        document_version_label: {type: string}
        content: {type: string}
        enabled: {type: boolean}
    RetrievalNode:
      type: object
      description: 检索结果节点（契约 §5 定型结构）
      required:
      - doc_id
      - document_version_id
      - chunk_id
      - chunk_type
      - content
      - score
      - score_type
      - retrieval_source
      properties:
        doc_id:
          type: string
        document_version_id:
          type: string
        chunk_id:
          type: string
        chunk_type:
          $ref: '#/components/schemas/ChunkType'
        content:
          type: string
        score:
          type: number
          format: float
          description: 统一映射到标准 cosine [0,1] 后的分数（跨引擎一致，见契约 §4）
        score_type:
          $ref: '#/components/schemas/ScoreType'
        retrieval_source:
          $ref: '#/components/schemas/RetrievalSource'
        metadata:
          type: object
          description: 'M7 图路命中时含 graph_score/graph_hops/graph_entities（≤5 个实体名；未被图路命中时三键不出现）。
        M8 聊天分片含 window_seq 与 msg_span（会话内消息序号闭区间）；近重复归并存活者含 merged_window_chunk_ids（≤5，同会话窗口重叠率≥0.5 只留排名最高）。
        引擎侧固定字段（tag_ids/session_id/sender/msg_time 等，见 M1-CONTRACTS.md

            §6）+ M2 新增各路分数明细（M2-CONTRACTS.md §1.5，父子归并开启时另含

            child_ids，见 §1.4），字段按实际生效链路出现，其余透传引擎原始 metadata。

            '
          properties:
            norm_vector_score:
              type: number
              format: float
              nullable: true
              description: 融合前向量路 min-max 归一化分（weighted 融合时使用）
            norm_bm25_score:
              type: number
              format: float
              nullable: true
              description: 融合前 BM25 路 min-max 归一化分（weighted 融合时使用）
            fused_score:
              type: number
              format: float
              nullable: true
              description: 融合分（RRF 或加权），rerank 关闭/降级时可作为最终分参考
            rerank_score:
              type: number
              format: float
              nullable: true
              description: rerank 归一化分（0-1），rerank 开启且未降级时存在
            child_ids:
              type: array
              nullable: true
              description: 父子分片开启时，归并到该父片的命中子片 chunk_id 列表
              items:
                type: string
            kb_id:
              type: string
              nullable: true
              description: 归属知识库业务 id（M5-CONTRACTS.md §2.2）；来自事实源行，全量填充，
                与本次调用是否经过多库路由无关，单库调用亦填充
          additionalProperties: true
        image_urls:
          type: array
          items:
            type: string
          default: []
        preview_url:
          type: string
          nullable: true
          default: null
    SearchData:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalNode'
        request_id:
          type: string
        degraded:
          type: array
          items:
            $ref: '#/components/schemas/DegradedReason'
          default: []
        applied:
          allOf:
          - $ref: '#/components/schemas/AppliedSearchParams'
          description: M2 新增，供调试页展示本次请求实际生效的参数（M2-CONTRACTS.md §1.5）
    SearchResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/SearchData'
    FusionMode:
      type: string
      description: M2-CONTRACTS.md §1.3
      enum:
      - rrf
      - weighted
    FusionConfig:
      type: object
      description: 'weighted 模式：每路候选集内 min-max 归一化，融合分 = w_vec·norm(vec) +

        w_bm25·norm(bm25)，w_vec + w_bm25 = 1（入参只传 w_vec，w_bm25 由服务端换算）。

        '
      properties:
        mode:
          $ref: '#/components/schemas/FusionMode'
        w_vec:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: 仅 mode=weighted 时生效，默认 0.5
        rrf_k:
          type: integer
          minimum: 1
          default: 60
          description: 仅 mode=rrf 时生效
    ChatMessage:
      type: object
      description: OpenAI 兼容 chat message（用于多轮指代消解改写，见 M2-CONTRACTS.md §1.1）
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          - system
        content:
          type: string
    MetadataFilter:
      type: object
      description: 'M2-CONTRACTS.md §1.5：映射为 ES bool filter / Milvus expr，字段即

        M1-CONTRACTS.md §6 引擎固定字段集（tag_ids/session_id/sender/msg_time）。

        '
      properties:
        tag_ids:
          type: array
          nullable: true
          items:
            type: string
        session_id:
          type: string
          nullable: true
        sender:
          type: string
          nullable: true
        msg_time_from:
          type: string
          format: date-time
          nullable: true
        msg_time_to:
          type: string
          format: date-time
          nullable: true
    AppliedSearchParams:
      type: object
      description: 调试页顶部信息条：本次请求实际生效的改写/融合/阈值作用口径（M2-CONTRACTS.md §1.5）；
        routed_kb_ids 为 M5 新增（该端点仍是单库调试端点，值恒为该单库 id，与多库编排端点的
        AppliedInfo.routed_kb_ids 共用同一字段名，避免同一元数据双路径不一致，M5-CONTRACTS.md
        §6 server 申报偏离①）
      properties:
        rewrite_used_query:
          type: string
          nullable: true
          description: 实际用于检索的 query；未开启改写或降级时等于原始 query
        fusion_mode:
          $ref: '#/components/schemas/FusionMode'
        threshold_applied_on:
          allOf:
          - $ref: '#/components/schemas/ScoreType'
          nullable: true
          description: score_threshold 实际作用的分数口径；未设置阈值或 threshold_inactive 时为 null
        routed_kb_ids:
          type: array
          items:
            type: string
          description: 本次调用实际检索的知识库 id 列表，单库调试端点恒为该单库 id（M5）
    ParentChildConfig:
      type: object
      description: M2-CONTRACTS.md §1.4：父子分片，引擎只索引子片，父片正文只在 MySQL
      properties:
        enabled:
          type: boolean
          default: false
        parent_max_tokens:
          type: integer
          default: 1200
          minimum: 1
        child_max_tokens:
          type: integer
          default: 400
          minimum: 1
        child_overlap:
          type: integer
          default: 50
          minimum: 0
    IndexConfig:
      type: object
      description: '知识库索引配置（t_kb_knowledge_base.index_config JSON）。chunk_max_tokens/

        chunk_overlap 为 M1 既有按长度切分参数（默认 600/100，见 M1-CONTRACTS.md

        索引管线说明），M2 起可通过 `PUT /api/v1/kb/{kbId}/index-config` 编辑；

        parent_child 为 M2 新增二级切分开关；clean_rules/parse_preview_required/

        chat_aggregation 为 M3 新增（docs/M3-CONTRACTS.md §3.3/§3.4/§3.5）。

        '
      properties:
        chunk_max_tokens:
          type: integer
          default: 600
          minimum: 1
        chunk_overlap:
          type: integer
          default: 100
          minimum: 0
        parent_child:
          $ref: '#/components/schemas/ParentChildConfig'
        clean_rules:
          $ref: '#/components/schemas/CleanRules'
        parse_preview_required:
          type: boolean
          default: false
          description: 'M3-CONTRACTS.md §3.4：默认 false，保证批量上传顺畅。开启后管线在清洗完成后 暂停，文档 process_status=PENDING_CONFIRM，需调用
            confirm 端点才继续切分入库。 '
        chat_aggregation:
          $ref: '#/components/schemas/ChatAggregationConfig'
        hide_parent_with_disabled_child:
          type: boolean
          default: false
          description: when true a parent chunk holding any disabled child is not
            returned at all
        inherit_disable_annotation:
          type: boolean
          default: true
          description: carry disable annotations to a new version when the chunk text
            hash is identical
    CleanRules:
      type: object
      description: 'M3-CONTRACTS.md §3.3：知识库级清洗规则，索引管线 clean 阶段按固定顺序执行—— 去页眉页脚 → 去水印
        → 正则替换 → 脱敏，每步可独立开关；参与 parse_fingerprint 计算 （六元组之一，见需求文档 §4.1），改清洗规则会正确标记文档
        config_stale。 '
      properties:
        strip_header_footer:
          type: boolean
          default: false
          description: 跨页重复行检测（同一文本在 >=60% 页面的首/末两行出现即视为页眉页脚并删除）
        strip_watermark_patterns:
          type: array
          default: []
          items:
            type: string
          description: 水印正则列表，匹配到的文本整体删除
        regex_replacements:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/RegexReplacement'
        excel_header_join:
          type: boolean
          default: true
          description: Excel/CSV 行级切分时是否把表头拼接进每一行
        extract_metadata:
          type: boolean
          default: false
        desensitize:
          $ref: '#/components/schemas/DesensitizeConfig'
    RegexReplacement:
      type: object
      properties:
        pattern:
          type: string
        replacement:
          type: string
    DesensitizeConfig:
      type: object
      description: '正则掩码：手机号保留前 3 后 4、身份证保留前 6 后 4、银行卡保留后 4、邮箱保留域名。 聊天记录导入时默认开启（需求文档
        §4.2）。 '
      properties:
        enabled:
          type: boolean
          default: false
        phone:
          type: boolean
          default: true
        id_card:
          type: boolean
          default: true
        bank_card:
          type: boolean
          default: true
        email:
          type: boolean
          default: false
    ChatAggregationConfig:
      type: object
      description: 'M3-CONTRACTS.md §3.5：聊天记录按“会话 + 时间窗口”聚合为 chunk_type=chat_log 的分片，一期无重叠顺切（步长=窗口）；M8-CONTRACTS.md
        §0.5 增 window_overlap 重叠滑窗（默认 0 保持顺切）。 '
      properties:
        window_minutes:
          type: integer
          default: 60
          minimum: 1
        max_messages:
          type: integer
          default: 50
          minimum: 1
        window_overlap:
          type: integer
          default: 0
          minimum: 0
          description: 'M8 新增：下一窗口重复上一窗口末尾的消息数，0=既有顺切；约束
            window_overlap×2 < max_messages（每条消息至多落两个窗口），违规 INVALID_PARAM。
            开启后聊天 chunk metadata 携带 window_seq 与 msg_span（M8-CONTRACTS.md §0.5）'
    RebuildRequest:
      type: object
      description: M2-CONTRACTS.md §4：doc_ids 缺省 = 该知识库下全部 config_stale=1 文档
      properties:
        doc_ids:
          type: array
          nullable: true
          items:
            type: string
    ConfirmDocumentsRequest:
      type: object
      description: M3-CONTRACTS.md §3.4：doc_ids 缺省 = 该知识库下全部 PENDING_CONFIRM 状态文档
      properties:
        doc_ids:
          type: array
          nullable: true
          items:
            type: string
    PreviewImage:
      type: object
      description: M3-CONTRACTS.md §3.4：预览产物中的图片，preview_url 为限时预签名 URL
      properties:
        image_id:
