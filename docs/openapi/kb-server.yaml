        imported:
          type: boolean
        kb_id:
          type: string
          nullable: true
        doc_count:
          type: integer
          nullable: true
    DemoStatusResult:
      allOf:
      - $ref: '#/components/schemas/ResultEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/DemoStatus'
    ComponentHealth:
      type: string
      enum:
      - UP
      - DOWN
      - UNKNOWN
    HealthStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ComponentHealth'
        components:
          type: object
          properties:
            mysql:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/ComponentHealth'
            elasticsearch:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/ComponentHealth'
            minio:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/ComponentHealth'
            milvus:
              type: object
              description: 仅 VECTOR_ENGINE=milvus 时探活，lite 模式可不出现
              properties:
                status:
                  $ref: '#/components/schemas/ComponentHealth'
    DocumentVersion:
      type: object
      properties:
        version_id:
          type: string
        version:
          type: string
          example: '2.0'
        status:
          type: string
          enum:
          - BUILDING
          - BUILD_FAILED
          - READY
          - ACTIVE
          - ARCHIVED
        content_hash:
          type: string
        chunk_count:
          type: integer
        active:
          type: boolean
        rollback_mode:
          type: string
          enum:
          - INSTANT
          - REBUILD
          description: INSTANT when the target version still owns its chunks, REBUILD
            once archived
        pinned:
          type: boolean
          description: true 表示至少一个未删除的应用版本（含 SUPERSEDED，只要其固化可见集尚未随快照
            清理而清空）引用了这个文档版本，归档保留清理会跳过它（M6-CONTRACTS.md §0.8）
        pinned_by:
          type: array
          items:
            type: string
          description: 引用该文档版本的应用版本业务 id 列表，供控制台解释为何一个版本被跳过归档，
            而不是只把归档动作置灰；pinned=false 时为空数组
        changelog:
          type: string
          nullable: true
        created_at:
          type: string
    ActivateImpact:
      type: object
      properties:
        rollback_mode:
          type: string
          enum:
          - INSTANT
          - REBUILD
        needs_rebuild:
          type: boolean
        stale_annotation_count:
          type: integer
        affected_eval_case_count:
          type: integer
          description: 锚定该 doc_id 且会因本次切换进入待复核（EVIDENCE_STALE）的评测 case 数（M4b-CONTRACTS.md
            §0：M4a 恒为 0 的占位在 M4b 已填实为真实统计）
    ActivateVersionResult:
      type: object
      properties:
        task_id:
          type: string
          nullable: true
          description: null for an INSTANT switch, rebuild task id otherwise
        rollback_mode:
          type: string
          enum:
          - INSTANT
          - REBUILD
    Annotation:
      type: object
      properties:
        annotation_id:
          type: string
        kb_id:
          type: string
        doc_id:
          type: string
        document_version_id:
          type: string
        chunk_id:
          type: string
        annotation_type:
          type: string
          enum:
          - EDIT
          - TOGGLE
          - MERGE
          - SPLIT
        payload:
          type: object
          additionalProperties: true
        chunk_text_hash:
          type: string
        inherit_status:
          type: string
          enum:
          - NOT_INHERITED
          - AUTO_INHERITED
          - REDONE
        operator:
          type: string
        version:
          type: string
        excerpt:
          type: string
        created_at:
          type: string
    ToggleChunkResult:
      type: object
      properties:
        changed_chunk_ids:
          type: array
          items:
            type: string
          description: includes cascaded child chunks when the target is a parent
    SplitChunkResult:
      type: object
      properties:
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/DocumentChunk'
    AnchorType:
      type: string
      description: 评测 case 证据锚定类型（M4b-CONTRACTS.md §1）。SPAN 锚定到具体原文片段（span 非空）；
        DOCUMENT 锚定整篇文档（span 恒为空，图片类 case 仅能用此类型）
      enum:
      - SPAN
      - DOCUMENT
    CaseStatus:
      type: string
      description: t_kb_eval_case.status（与 t_kb_annotation.inherit_status 无关，两套枚举不复用）。
        EVIDENCE_STALE 由文档激活版本切换时同步扫描置入，需人工在证据复核工作台 REANCHOR 或 DEPRECATE
      enum:
      - ACTIVE
      - EVIDENCE_STALE
      - DEPRECATED
    CaseSource:
      type: string
      description: case 来源。DEBUG_PAGE 来自检索调试页一键收进（含检索结果反馈 GOOD 判定），IMPORTED
        来自 Demo 评测集导入
      enum:
      - MANUAL
      - DEBUG_PAGE
      - IMPORTED
    RunStatus:
      type: string
      description: t_kb_eval_run.status。零 Key 环境下 VECTOR_ONLY/HYBRID/HYBRID_RERANK
        直接置 FAILED（fail_reason 说明嵌入模型未配置），不产生误导性指标
      enum:
      - PENDING
      - RUNNING
      - SUCCESS
      - FAILED
    EvalMode:
      type: string
      description: 检索配置矩阵档位到既有检索参数的映射（M4b-CONTRACTS.md §3.1）：BM25_ONLY 禁向量路，
        VECTOR_ONLY 禁 BM25 路，HYBRID 双路+融合、rerank 关，HYBRID_RERANK 双路+融合+rerank
      enum:
      - BM25_ONLY
      - VECTOR_ONLY
      - HYBRID
      - HYBRID_RERANK
    RecheckAction:
      type: string
      description: 证据复核工作台操作（M4b-CONTRACTS.md §2）
      enum:
      - REANCHOR
      - DEPRECATE
    RetrievalFeedbackVerdict:
      type: string
      description: 检索结果反馈判定（M4b-CONTRACTS.md §2）
      enum:
      - GOOD
      - BAD
    EvalCaseEvidence:
      type: object
      description: t_kb_eval_case.evidences 数组元素；DOCUMENT 锚定时 span 为空
      required:
      - doc_id
      - annotated_version_id
      properties:
        doc_id:
          type: string
        span:
          type: string
          nullable: true
          description: 原文摘录片段；anchor_type=DOCUMENT 时恒为空
        annotated_version_id:
          type: string
          description: 标注时该 doc 的激活版本，由服务端按当前激活版本自动填入
    EvalCaseEvidenceInput:
      type: object
      description: 新增/编辑/复核 case 时提交的证据（annotated_version_id 由服务端填入，不由调用方传入）
      required:
      - doc_id
      properties:
        doc_id:
          type: string
        span:
          type: string
          nullable: true
          description: anchor_type=DOCUMENT 时可省略/为空
    EvalCase:
      type: object
