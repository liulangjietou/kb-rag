    parameters:
    - $ref: '#/components/parameters/KbId'
    post:
      tags:
      - search
      summary: 检索调试
      description: '有 Key：向量 + BM25 双路（lite 单引擎两次独立请求）经 RRF(k=60) 融合后取 top_n；

        零 Key：仅 BM25 单路，`degraded` 含 `vector_route_unavailable`。

        强制过滤 document_version_id 属于当前激活版本且 enabled=true（引擎侧 filter）。

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/InvalidParam'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
