      properties:
        annotation_id:
          type: string
        kb_id:
          type: string
        doc_id:
          type: string
        document_version_id:
          type: string
        chunk_id:
          type: string
        annotation_type:
          type: string
          enum:
          - EDIT
          - TOGGLE
          - MERGE
          - SPLIT
        payload:
          type: object
          additionalProperties: true
        chunk_text_hash:
          type: string
        inherit_status:
          type: string
          enum:
          - NOT_INHERITED
          - AUTO_INHERITED
          - REDONE
        operator:
